<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Abyssal Bloom</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #04060f; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  body::after {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 95% 95% at 50% 46%, transparent 52%, rgba(1,2,8,.62) 100%);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* ——— Abyssal Bloom ———
   Bioluminescent filaments advected by a slow, breathing flow
   field, hung over drifting lantern-glows in a dark abyss. */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1, SCALE = 1, PARTICLES = 900;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SCALE = Math.min(W, H) / 760 + 0.55;
  // big, glowing forms always fill the frame
  PARTICLES = Math.round(Math.min(1500, Math.max(650, (W * H) / 1050)));
  buildField();
}

/* ---------- value noise ---------- */
function fade(t) { return t * t * (3 - 2 * t); }
function hash2(ix, iy) {
  let n = Math.sin(ix * 127.1 + iy * 311.7) * 43758.5453123;
  return n - Math.floor(n);
}
function vnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const u = fade(fx), v = fade(fy);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy);
  const c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y) {
  return vnoise(x, y) * 0.62 + vnoise(x * 2.35 + 5.2, y * 2.35 + 1.3) * 0.30 + vnoise(x * 5.1 + 9.7, y * 5.1 + 4.2) * 0.14;
}

/* Evolving flow angle. Two time-drifted fBMs give slow, swirling currents. */
function flowAngle(x, y, t) {
  const s = 0.0038 / SCALE;
  const nx = x * s, ny = y * s;
  const e = 0.14;
  const a1 = Math.PI * 2 * fbm(nx + t * 0.055, ny - t * 0.038);
  const gradNoise = fbm(nx * 1.7 - t * 0.021, ny * 1.7 + t * 0.017);
  return a1 + gradNoise * Math.PI * e;
}

/* ---------- state ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;

let particles = [];
let orbs = [];
let t = 0;
let last = performance.now();
let nextBloom = 1.2;
let bloomPulse = 0;       // 0..1 decaying brightness burst
let baseHue = 205;        // slowly tidal hue drift

function newParticle(px, py, burst) {
  const hueShift = rand(-46, 52);
  return {
    x: px, y: py,
    px: px + rand(-1, 1), py: py + rand(-1, 1),
    vx: burst ? Math.cos(rand(0, TAU)) * rand(2, 5.5) : rand(-.4, .4),
    vy: burst ? Math.sin(rand(0, TAU)) * rand(2, 5.5) : rand(-.4, .4),
    life: burst ? rand(60, 130) : rand(160, 420),
    hue: hueShift,
    sat: rand(78, 100),
    lig: rand(55, 72),
    size: burst ? rand(0.8, 2.2) : rand(0.6, 2.0),
    glow: rand(0.7, 1.6)
  };
}

function spawnAmbient() {
  const pts = [];
  const n = 6;
  for (let i = 0; i < n; i++) pts.push({ x: rand(0.12, 0.88) * W, y: rand(0.18, 0.95) * H });
  return pts[(Math.random() * pts.length) | 0];
}

function spawnParticle() {
  const p = Math.random() < 0.32 ? spawnAmbient() : { x: rand(0, W), y: rand(0, H) };
  return newParticle(p.x, p.y, false);
}

function buildField() {
  particles = [];
  for (let i = 0; i < PARTICLES; i++) {
    const p = spawnParticle();
    p.life = rand(30, 420);
    // give particles a head start so frame 1 is alive, not blank
    for (let k = 0; k < 46; k++) stepParticle(p, 16.6667);
    particles.push(p);
  }
  orbs = [];
  for (let i = 0; i < 4; i++) {
    orbs.push({
      x: rand(0.15, 0.85) * W,
      y: rand(0.2, 0.9) * H,
      r: rand(0.32, 0.62) * Math.min(W, H) * SCALE,
      hue: [190, 315, 175, 325][i % 4] + rand(-15, 15),
      sat: rand(80, 95),
      lig: rand(38, 52),
      drift: rand(0.14, 0.3),
      seed: rand(0, 100),
      speed: rand(6, 16)
    });
  }
}

function stepParticle(p, dt) {
  const sdt = dt / 16.6667; // delta in 60fps units
  const ang = flowAngle(p.x, p.y, t);
  const target = 1.75 + Math.sin(t * 0.6 + p.hue) * 0.5;
  // ease velocity toward flow direction
  const k = Math.min(0.5, 0.09 * sdt);
  const fx = Math.cos(ang) * target, fy = Math.sin(ang) * target;
  p.vx += (fx - p.vx) * k;
  p.vy += (fy - p.vy) * k;
  // turbulence jitter
  p.vx += (vnoise(p.x * 0.02 + t * 1.7, p.y * 0.02 + t * 1.3) - 0.5) * 0.24 * sdt;
  p.vy += (vnoise(p.x * 0.02 - t * 1.4, p.y * 0.02 + t * 1.6 + 9) - 0.5) * 0.24 * sdt;
  // confinement: pull gently toward the heart of the bloom
  const cx = W * 0.5, cy = H * 0.52;
  p.vx += ((cx - p.x) * 0.00016 - p.vx * 0.006) * sdt;
  p.vy += ((cy - p.y) * 0.00016 - p.vy * 0.006) * sdt;
  const maxV = 3.4;
  const sp = Math.hypot(p.vx, p.vy) || 1;
  if (sp > maxV) { p.vx = p.vx / sp * maxV; p.vy = p.vy / sp * maxV; }
  p.px = p.x; p.py = p.y;
  p.x += p.vx * sdt;
  p.y += p.vy * sdt;
  p.life -= sdt;
  if (p.x < -40 || p.x > W + 40 || p.y < -40 || p.y > H + 40) p.life = 0;
}

function bloomBurst() {
  const bx = rand(W * 0.18, W * 0.82);
  const by = rand(H * 0.14, H * 0.82);
  bloomPulse = 1;
  const count = Math.round(PARTICLES * 0.085);
  for (let i = 0; i < count; i++) {
    particles[(Math.random() * particles.length) | 0] = newParticle(bx, by, true);
  }
}

function drawOrb(o, time) {
  const x = o.x + Math.cos(time * 0.11 + o.seed) * o.speed * SCALE * 6;
  const y = o.y + Math.sin(time * 0.083 + o.seed * 1.7) * o.speed * SCALE * 5;
  const rr = o.r * (1 + 0.12 * Math.sin(time * 0.5 + o.seed));
  const g = ctx.createRadialGradient(x, y, 0, x, y, rr);
  g.addColorStop(0, `hsla(${o.hue}, ${o.sat}%, ${o.lig}%, ${0.16 + bloomPulse * 0.12})`);
  g.addColorStop(0.55, `hsla(${o.hue}, ${o.sat}%, ${o.lig * 0.7}%, 0.05)`);
  g.addColorStop(1, 'hsla(0, 0%, 0%, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(x - rr, y - rr, rr * 2, rr * 2);
}

function frame(now) {
  let dt = now - last; last = now;
  if (dt > 50) dt = 50;
  const sdt = dt / 16.6667;
  t += dt * 0.001;
  baseHue = 205 + Math.sin(t * 0.045) * 38; // tidal hue drift: cyan ↔ violet ↔ rose
  bloomPulse = Math.max(0, bloomPulse - dt * 0.0011);
  nextBloom -= dt;
  if (nextBloom <= 0) {
    bloomBurst();
    nextBloom = rand(2600, 6200);
  }

  // fade previous frame — the engine of the trail effect
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(4, 6, 15, 0.17)';
  ctx.fillRect(0, 0, W, H);

  // drifting lantern orbs (large forms)
  ctx.globalCompositeOperation = 'lighter';
  for (const o of orbs) drawOrb(o, t);

  // filament particles — additive streaks
  ctx.lineCap = 'round';
  for (let i = 0; i < particles.length; i++) {
    let p = particles[i];
    stepParticle(p, dt);
    if (p.life <= 0) {
      p = spawnParticle();
      particles[i] = p;
      continue;
    }
    const flick = 0.75 + 0.25 * Math.sin(t * 3.1 + p.hue * 3.7 + i * 1.7);
    const a = Math.min(1, (p.life < 30 ? p.life / 30 : 1)) * flick * p.glow * (0.35 + bloomPulse * 0.5);
    const hue = (baseHue + p.hue + 720) % 360;
    ctx.strokeStyle = `hsla(${hue}, ${p.sat}%, ${p.lig}%, ${a})`;
    ctx.lineWidth = p.size * (0.7 + 0.6 * SCALE);
    ctx.beginPath();
    ctx.moveTo(p.px, p.py);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    // hot core on bright filaments
    if (p.glow > 1.25) {
      ctx.fillStyle = `hsla(${hue}, ${p.sat}%, ${Math.min(88, p.lig + 22)}%, ${a * 0.9})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 0.55 * SCALE, 0, TAU);
      ctx.fill();
    }
  }

  // slow "breath" shimmer from the deep
  if ((frame.frame = (frame.frame || 0) + 1) % 24 === 0) {
    const g = ctx.createRadialGradient(W * 0.5, H * 1.15, 0, W * 0.5, H * 1.15, H * 0.75);
    g.addColorStop(0, `hsla(${(baseHue + 150) % 360}, 85%, 42%, ${0.10 + bloomPulse * 0.16})`);
    g.addColorStop(1, 'hsla(0, 0%, 0%, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  requestAnimationFrame(frame);
}

resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
requestAnimationFrame(frame);
</script>
</body>
</html>
