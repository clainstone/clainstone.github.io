<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tidal Bloom — molten light on black water</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #03040c;
    overflow: hidden;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: default;
  }
</style>
</head>
<body>
<canvas id="art" aria-hidden="true"></canvas>
<script>
(() => {
  const canvas = document.getElementById('art');
  const ctx = canvas.getContext('2d', { alpha: false });
  let W = 0, H = 0, DPR = 1, t0 = performance.now();
  let last = t0;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const speed = reduced ? 0.25 : 1;
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const noise1 = (x, t) =>
    Math.sin(x * 1.65 + t * 0.62) * 0.55 +
    Math.sin(x * 3.05 - t * 0.95 + 1.7) * 0.3 +
    Math.sin(x * 5.4 + t * 1.35 + 4.2) * 0.15;
  function glowSprite(r, g, b) {
    const s = 128;
    const c = document.createElement('canvas');
    c.width = c.height = s;
    const g2 = c.getContext('2d');
    const grd = g2.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grd.addColorStop(0, `rgba(${r},${g},${b},1)`);
    grd.addColorStop(0.22, `rgba(${r},${g},${b},0.75)`);
    grd.addColorStop(0.55, `rgba(${r},${g},${b},0.16)`);
    grd.addColorStop(1, `rgba(${r},${g},${b},0)`);
    g2.fillStyle = grd;
    g2.fillRect(0, 0, s, s);
    return c;
  }
  const sprite = {
    amber: glowSprite(255, 176, 82),
    coral: glowSprite(255, 79, 68),
    teal: glowSprite(58, 242, 208),
    magenta: glowSprite(226, 82, 255),
    violet: glowSprite(126, 92, 255),
    white: glowSprite(255, 244, 220)
  };
  let stars = [];
  let plankton = [];
  let bokeh = [];
  let noisePattern = null;
  function buildNoise() {
    const n = 140;
    const c = document.createElement('canvas');
    c.width = c.height = n;
    const g = c.getContext('2d');
    const img = g.createImageData(n, n);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.random() * 255;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    noisePattern = ctx.createPattern(c, 'repeat');
  }
  function resize() {
    DPR = clamp(window.devicePixelRatio || 1, 1, 1.75);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const horizon = H * 0.665;
    stars = Array.from({ length: Math.floor(W * H / 8500) + 90 }, () => ({
      x: Math.random(),
      y: Math.pow(Math.random(), 1.35) * horizon * 0.94,
      r: Math.random() * 1.35 + 0.35,
      ph: Math.random() * TAU,
      sp: 0.5 + Math.random() * 1.6,
      warm: Math.random() < 0.18
    }));
    plankton = Array.from({ length: 190 }, () => ({
      x: Math.random(),
      y: Math.random(),
      z: 0.25 + Math.random() * 0.75,
      size: 1 + Math.random() * 2.6,
      hue: ['coral', 'amber', 'teal', 'magenta'][Math.floor(Math.random() * 4)],
      drift: -0.006 + Math.random() * 0.012,
      rise: 0.018 + Math.random() * 0.045,
      ph: Math.random() * TAU
    }));
    bokeh = Array.from({ length: 26 }, () => ({
      x: Math.random(),
      y: Math.random(),
      r: 14 + Math.random() * 42,
      hue: ['teal', 'magenta', 'amber'][Math.floor(Math.random() * 3)],
      ph: Math.random() * TAU,
      drift: 0.5 + Math.random()
    }));
  }
  function drawBackdrop(t, horizon) {
    const sky = ctx.createLinearGradient(0, 0, 0, horizon * 1.18);
    sky.addColorStop(0, '#02020a');
    sky.addColorStop(0.42, '#071024');
    sky.addColorStop(0.78, '#1b1038');
    sky.addColorStop(1, '#4a1730');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, horizon + 40);
    // horizon barrel glow
    const hg = ctx.createRadialGradient(W * 0.5, horizon, 10, W * 0.5, horizon, W * 0.72);
    hg.addColorStop(0, 'rgba(255,122,67,0.9)');
    hg.addColorStop(0.26, 'rgba(210,55,95,0.42)');
    hg.addColorStop(0.62, 'rgba(94,34,112,0.16)');
    hg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = hg;
    ctx.fillRect(0, 0, W, horizon + 120);
  }
  function drawStars(t, horizon) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const s of stars) {
      const tw = 0.42 + 0.58 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
      const a = clamp(tw * (1 - s.y / (horizon + 1)) * 1.15, 0.04, 0.92);
      ctx.globalAlpha = a;
      ctx.fillStyle = s.warm ? '#ffd9a0' : '#cfe6ff';
      ctx.beginPath();
      ctx.arc(s.x * W, s.y, s.r, 0, TAU);
      ctx.fill();
      if (s.r > 1.15) {
        ctx.globalAlpha = a * 0.5;
        const d = s.r * 7;
        ctx.drawImage(sprite.white, s.x * W - d, s.y - d, d * 2, d * 2);
      }
    }
    ctx.restore();
  }
  function drawPlanet(t, horizon) {
    const R = Math.min(W, H) * 0.155;
    const x = W * (0.235 + 0.035 * Math.sin(t * 0.045));
    const y = H * (0.27 + 0.022 * Math.sin(t * 0.061 + 1.3));
    const breathe = 1 + 0.035 * Math.sin(t * 0.9);
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(breathe, breathe);
    // halo behind
    ctx.globalCompositeOperation = 'lighter';
    const halo = ctx.drawImage(sprite.violet, -R * 3.1, -R * 3.1, R * 6.2, R * 6.2);
    ctx.globalCompositeOperation = 'source-over';
    // back ring
    ctx.save();
    ctx.rotate(-0.42);
    ctx.lineWidth = R * 0.13;
    ctx.strokeStyle = 'rgba(94,226,255,0.34)';
    ctx.beginPath();
    ctx.ellipse(0, 0, R * 1.78, R * 0.43, 0, Math.PI * 1.02, Math.PI * 1.98);
    ctx.stroke();
    ctx.restore();
    // sphere, lit from beneath like it is kissed by the sun
    const sg = ctx.createRadialGradient(-R * 0.35, R * 0.95, R * 0.1, 0, 0, R * 1.15);
    sg.addColorStop(0, '#ffb26b');
    sg.addColorStop(0.18, '#e45b67');
    sg.addColorStop(0.46, '#5d2a75');
    sg.addColorStop(0.76, '#171033');
    sg.addColorStop(1, '#05030f');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, TAU);
    ctx.fill();
    // limb darkening / atmosphere rim
    const rim = ctx.createRadialGradient(0, 0, R * 0.72, 0, 0, R * 1.02);
    rim.addColorStop(0, 'rgba(0,0,0,0)');
    rim.addColorStop(0.86, 'rgba(255,125,91,0.16)');
    rim.addColorStop(1, 'rgba(255,178,120,0.48)');
    ctx.fillStyle = rim;
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, TAU);
    ctx.fill();
    // clouds bands
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, TAU);
    ctx.clip();
    ctx.globalAlpha = 0.32;
    const bandGrad = ctx.createLinearGradient(0, -R, 0, R);
    bandGrad.addColorStop(0, 'rgba(28,16,52,0)');
    bandGrad.addColorStop(0.42, 'rgba(122,64,148,0.34)');
    bandGrad.addColorStop(0.56, 'rgba(255,143,111,0.42)');
    bandGrad.addColorStop(0.68, 'rgba(24,9,46,0.28)');
    bandGrad.addColorStop(1, 'rgba(8,2,18,0.62)');
    ctx.fillStyle = bandGrad;
    ctx.fillRect(-R, -R, R * 2, R * 2);
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = '#ff8f6b';
    ctx.fillRect(-R, R * 0.28 + Math.sin(t * 0.5) * R * 0.02, R * 2, R * 0.085);
    ctx.restore();
    // front ring
    ctx.save();
    ctx.rotate(-0.42);
    ctx.lineWidth = R * 0.16;
    const ringGrad = ctx.createLinearGradient(-R * 1.8, 0, R * 1.8, 0);
    ringGrad.addColorStop(0, 'rgba(58,242,208,0)');
    ringGrad.addColorStop(0.24, 'rgba(58,242,208,0.72)');
    ringGrad.addColorStop(0.5, 'rgba(255,170,120,0.95)');
    ringGrad.addColorStop(0.78, 'rgba(226,82,255,0.72)');
    ringGrad.addColorStop(1, 'rgba(226,82,255,0)');
    ctx.strokeStyle = ringGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, R * 1.78, R * 0.43, 0, 0.03 * Math.PI, 0.97 * Math.PI);
    ctx.stroke();
    ctx.globalAlpha = 0.75;
    ctx.lineWidth = R * 0.045;
    ctx.strokeStyle = 'rgba(230,255,250,0.66)';
    ctx.beginPath();
    ctx.ellipse(0, 0, R * 2.02, R * 0.5, 0, 0.08 * Math.PI, 0.92 * Math.PI);
    ctx.stroke();
    ctx.restore();
    ctx.restore();
  }
  function drawAurora(t, horizon) {
    const bands = [
      { y: 0.16, amp: 0.075, freq: 3.1, sp: 0.85, w: 90, col: '58,242,208', a: 0.34 },
      { y: 0.27, amp: 0.095, freq: 4.3, sp: -0.66, w: 120, col: '226,82,255', a: 0.27 },
      { y: 0.1, amp: 0.055, freq: 5.2, sp: 1.15, w: 64, col: '140,120,255', a: 0.24 }
    ];
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const b of bands) {
      for (let layer = 0; layer < 3; layer++) {
        const thick = b.w * (1 - layer * 0.32);
        ctx.beginPath();
        const step = Math.max(10, W / 96);
        for (let x = -step; x <= W + step; x += step) {
          const nx = x / W;
          const yy = H * b.y
            + H * b.amp * noise1(nx * b.freq + layer * 1.7, t * b.sp + layer)
            + Math.sin(t * 0.7 + nx * 9 + layer * 2) * H * 0.012;
          if (x === -step) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
        }
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = thick;
        ctx.strokeStyle = `rgba(${b.col},${b.a / (layer + 1.35)})`;
        ctx.stroke();
      }
      // bright core thread
      ctx.beginPath();
      const step = Math.max(10, W / 96);
      for (let x = -step; x <= W + step; x += step) {
        const nx = x / W;
        const yy = H * b.y + H * b.amp * noise1(nx * b.freq + 3.1, t * b.sp + 2)
          + Math.sin(t * 0.85 + nx * 12) * H * 0.008;
        if (x === -step) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
      }
      ctx.lineWidth = 2.1;
      ctx.strokeStyle = `rgba(235,255,250,${b.a * 0.78})`;
      ctx.stroke();
    }
    ctx.restore();
  }
  function waveY(x, yBase, amp, len, speedV, phase, t) {
    return yBase
      + Math.sin((x / len) + t * speedV + phase) * amp
      + Math.sin((x / (len * 0.37)) - t * speedV * 1.55 + phase * 1.8) * amp * 0.34;
  }
  function drawSea(t, horizon) {
    const sea = ctx.createLinearGradient(0, horizon, 0, H);
    sea.addColorStop(0, '#241034');
    sea.addColorStop(0.18, '#120d2e');
    sea.addColorStop(0.62, '#050818');
    sea.addColorStop(1, '#01020a');
    ctx.fillStyle = sea;
    ctx.fillRect(0, horizon, W, H - horizon);
    // sinking sun disc touching the horizon
    const sunY = horizon - H * 0.018;
    const sunR = Math.min(W, H) * 0.128 * (1 + 0.018 * Math.sin(t * 1.7));
    const sunX = W * 0.5 + Math.sin(t * 0.08) * W * 0.012;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(sprite.coral, sunX - sunR * 4.6, sunY - sunR * 2.4, sunR * 9.2, sunR * 4.8);
    ctx.drawImage(sprite.amber, sunX - sunR * 2.25, sunY - sunR * 2.25, sunR * 4.5, sunR * 4.5);
    const disc = ctx.createLinearGradient(0, sunY - sunR, 0, sunY + sunR);
    disc.addColorStop(0, '#fff0bd');
    disc.addColorStop(0.45, '#ffc15c');
    disc.addColorStop(0.82, '#ff6a3d');
    disc.addColorStop(1, '#d92f4b');
    ctx.fillStyle = disc;
    ctx.beginPath();
    ctx.arc(sunX, sunY, sunR, 0, TAU);
    ctx.fill();
    ctx.restore();
    // sun rays rotating slowly through the gloom
    ctx.save();
    ctx.translate(sunX, sunY);
    ctx.rotate(Math.sin(t * 0.11) * 0.18);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 9; i++) {
      const ang = -Math.PI / 2 + (i - 4) * 0.155 + Math.sin(t * 0.23 + i) * 0.028;
      const len = H * (0.95 + 0.3 * Math.sin(i * 2.17 + 1));
      const spread = 0.028 + 0.011 * Math.sin(t * 0.6 + i * 1.7);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(ang - spread) * len, Math.sin(ang - spread) * len);
      ctx.lineTo(Math.cos(ang + spread) * len, Math.sin(ang + spread) * len);
      ctx.closePath();
      ctx.fillStyle = `rgba(255,${130 + Math.floor(60 * Math.sin(i * 1.3))},60,0.075)`;
      ctx.fill();
    }
    ctx.restore();
    // water reflection doorway
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const column = ctx.createLinearGradient(0, horizon, 0, H);
    column.addColorStop(0, 'rgba(255,178,92,0.72)');
    column.addColorStop(0.28, 'rgba(255,96,64,0.34)');
    column.addColorStop(1, 'rgba(255,60,60,0)');
    for (let y = horizon + 2; y < H; y += 7) {
      const k = (y - horizon) / (H - horizon);
      const wob = noise1(y * 0.018, t * 1.35) * (18 + k * 70);
      const half = (sunR * (0.24 + k * 1.05)) * (0.62 + 0.38 * (0.5 + 0.5 * Math.sin(y * 0.32 + t * 2.1 + wob * 0.08)));
      ctx.globalAlpha = clamp(1 - k * 1.08, 0, 1) * 0.55;
      ctx.fillStyle = column;
      ctx.fillRect(sunX + wob - half, y, half * 2, 3.4);
    }
    ctx.restore();
  }
  function drawRidge(t, horizon, offset, amp, color, jag) {
    ctx.beginPath();
    ctx.moveTo(-4, horizon + 26);
    for (let x = -4; x <= W + 4; x += 9) {
      const u = x * 0.006 + offset;
      const y = horizon
        - Math.abs(Math.sin(u * 1.7 + jag)) * amp
        - Math.sin(u * 4.6 + jag * 2.2) * amp * 0.3
        - Math.max(0, Math.sin(u * 8.4 + t * 0.05)) * amp * 0.2;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W + 4, horizon + 80);
    ctx.lineTo(W + 4, horizon + 26);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }
  function drawWaves(t, horizon) {
    const waves = [
      { y: horizon + H * 0.045, amp: 7, len: 150, sp: 1.25, ph: 0.4, tone: '#143450', rim: '91,226,255', rl: 1.6 },
      { y: horizon + H * 0.14, amp: 13, len: 190, sp: -1.05, ph: 2.1, tone: '#0d2740', rim: '64,255,205', rl: 2.2 },
      { y: horizon + H * 0.275, amp: 23, len: 250, sp: 0.82, ph: 4.0, tone: '#081a2c', rim: '140,92,255', rl: 2.8 },
      { y: horizon + H * 0.43, amp: 38, len: 320, sp: -0.62, ph: 5.5, tone: '#030c1c', rim: '255,91,110', rl: 3.4 },
      { y: horizon + H * 0.68, amp: 58, len: 430, sp: 0.5, ph: 1.2, tone: '#01030c', rim: '255,143,77', rl: 4.2 }
    ];
    for (const w of waves) {
      ctx.beginPath();
      ctx.moveTo(-8, H + 8);
      const step = Math.max(5, W / 160);
      for (let x = -8; x <= W + 8; x += step) ctx.lineTo(x, waveY(x, w.y, w.amp, w.len, w.sp, w.ph, t));
      ctx.lineTo(W + 8, H + 8);
      ctx.closePath();
      ctx.fillStyle = w.tone;
      ctx.fill();
      // crest glow
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const pass of [4.2, 1.7]) {
        ctx.beginPath();
        for (let x = -8; x <= W + 8; x += step) {
          const y = waveY(x, w.y, w.amp, w.len, w.sp, w.ph, t);
          if (x === -8) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.lineWidth = w.rl * pass;
        ctx.strokeStyle = `rgba(${w.rim},${pass === 1.7 ? 0.5 : 0.1})`;
        ctx.stroke();
      }
      ctx.restore();
    }
  }
  function drawPlankton(t, dt, horizon) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // mid bokeh
    for (const b of bokeh) {
      const bx = ((b.x + Math.sin(t * 0.055 * b.drift + b.ph) * 0.018) % 1.15) * W;
      const by = horizon + b.y * (H - horizon) * 0.92 + Math.sin(t * 0.09 + b.ph) * 12;
      const pulse = 0.16 + 0.16 * (0.5 + 0.5 * Math.sin(t * 0.9 + b.ph));
      ctx.globalAlpha = pulse;
      ctx.drawImage(sprite[b.hue], bx - b.r, by - b.r, b.r * 2, b.r * 2);
    }
    // bright drifting spores
    for (const p of plankton) {
      p.y -= p.rise * dt;
      p.x += p.drift * dt;
      if (p.y < horizon / H - 0.06) { p.y = 1.05; p.x = Math.random(); }
      if (p.x < -0.05) p.x += 1.1; else if (p.x > 1.05) p.x -= 1.1;
      const px = p.x * W + Math.sin(t * (0.35 + p.z * 0.3) + p.ph) * 18 * p.z;
      const py = p.y * H;
      if (py < horizon - 20) continue;
      const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * (1.1 + p.z) + p.ph * 2));
      const sz = p.size * (5 + p.z * 12);
      ctx.globalAlpha = tw * (0.35 + p.z * 0.55);
      ctx.drawImage(sprite[p.hue], px - sz, py - sz, sz * 2, sz * 2);
      ctx.globalAlpha = tw;
      ctx.fillStyle = '#fff7e6';
      ctx.beginPath();
      ctx.arc(px, py, Math.max(0.6, p.size * 0.42 * (0.7 + p.z)), 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }
  function drawForegroundHaze(t, horizon) {
    const hg = ctx.createLinearGradient(0, H * 0.78, 0, H);
    hg.addColorStop(0, 'rgba(2,3,16,0)');
    hg.addColorStop(1, 'rgba(8,4,24,0.72)');
    ctx.fillStyle = hg;
    ctx.fillRect(0, H * 0.78, W, H * 0.22);
    // slow luminous blooms resting on the swells
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const bx = W * (0.24 + 0.08 * Math.sin(t * 0.21));
    const by = H * 0.86 + Math.sin(t * 0.5 + 2) * 12;
    ctx.globalAlpha = 0.42 + 0.14 * Math.sin(t * 0.83);
    ctx.drawImage(sprite.teal, bx - 95, by - 62, 190, 124);
    const dx = W * (0.76 + 0.06 * Math.cos(t * 0.17 + 1));
    const dy = H * 0.74 + Math.cos(t * 0.43) * 9;
    ctx.globalAlpha = 0.34 + 0.12 * Math.sin(t * 0.7 + 3);
    ctx.drawImage(sprite.magenta, dx - 72, dy - 54, 144, 108);
    ctx.restore();
  }
  function drawGrade(t) {
    // vignette
    const vg = ctx.createRadialGradient(W / 2, H * 0.46, Math.min(W, H) * 0.34, W / 2, H * 0.54, Math.max(W, H) * 0.82);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(0.74, 'rgba(0,0,0,0.28)');
    vg.addColorStop(1, 'rgba(0,0,0,0.78)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
    // grain
    if (noisePattern) {
      ctx.save();
      ctx.globalAlpha = 0.055;
      ctx.globalCompositeOperation = 'overlay';
      const ox = (Math.floor(t * 9) % 2) * 24;
      const oy = (Math.floor(t * 7) % 2) * 31;
      ctx.translate(-ox, -oy);
      ctx.fillStyle = noisePattern;
      ctx.fillRect(0, 0, W + 80, H + 80);
      ctx.restore();
    }
    // subtle scan/shimmer drift at the very bottom edge
    const edge = ctx.createLinearGradient(0, H - 26, 0, H);
    edge.addColorStop(0, 'rgba(0,0,0,0)');
    edge.addColorStop(1, 'rgba(31,10,42,0.85)');
    ctx.fillStyle = edge;
    ctx.fillRect(0, H - 26, W, 26);
  }
  function frame(now) {
    const rawDt = clamp((now - last) / 1000, 0.001, 0.05);
    last = now;
    const t = ((now - t0) / 1000) * speed;
    const horizon = H * 0.665;
    drawBackdrop(t, horizon);
    drawStars(t, horizon);
    drawAurora(t, horizon);
    drawPlanet(t, horizon);
    drawSea(t, horizon);
    drawRidge(t, horizon, 2.7, H * 0.072, '#170b29', 1.35);
    drawRidge(t, horizon + H * 0.006, 9.1, H * 0.04, '#0a0518', 4.2);
    drawWaves(t, horizon);
    drawPlankton(t, rawDt * speed, horizon);
    drawForegroundHaze(t, horizon);
    drawGrade(t);
    requestAnimationFrame(frame);
  }
  buildNoise();
  resize();
  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('orientationchange', () => setTimeout(resize, 120), { passive: true });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
