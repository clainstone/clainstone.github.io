<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cinder Hours</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05020d;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: default;
  }
</style>
</head>
<body>
<canvas id="art" aria-hidden="true"></canvas>
<script>
(() => {
  const canvas = document.getElementById('art');
  const gl = canvas.getContext('webgl', { antialias: false, alpha: false, depth: false, preserveDrawingBuffer: false });
  if (!gl) return;

  const vertexSource = `
    attribute vec2 position;
    void main() {
      gl_Position = vec4(position, 0.0, 1.0);
    }
  `;

  const fragmentSource = `
    precision highp float;
    uniform vec2 uRes;
    uniform float uTime;
    uniform vec2 uPointer;

    float hash(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }

    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(
        mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
        mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
        u.y
      );
    }

    float fbm(vec2 p) {
      float sum = 0.0;
      float amp = 0.55;
      mat2 rot = mat2(0.80, -0.60, 0.60, 0.80);
      for (int i = 0; i < 5; i++) {
        sum += amp * noise(p);
        p = rot * p * 2.03 + vec2(11.7, 7.1);
        amp *= 0.52;
      }
      return sum;
    }

    void main() {
      vec2 p = (gl_FragCoord.xy - 0.5 * uRes.xy) / min(uRes.x, uRes.y);
      float t = uTime * 0.055;
      vec2 pointer = (uPointer - 0.5) * vec2(0.55, 0.75);
      vec2 q = p * 1.18 + pointer * 0.28;

      vec2 warpA = vec2(
        fbm(q * 1.55 + vec2(t * 0.85, -t * 0.48)),
        fbm(q * 1.55 + vec2(11.4, 3.7) - vec2(t * 0.62, t * 0.72))
      );
      vec2 warpB = vec2(
        fbm(q * 2.45 + 2.9 * warpA + vec2(5.7, 19.2) + vec2(t * 0.72, t * 0.35)),
        fbm(q * 2.45 + 2.9 * warpA + vec2(39.1, 2.6) - vec2(t * 0.55, t * 0.82))
      );

      float density = fbm(q * 2.75 + 4.25 * warpB + vec2(-t * 0.25, t * 0.18));
      float filigree = fbm(q * 4.8 - warpB * 1.65 + vec2(t * 1.15, -t * 0.8));
      float cool = fbm(q * 2.05 + warpA * 2.1 - vec2(7.4, 12.8) + vec2(-t * 0.42, t * 0.28));
      float warm = fbm(q * 2.55 - warpB * 1.2 + vec2(13.5, -8.2) + vec2(t * 0.38, -t * 0.18));

      float d = length(p);
      float core = exp(-d * 2.15);
      float sideNoise = p.x + 0.34 * sin(uTime * 0.18 + p.y * 1.7);
      float side = 1.0 - smoothstep(-0.65, 0.72, sideNoise);
      float diagonalValue = p.y + p.x * 0.58 + 0.25 * warpA.x;
      float diagonal = 1.0 - smoothstep(-0.8, 0.9, diagonalValue);

      vec3 midnight = vec3(0.012, 0.006, 0.045);
      vec3 indigo = vec3(0.075, 0.018, 0.185);
      vec3 violet = vec3(0.27, 0.035, 0.43);
      vec3 magenta = vec3(0.78, 0.075, 0.36);
      vec3 coral = vec3(0.98, 0.245, 0.115);
      vec3 amber = vec3(1.00, 0.61, 0.18);
      vec3 ember = vec3(1.00, 0.88, 0.48);
      vec3 teal = vec3(0.015, 0.43, 0.50);
      vec3 biolume = vec3(0.05, 0.82, 0.78);

      vec3 color = mix(midnight, indigo, smoothstep(0.08, 0.72, density));
      color = mix(color, violet, smoothstep(0.36, 0.74, warpB.x * 0.62 + density * 0.48));
      color = mix(color, magenta, smoothstep(0.42, 0.82, density + 0.18 * filigree - 0.10 * cool));
      color = mix(color, coral, smoothstep(0.50, 0.92, warm * 0.72 + core * 0.34));
      color = mix(color, amber, smoothstep(0.62, 0.98, density * warm + core * 0.46));
      color = mix(color, ember, smoothstep(0.82, 1.08, density * warm * 0.72 + core * 0.86));

      float coolMask = smoothstep(0.58, 0.90, cool - density * 0.22 + 0.18 * (1.0 - core));
      color = mix(color, teal, coolMask * 0.52);
      color = mix(color, biolume, smoothstep(0.74, 0.96, cool + 0.20 * filigree - core * 0.20) * 0.28);
      color += vec3(0.08, 0.35, 0.42) * coolMask * 0.13;

      float current = pow(smoothstep(0.66, 0.98, filigree + 0.18 * side), 2.4);
      color += vec3(1.0, 0.34, 0.08) * current * (0.34 + 0.55 * core + 0.22 * side);
      color += vec3(0.18, 0.72, 0.78) * pow(smoothstep(0.74, 1.0, cool + 0.12 * diagonal), 3.0) * 0.22;

      float ring = pow(0.5 + 0.5 * sin(d * 23.0 - uTime * 0.75 + warpA.y * 5.0), 6.0);
      color += vec3(0.32, 0.05, 0.38) * ring * (1.0 - smoothstep(0.0, 0.18, abs(d - 0.58)));

      color += ember * core * 0.48;
      color += vec3(0.36, 0.07, 0.18) * (1.0 - smoothstep(0.0, 1.3, d)) * 0.20;

      float grain = hash(gl_FragCoord.xy + fract(uTime) * 431.7) - 0.5;
      color += grain * 0.052;

      float vignette = 1.0 - smoothstep(0.34, 1.42, length(p * vec2(0.86, 1.18)));
      color *= mix(0.28, 1.12, vignette);
      color = pow(color, vec3(0.94));

      gl_FragColor = vec4(color, 1.0);
    }
  `;

  function compile(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const error = gl.getShaderInfoLog(shader);
      gl.deleteShader(shader);
      throw new Error('Shader compile failed: ' + error);
    }
    return shader;
  }

  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error('Shader link failed');
  }
  gl.useProgram(program);

  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const position = gl.getAttribLocation(program, 'position');
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

  const resolutionLocation = gl.getUniformLocation(program, 'uRes');
  const timeLocation = gl.getUniformLocation(program, 'uTime');
  const pointerLocation = gl.getUniformLocation(program, 'uPointer');
  const pointer = { x: 0.5, y: 0.46, targetX: 0.5, targetY: 0.46 };

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const width = Math.max(1, Math.floor(window.innerWidth * dpr));
    const height = Math.max(1, Math.floor(window.innerHeight * dpr));
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
      gl.viewport(0, 0, width, height);
    }
  }

  function pointerFromEvent(event) {
    const source = event.touches && event.touches[0] ? event.touches[0] : event;
    if (typeof source.clientX !== 'number' || typeof source.clientY !== 'number') return;
    pointer.targetX = source.clientX / Math.max(1, window.innerWidth);
    pointer.targetY = 1.0 - source.clientY / Math.max(1, window.innerHeight);
  }

  window.addEventListener('pointermove', pointerFromEvent, { passive: true });
  window.addEventListener('pointerdown', pointerFromEvent, { passive: true });
  window.addEventListener('touchmove', pointerFromEvent, { passive: true });
  window.addEventListener('resize', resize, { passive: true });
  resize();

  const start = performance.now();
  function frame(now) {
    resize();
    const time = (now - start) / 1000;
    pointer.x += (pointer.targetX - pointer.x) * 0.035;
    pointer.y += (pointer.targetY - pointer.y) * 0.035;
    gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
    gl.uniform1f(timeLocation, time);
    gl.uniform2f(pointerLocation, pointer.x, pointer.y);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
