<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tides of Starlight</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#02010a;}
  canvas{display:block;width:100vw;height:100vh;}
  #vig{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0) 52%, rgba(1,0,8,.62) 100%);}
</style>
</head>
<body>
<canvas id="art"></canvas>
<div id="vig"></div>
<script>
'use strict';
/* ---------- Tides of Starlight ----------
   aurora over a cold indigo sea. No assets; everything drawn per frame. */
const cvs = document.getElementById('art');
const ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1;
let skyGrad, seaGrad, grainPat;

/* deterministic PRNG so the scene is stable */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(20240521);

const rgba = (c,a) => 'rgba('+((c[0]|0))+','+((c[1]|0))+','+((c[2]|0))+','+a+')';

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.round(W*DPR); cvs.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  skyGrad = ctx.createLinearGradient(0,0,0,H);
  skyGrad.addColorStop(0.00,'#020114');
  skyGrad.addColorStop(0.28,'#050224');
  skyGrad.addColorStop(0.52,'#0d0830');
  skyGrad.addColorStop(0.68,'#251040');
  skyGrad.addColorStop(0.74,'#3c1730');
  skyGrad.addColorStop(0.78,'#57183a');
  skyGrad.addColorStop(0.795,'#120a28');
  skyGrad.addColorStop(0.82,'#060d22');
  skyGrad.addColorStop(1.00,'#01020c');
  seaGrad = ctx.createLinearGradient(0,H*0.78,0,H);
  seaGrad.addColorStop(0,'#0e1c33');
  seaGrad.addColorStop(0.25,'#081423');
  seaGrad.addColorStop(0.75,'#030917');
  seaGrad.addColorStop(1,'#01030c');
}
addEventListener('resize', resize);

/* grain tile */
const nz = document.createElement('canvas'); nz.width = nz.height = 140;
(function(){const n = nz.getContext('2d'); const img = n.createImageData(140,140);
  for(let i=0;i<img.data.length;i+=4){const v = (Math.random()*255)|0; img.data[i]=img.data[i+1]=img.data[i+2]=v; img.data[i+3]=255;}
  n.putImageData(img,0,0);})();

/* stars */
const stars = [];
const starCols = [[255,255,255],[207,232,255],[255,217,160],[255,183,226],[186,213,255]];
for(let i=0;i<430;i++){
  stars.push({ x: rnd(), y: Math.pow(rnd(),1.25)*0.66, r: Math.pow(rnd(),2.6)*1.55 + 0.35,
    ph: rnd()*6.283, sp: 0.5 + rnd()*1.9, col: starCols[(rnd()*starCols.length)|0], big: rnd() < 0.055 });
}

/* nebula clouds */
const blobs = [
  [.17,.17,.44,[ 76,29,149],.52,.16,.13],
  [.30,.10,.32,[109,40,217],.42,.14,.18],
  [.68,.13,.38,[ 29,20, 84],.60,.11,.10],
  [.83,.27,.32,[157,23, 77],.36,.13,.21],
  [.52,.055,.28,[ 13,74,110],.46,.12,.16],
  [.38,.36,.33,[  8,105,129],.34,.10,.14],
  [.93,.55,.30,[190,24, 93],.32,.15,.19],
  [.06,.40,.27,[124,58,237],.30,.17,.11],
  [.50,.30,.22,[ 94, 38,160],.30,.09,.22]
];

/* aurora ribbons */
const ribbons = [
  { y:.30, th:.34, amp:.055, freq:.0044, spd:.32, ph:0.0, col:[ 52,255,196], core:.70 },
  { y:.20, th:.24, amp:.042, freq:.0034, spd:.26, ph:2.3, col:[ 167,139,250], core:.55 },
  { y:.375,th:.30, amp:.062, freq:.0053, spd:.40, ph:4.4, col:[240,110,205],  core:.48 },
  { y:.115,th:.18, amp:.035, freq:.0030, spd:.20, ph:1.2, col:[ 56,224,255],  core:.40 }
];

/* sea shimmer dashes */
const shimmerColors = [[53,242,196],[244,114,182],[252,211,77],[147,197,253],[244,114,182],[110,231,183]];
const shimmer = [];
for(let i=0;i<120;i++){
  shimmer.push({ d: Math.pow(rnd(),1.55), x: rnd(), w:.012 + Math.pow(rnd(),2.1)*.052,
    spd:.015 + rnd()*.05, ph: rnd()*6.283, ci:(rnd()*shimmerColors.length)|0, a:.35 + rnd()*.45 });
}

/* floating bokeh orbs */
const orbCols = [[255,205,150],[244,114,182],[94,234,212],[226,232,255],[255,180,120]];
const orbs = [];
for(let i=0;i<13;i++){
  orbs.push({ x: rnd(), y: rnd(), r:.020 + rnd()*.052, rise:.014 + rnd()*.022,
    sway:.012 + rnd()*.035, ph: rnd()*6.283, ci:(rnd()*orbCols.length)|0, a:.10 + rnd()*.13 });
}

/* ridge silhouettes (far then near) */
function ridgeY(x, base, a1, f1, p1, a2, f2, p2, a3, f3, p3){
  return base
    + Math.sin(x*f1 + p1)*a1
    + Math.sin(x*f2 + p2)*a2
    + Math.sin(x*f3 + p3)*a3;
}

/* shooting stars */
let meteors = [], nextMeteor = 1.1, lastT = 0;

resize();
grainPat = ctx.createPattern(nz, 'repeat');

function frame(nowMs){
  requestAnimationFrame(frame);
  const now = nowMs * 0.001;
  const dt = Math.min(0.05, lastT ? now - lastT : 0.016);
  lastT = now;
  const t = now;
  const seaTop = H * 0.78;

  /* sky */
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  /* nebulae (additive) */
  ctx.globalCompositeOperation = 'lighter';
  for(const b of blobs){
    const bx = (b[0] + Math.sin(t*b[5] + b[6]*7.1) * 0.030) * W;
    const by = (b[1] + Math.cos(t*b[5]*0.8 + b[6]*5.3) * 0.022) * H;
    const r = b[2] * Math.min(W, H) * 1.25;
    const g = ctx.createRadialGradient(bx, by, 0, bx, by, r);
    g.addColorStop(0, rgba(b[3], b[4]));
    g.addColorStop(0.45, rgba(b[3], b[4]*0.38));
    g.addColorStop(1, rgba(b[3], 0));
    ctx.fillStyle = g;
    ctx.fillRect(bx-r, by-r, r*2, r*2);
  }

  /* aurora ribbons */
  const N = 46;
  for(const cfg of ribbons){
    const pts = [];
    for(let i=0;i<=N;i++){
      const x = (i/N) * W;
      const env = Math.pow(Math.sin(Math.PI * i/N), 0.75);
      let y = H * cfg.y
        + Math.sin(x * cfg.freq + t * cfg.spd + cfg.ph) * H * cfg.amp
        + Math.sin(x * cfg.freq * 2.35 + t * cfg.spd * 1.7 + cfg.ph * 1.7) * H * cfg.amp * 0.38
        + Math.sin(t * 0.23 + cfg.ph) * H * 0.014;
      pts.push([x, y, env]);
    }
    ctx.beginPath();
    ctx.moveTo(-20, pts[0][1]);
    for(let i=1;i<=N;i++) ctx.lineTo(pts[i][0], pts[i][1]);
    for(let i=N;i>=0;i--){
      const y = pts[i][1] + H * cfg.th * (0.24 + 0.76 * pts[i][2])
        + Math.sin(t * 0.9 + i * 0.52 + cfg.ph) * H * 0.006;
      ctx.lineTo(pts[i][0], y);
    }
    ctx.closePath();
    const midY = H * cfg.y + Math.sin(t * 0.23 + cfg.ph) * H * 0.014;
    const g = ctx.createLinearGradient(0, midY - H * cfg.th * 0.30, 0, midY + H * cfg.th * 0.85);
    g.addColorStop(0,    rgba(cfg.col, 0));
    g.addColorStop(0.26, rgba(cfg.col, 0.30 * cfg.core + 0.10));
    g.addColorStop(0.58, rgba(cfg.col, 0.30 * cfg.core + 0.20));
    g.addColorStop(1,    rgba(cfg.col, 0));
    ctx.fillStyle = g;
    ctx.fill();
    /* bright leading edge */
    ctx.beginPath();
    for(let i=0;i<=N;i++){ const p = pts[i]; if(i===0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); }
    ctx.strokeStyle = rgba(cfg.col, 0.24 + 0.10 * Math.sin(t * 0.8 + cfg.ph));
    ctx.lineWidth = Math.max(1.5, H * 0.0035);
    ctx.stroke();
  }

  /* diagonal light shafts from the upper sky */
  const shaft = (ox, ang, wTop, wBot, a) => {
    ctx.save();
    ctx.translate(ox, -H * 0.06);
    ctx.rotate(ang);
    const g = ctx.createLinearGradient(0, 0, 0, H * 1.05);
    g.addColorStop(0, 'rgba(225,240,255,'+a+')');
    g.addColorStop(1, 'rgba(225,240,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-wTop/2, 0); ctx.lineTo(wTop/2, 0);
    ctx.lineTo(wBot/2, H*1.05); ctx.lineTo(-wBot/2, H*1.05);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  };
  shaft(W*0.16,  0.42 + Math.sin(t*0.11)*0.05, W*0.055, W*0.24, 0.10);
  shaft(W*0.55, -0.30 + Math.cos(t*0.09)*0.04, W*0.045, W*0.18, 0.075);
  shaft(W*0.86, -0.55 + Math.sin(t*0.13)*0.06, W*0.07,  W*0.30, 0.085);

  /* stars */
  for(const s of stars){
    const tw = 0.5 + 0.5 * Math.sin(t * s.sp * 1.7 + s.ph);
    const a = 0.18 + 0.82 * Math.pow(tw, 1.6);
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, 6.2832);
    ctx.fillStyle = rgba(s.col, a);
    ctx.fill();
    if(s.big && tw > 0.55){
      ctx.strokeStyle = rgba(s.col, (tw-0.55) * 0.9);
      ctx.lineWidth = 1;
      const L = s.r * 5;
      ctx.beginPath();
      ctx.moveTo(s.x*W - L, s.y*H); ctx.lineTo(s.x*W + L, s.y*H);
      ctx.moveTo(s.x*W, s.y*H - L); ctx.lineTo(s.x*W, s.y*H + L);
      ctx.stroke();
    }
  }

  /* moon + halo */
  const moonX = W * 0.735, moonY = H * 0.285, moonR = H * 0.040;
  let g = ctx.createRadialGradient(moonX, moonY, moonR*0.4, moonX, moonY, H * 0.24);
  g.addColorStop(0, 'rgba(252,244,214,0.40)');
  g.addColorStop(0.35, 'rgba(252,244,214,0.10)');
  g.addColorStop(1, 'rgba(252,244,214,0)');
  ctx.fillStyle = g;
  ctx.fillRect(moonX - H*0.24, moonY - H*0.24, H*0.48, H*0.48);
  ctx.beginPath(); ctx.arc(moonX, moonY, moonR, 0, 6.2832);
  ctx.fillStyle = '#f7efdb'; ctx.fill();
  ctx.beginPath(); ctx.arc(moonX - moonR*0.32, moonY + moonR*0.15, moonR*0.20, 0, 6.2832);
  ctx.arc(moonX + moonR*0.30, moonY - moonR*0.28, moonR*0.14, 0, 6.2832);
  ctx.arc(moonX + moonR*0.18, moonY + moonR*0.42, moonR*0.11, 0, 6.2832);
  ctx.fillStyle = 'rgba(120,110,95,0.28)'; ctx.fill();

  /* horizon: warm glow bleeding out from behind the ridge */
  g = ctx.createRadialGradient(W*0.46, seaTop + H*0.002, 0, W*0.46, seaTop + H*0.002, H * 0.30);
  g.addColorStop(0, 'rgba(255,120,60,0.34)');
  g.addColorStop(0.42, 'rgba(214,63,110,0.20)');
  g.addColorStop(1, 'rgba(214,63,110,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, seaTop - H*0.30, W, H*0.32);

  /* the sea */
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = seaGrad;
  ctx.fillRect(0, seaTop, W, H - seaTop);

  ctx.globalCompositeOperation = 'lighter';
  /* moonlight shaft wobbling on the water */
  const wob = Math.sin(t * 1.15) * W * 0.006;
  const mwg = ctx.createLinearGradient(0, seaTop, 0, H);
  mwg.addColorStop(0, 'rgba(252,240,208,0.30)');
  mwg.addColorStop(0.5, 'rgba(252,224,170,0.08)');
  mwg.addColorStop(1, 'rgba(252,224,170,0)');
  ctx.fillStyle = mwg;
  ctx.beginPath();
  ctx.moveTo(moonX - W*0.018 + wob, seaTop);
  ctx.lineTo(moonX + W*0.018 + wob, seaTop);
  ctx.lineTo(moonX + W*0.075 + wob*2.4, H);
  ctx.lineTo(moonX - W*0.075 + wob*2.4, H);
  ctx.closePath(); ctx.fill();

  /* teal reflection of the northern lights, swaying */
  const sway = Math.sin(t * 0.55 + 1.4) * W * 0.016;
  const tg = ctx.createLinearGradient(0, seaTop, 0, H);
  tg.addColorStop(0, 'rgba(45,255,196,0.20)');
  tg.addColorStop(0.6, 'rgba(45,255,196,0.05)');
  tg.addColorStop(1, 'rgba(45,255,196,0)');
  ctx.fillStyle = tg;
  ctx.beginPath();
  ctx.moveTo(W*0.30 + sway - W*0.020, seaTop);
  ctx.lineTo(W*0.30 + sway + W*0.020, seaTop);
  ctx.lineTo(W*0.30 + sway*1.8 + W*0.062, H);
  ctx.lineTo(W*0.30 + sway*1.8 - W*0.062, H);
  ctx.closePath(); ctx.fill();
  /* magenta low reflection */
  const sw2 = Math.cos(t * 0.42) * W * 0.014;
  const mg = ctx.createLinearGradient(0, seaTop, 0, H);
  mg.addColorStop(0, 'rgba(240,110,205,0.17)');
  mg.addColorStop(1, 'rgba(240,110,205,0)');
  ctx.fillStyle = mg;
  ctx.beginPath();
  ctx.moveTo(W*0.72 + sw2 - W*0.016, seaTop);
  ctx.lineTo(W*0.72 + sw2 + W*0.016, seaTop);
  ctx.lineTo(W*0.72 + sw2*2 + W*0.050, H);
  ctx.lineTo(W*0.72 + sw2*2 - W*0.050, H);
  ctx.closePath(); ctx.fill();

  /* shimmer dashes riding the water */
  for(const s of shimmer){
    const depth = Math.pow(s.d, 1.65);
    const yy = seaTop + 3 + depth * (H - seaTop - 6);
    const xx = (((s.x + t * s.spd) % 1.18) - 0.09) * W;
    const w = s.w * W;
    const a = s.a * (1 - depth * 0.72) * (0.55 + 0.45 * Math.sin(t * 2.5 + s.ph));
    if(a <= 0.02) continue;
    ctx.fillStyle = rgba(shimmerColors[s.ci], a * 0.32);
    ctx.fillRect(xx - w * 0.55, yy - 1, w * 2.1, 4);
    ctx.fillStyle = rgba(shimmerColors[s.ci], a);
    ctx.fillRect(xx, yy, w, 1.6);
  }

  /* mountains: far ridge, then near ridge, base fading into mist */
  function ridgePath(base, a1, f1, p1, a2, f2, p2, a3, f3, p3, bottom){
    ctx.beginPath();
    ctx.moveTo(-20, H + 20);
    ctx.lineTo(-20, ridgeY(-20, base, a1,f1,p1, a2,f2,p2, a3,f3,p3));
    const steps = 42;
    for(let i = 0; i <= steps; i++){
      const x = (i/steps) * (W + 40) - 20;
      ctx.lineTo(x, ridgeY(x, base, a1,f1,p1, a2,f2,p2, a3,f3,p3));
    }
    ctx.lineTo(W + 20, H + 20);
    ctx.closePath();
    return bottom;
  }
  /* far ridge: thin atmospheric band */
  const fg = ctx.createLinearGradient(0, H*0.66, 0, H*0.80);
  fg.addColorStop(0, 'rgba(34,24,66,0.95)');
  fg.addColorStop(1, 'rgba(34,24,66,0)');
  ctx.fillStyle = fg;
  ridgePath(H*0.744, H*0.034, .0105, 1.7, H*0.013, .0260, 0.55, H*0.005, .0480, 2.9, H*0.80);
  ctx.fill();
  /* near ridge: darker, taller */
  const ng = ctx.createLinearGradient(0, H*0.70, 0, H*0.86);
  ng.addColorStop(0, 'rgba(4,2,20,0.98)');
  ng.addColorStop(0.72, 'rgba(5,3,22,0.55)');
  ng.addColorStop(1, 'rgba(5,3,22,0)');
  ctx.fillStyle = ng;
  ridgePath(H*0.762, H*0.052, .0078, 2.6, H*0.020, .0172, 5.1, H*0.008, .0390, 0.4, H*0.86);
  ctx.fill();

  /* bokeh orbs drifting up */
  for(const o of orbs){
    const span = H * 1.30;
    const yy = H + H * 0.12 - ((t * o.rise * H + o.y * span) % span);
    const xx = (o.x + Math.sin(t * 0.33 + o.ph) * o.sway) * W;
    const r = o.r * H;
    const og = ctx.createRadialGradient(xx, yy, 0, xx, yy, r);
    const c = orbCols[o.ci];
    og.addColorStop(0, rgba(c, o.a));
    og.addColorStop(0.65, rgba(c, o.a * 0.38));
    og.addColorStop(1, rgba(c, 0));
    ctx.fillStyle = og;
    ctx.beginPath(); ctx.ellipse(xx, yy, r, r * 0.78, 0, 0, 6.2832); ctx.fill();
  }

  /* shooting stars */
  if(t > nextMeteor){
    nextMeteor = t + 2.1 + rnd() * 3.4;
    const left = rnd() < 0.5;
    const y = H * (0.07 + rnd() * 0.30);
    const speed = (H * 0.85 + W * 0.75) * (0.55 + rnd() * 0.4);
    const dir = left ? -1 : 1;
    meteors.push({ x: left ? W * (0.30 + rnd() * 0.65) : W * (0.02 + rnd() * 0.60),
      y, vx: dir * speed, vy: speed * 0.40, life: 0.85 + rnd() * 0.45, age: 0 });
  }
  for(let i = meteors.length - 1; i >= 0; i--){
    const m = meteors[i];
    m.age += dt;
    if(m.age >= m.life){ meteors.splice(i, 1); continue; }
    m.x += m.vx * dt; m.y += m.vy * dt;
    const headA = Math.max(0, 1 - m.age / m.life);
    const tl = Math.hypot(m.vx, m.vy) * 0.085;
    const tx = m.x - (m.vx / Math.hypot(m.vx, m.vy)) * tl;
    const ty = m.y - (m.vy / Math.hypot(m.vx, m.vy)) * tl;
    const lg = ctx.createLinearGradient(m.x, m.y, tx, ty);
    lg.addColorStop(0, 'rgba(255,255,255,' + (0.9 * headA) + ')');
    lg.addColorStop(0.35, 'rgba(210,230,255,' + (0.5 * headA) + ')');
    lg.addColorStop(1, 'rgba(210,230,255,0)');
    ctx.strokeStyle = lg;
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tx, ty); ctx.stroke();
    const hg = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, 5);
    hg.addColorStop(0, 'rgba(255,255,255,' + headA + ')');
    hg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(m.x, m.y, 5, 0, 6.2832); ctx.fill();
  }

  /* film grain */
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 0.055;
  const gOff = () => (Math.random() * 140) | 0;
  ctx.save();
  ctx.translate(-gOff(), -gOff());
  ctx.fillStyle = grainPat;
  ctx.fillRect(0, 0, W + 140, H + 140);
  ctx.restore();
  ctx.globalAlpha = 1;
}
requestAnimationFrame(frame);
</script>
</body>
</html>
