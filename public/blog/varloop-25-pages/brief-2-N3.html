<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northern Veil</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #01010c; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
'use strict';
/* ---------- utils ---------- */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = innerWidth, H = innerHeight, DPR = 1, horizonY = 0;
let bgGrad, waterGrad, vigGrad, grainCanvas;

function h2(ix, iy) {
  const s = Math.sin(ix * 127.1 + iy * 311.7) * 43758.5453123;
  return s - Math.floor(s);
}
function smooth(t) { return t * t * (3 - 2 * t); }
function vnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const a = h2(ix, iy), b = h2(ix + 1, iy), c = h2(ix, iy + 1), d = h2(ix + 1, iy + 1);
  const ux = smooth(fx), uy = smooth(fy);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y, oct) {
  let v = 0, amp = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { v += amp * vnoise(x * f, y * f); f *= 2.03; amp *= 0.5; }
  return v;
}

/* ---------- scene setup ---------- */
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  horizonY = Math.round(H * 0.78);

  bgGrad = ctx.createLinearGradient(0, 0, 0, horizonY + 60);
  bgGrad.addColorStop(0.00, '#02001f');
  bgGrad.addColorStop(0.42, '#060b2b');
  bgGrad.addColorStop(0.78, '#0d1032');
  bgGrad.addColorStop(1.00, '#181033');

  waterGrad = ctx.createLinearGradient(0, horizonY, 0, H);
  waterGrad.addColorStop(0.00, '#0b0b22');
  waterGrad.addColorStop(0.22, '#060614');
  waterGrad.addColorStop(1.00, '#010108');

  vigGrad = ctx.createRadialGradient(W * 0.5, H * 0.42, Math.min(W, H) * 0.28,
                                     W * 0.5, H * 0.52, Math.max(W, H) * 0.78);
  vigGrad.addColorStop(0.00, 'rgba(2,2,14,0)');
  vigGrad.addColorStop(0.62, 'rgba(2,2,14,0.14)');
  vigGrad.addColorStop(1.00, 'rgba(1,1,10,0.62)');

  grainCanvas = document.createElement('canvas');
  grainCanvas.width = grainCanvas.height = 150;
  const g = grainCanvas.getContext('2d');
  const img = g.createImageData(150, 150);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 118 + (Math.random() * 46 - 23);
    img.data[i] = v; img.data[i + 1] = v; img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
}
addEventListener('resize', resize);
resize();

/* ---------- aurora layer configs ---------- */
const LAYERS = [
  { top: 0.05, amp: 0.17, thick: 0.52, freq: 0.0013, speed: 0.036, seed: 7.31, depth: 1.1, off: 3.1,
    stops: [[0, 96, 44, 255, 0], [0.30, 124, 62, 255, 0.42], [0.55, 188, 92, 255, 0.62],
            [0.78, 255, 82, 220, 0.20], [1, 255, 82, 220, 0]], stream: '205,160,255' },
  { top: 0.12, amp: 0.21, thick: 0.56, freq: 0.0017, speed: 0.052, seed: 21.77, depth: 1.7, off: 9.4,
    stops: [[0, 0, 218, 172, 0], [0.30, 14, 224, 162, 0.46], [0.54, 42, 255, 178, 0.68],
            [0.80, 0, 214, 255, 0.30], [1, 0, 214, 255, 0]], stream: '150,255,216' },
  { top: -0.02, amp: 0.14, thick: 0.40, freq: 0.0026, speed: 0.080, seed: 42.13, depth: 2.5, off: 17.7,
    stops: [[0, 28, 198, 255, 0], [0.34, 28, 220, 226, 0.40], [0.56, 56, 255, 206, 0.56],
            [0.82, 122, 255, 162, 0.16], [1, 122, 255, 162, 0]], stream: '172,255,236' }
];
/* precomputed stream stripes per layer */
for (const L of LAYERS) {
  L.streams = [];
  const count = 95;
  for (let i = 0; i < count; i++) {
    L.streams.push({
      p: h2(i, L.seed), ph: h2(i, L.seed + 3.7) * 6.283,
      w: 0.7 + h2(i, 9.1) * 2.1, a: 0.05 + h2(i, 4.4) * 0.20
    });
  }
}

/* ---------- stars / snow / streaks ---------- */
const stars = [];
for (let i = 0; i < 240; i++) {
  const r = h2(i, 5.13);
  stars.push({
    x: h2(i, 3.71), y: Math.pow(h2(i, 7.91), 1.45) * 0.74,
    r: 0.45 + Math.pow(h2(i, 9.3), 3.1) * 1.85,
    ph: h2(i, 6.6) * 6.283, sp: 1.4 + h2(i, 2.2) * 3.1,
    depth: 3 + h2(i, 8.8) * 8,
    hue: h2(i, 11.7) < 0.18 ? '255,224,186' : (h2(i, 11.9) < 0.42 ? '168,198,255' : '255,255,255')
  });
}
const snow = [];
for (let i = 0; i < 130; i++) {
  snow.push({
    x: h2(i, 21.3), y: h2(i, 33.7), r: 0.8 + h2(i, 44.1) * 2.0,
    vy: 34 + h2(i, 55.7) * 66, ph: h2(i, 66.9) * 6.283
  });
}
const streaks = [];
for (let i = 0; i < 36; i++) {
  streaks.push({
    y: Math.pow(h2(i, 77.2), 1.5), x: h2(i, 88.8),
    len: 26 + h2(i, 99.3) * 150, ph: h2(i, 8.4) * 6.283,
    sp: 0.22 + h2(i, 12.6) * 0.42, thick: h2(i, 15.1) > 0.72 ? 2.2 : 1.2,
    col: i % 3 === 0 ? '140,255,216' : (i % 3 === 1 ? '186,146,255' : '222,226,255')
  });
}

/* ---------- mountains ---------- */
function ridgePoints(baseY, amp, freq, seed, sharp) {
  const N = 150, pts = [];
  for (let i = 0; i <= N; i++) {
    const x = (i / N) * W;
    const n = fbm(x * freq + 31.7, seed, 4);
    pts.push([x, baseY - Math.pow(n, sharp) * amp * H - Math.sin(x * 0.0021 + seed * 3.1) * 3]);
  }
  return pts;
}
function drawRidge(pts, color, rimGrad, depth, px, py) {
  ctx.save();
  ctx.translate(px * depth, py * depth * 0.25);
  ctx.beginPath();
  ctx.moveTo(-20, horizonY + 3);
  ctx.lineTo(-20, pts[0][1]);
  for (const [x, y] of pts) ctx.lineTo(x, y);
  ctx.lineTo(W + 20, pts[pts.length - 1][1]);
  ctx.lineTo(W + 20, horizonY + 3);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  // rim light on the ridge crest
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (const [x, y] of pts) ctx.lineTo(x, y);
  ctx.strokeStyle = rimGrad;
  ctx.globalAlpha = 0.55; ctx.lineWidth = 1.3; ctx.stroke();
  ctx.globalAlpha = 0.13; ctx.lineWidth = 5; ctx.stroke();
  ctx.restore();
}

/* ---------- aurora ---------- */
const RB_N = 150;
function layerProfiles(L, t, px, py) {
  const tops = new Array(RB_N + 1), bots = new Array(RB_N + 1);
  for (let i = 0; i <= RB_N; i++) {
    const x = (i / RB_N) * W;
    const nx = x * L.freq + L.off + t * L.speed;
    const n = fbm(nx, L.seed + t * 0.014, 4);
    const wob = Math.sin(x * 0.0042 + t * 0.55 + L.seed * 2.0) * 0.011
              + Math.sin(x * 0.0113 + t * 0.31 + L.seed) * 0.005;
    let ty = (L.top + wob + (n - 0.5) * L.amp) * H + py * 3.5 * L.depth + px * 4.5 * L.depth;
    const bn = fbm(nx * 2.2 + 4.4, L.seed * 1.9 + 17.3 - t * 0.021, 3);
    let by = ty + H * L.thick * (0.42 + 1.35 * bn);
    const cap = horizonY - 4;
    if (by > cap) by = cap - (by - cap) * 0.15;
    tops[i] = ty; bots[i] = by;
  }
  return [tops, bots];
}
function bandPath(tops, bots, a, b) {
  ctx.beginPath();
  for (let i = 0; i <= RB_N; i++) {
    const p = tops[i], q = bots[i], y = p + (q - p) * a, x = (i / RB_N) * W;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  for (let i = RB_N; i >= 0; i--) {
    const p = tops[i], q = bots[i], y = p + (q - p) * b, x = (i / RB_N) * W;
    ctx.lineTo(x, y);
  }
  ctx.closePath();
}
function drawRibbon(L, t, aMul, px, py) {
  const [tops, bots] = layerProfiles(L, t, px, py);
  const g = ctx.createLinearGradient(0, L.top * H - 90, 0, (L.top + L.thick * 2.0) * H + 80);
  for (const [o, r, gg, b, a] of L.stops) g.addColorStop(o, `rgba(${r},${gg},${b},${(a * aMul).toFixed(4)})`);
  ctx.globalCompositeOperation = 'lighter';
  bandPath(tops, bots, 0, 1);
  ctx.fillStyle = g;
  ctx.fill();
  // hot core band
  ctx.globalAlpha = 0.72;
  bandPath(tops, bots, 0.20, 0.80);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.globalAlpha = 1;
  // vertical curtain streams
  ctx.save();
  bandPath(tops, bots, 0, 1);
  ctx.clip();
  for (const s of L.streams) {
    const idx = Math.min(RB_N, Math.max(0, Math.round(s.p * RB_N)));
    const p = tops[idx], q = bots[idx], x = (idx / RB_N) * W;
    const dx = Math.sin(t * 1.25 + s.ph + s.p * 9.0) * (4 + s.p * 5) + px * 8 * L.depth;
    const fade = 0.6 + 0.4 * Math.sin(t * 2.1 + s.ph * 3.0);
    ctx.strokeStyle = `rgba(${L.stream},${(s.a * aMul * fade).toFixed(4)})`;
    ctx.lineWidth = s.w;
    ctx.beginPath();
    ctx.moveTo(x + dx, p + 6);
    ctx.lineTo(x + dx + Math.sin(t * 0.8 + s.ph) * 5, p + (q - p) * 0.97);
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';
}

/* ---------- interaction ---------- */
let pxT = 0, pyT = 0, px = 0, py = 0;
addEventListener('pointermove', e => {
  pxT = (e.clientX / W - 0.5) * 2;
  pyT = (e.clientY / H - 0.5) * 2;
});
addEventListener('pointerleave', () => { pxT = 0; pyT = 0; });

/* ---------- shooting star ---------- */
const meteor = { active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 0.95 };
let meteorTimer = 2.6;

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0) || !(dt < 0.05)) dt = 0.016;
  const t = now / 1000;
  px += (pxT - px) * Math.min(1, dt * 2.4);
  py += (pyT - py) * Math.min(1, dt * 2.4);
  const breathe = 0.86 + 0.22 * Math.sin(t * 0.21 + 1.2) + 0.10 * Math.sin(t * 0.053 + 4.0);

  const scale = 1 + 0.008 * Math.sin(t * 0.11);
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(scale, scale); ctx.translate(-W / 2, -H / 2);

  /* sky */
  ctx.fillStyle = bgGrad;
  ctx.fillRect(-W * 0.05, -H * 0.05, W * 1.1, H * 0.9 + 60);
  /* milky-way diagonal band */
  let mw = ctx.createLinearGradient(0, -H * 0.1, W * 0.75, H * 0.6);
  mw.addColorStop(0, 'rgba(96,84,210,0)');
  mw.addColorStop(0.45, 'rgba(96,84,210,0.13)');
  mw.addColorStop(0.75, 'rgba(160,84,220,0.09)');
  mw.addColorStop(1, 'rgba(160,84,220,0)');
  ctx.fillStyle = mw;
  ctx.fillRect(0, 0, W, horizonY);
  /* nebula glows */
  ctx.globalCompositeOperation = 'lighter';
  let ng = ctx.createRadialGradient(W * 0.28, H * 0.34, 10, W * 0.28, H * 0.34, W * 0.36);
  ng.addColorStop(0, 'rgba(0,188,176,0.10)'); ng.addColorStop(1, 'rgba(0,188,176,0)');
  ctx.fillStyle = ng; ctx.fillRect(0, 0, W, horizonY);
  ng = ctx.createRadialGradient(W * 0.74, H * 0.12, 10, W * 0.74, H * 0.12, W * 0.40);
  ng.addColorStop(0, 'rgba(168,52,205,0.11)'); ng.addColorStop(1, 'rgba(168,52,205,0)');
  ctx.fillStyle = ng; ctx.fillRect(0, 0, W, horizonY);
  ctx.globalCompositeOperation = 'source-over';

  /* stars */
  for (const s of stars) {
    const tw = 0.55 + 0.45 * Math.sin(t * s.sp + s.ph);
    const sx = s.x * W + px * s.depth, sy = s.y * H + py * s.depth * 0.6;
    ctx.globalAlpha = 0.28 + 0.72 * tw;
    ctx.fillStyle = `rgb(${s.hue})`;
    ctx.beginPath(); ctx.arc(sx, sy, s.r, 0, 6.2832); ctx.fill();
    if (s.r > 1.45) { /* cross sparkle */
      ctx.globalAlpha = 0.30 * tw;
      ctx.strokeStyle = `rgb(${s.hue})`;
      ctx.lineWidth = 0.8;
      const L2 = s.r * 4.2;
      ctx.beginPath();
      ctx.moveTo(sx - L2, sy); ctx.lineTo(sx + L2, sy);
      ctx.moveTo(sx, sy - L2); ctx.lineTo(sx, sy + L2);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  /* moon */
  const mx = W * 0.78, my = H * 0.155, mr = Math.min(W, H) * 0.042;
  ctx.globalCompositeOperation = 'lighter';
  let mg = ctx.createRadialGradient(mx, my, mr * 0.4, mx, my, mr * 4.4);
  mg.addColorStop(0, 'rgba(228,228,255,0.34)'); mg.addColorStop(1, 'rgba(228,228,255,0)');
  ctx.fillStyle = mg; ctx.fillRect(mx - mr * 5, my - mr * 5, mr * 10, mr * 10);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#ece9da';
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, 6.2832); ctx.fill();
  ctx.fillStyle = 'rgba(120,120,140,0.28)';
  ctx.beginPath(); ctx.arc(mx - mr * 0.32, my - mr * 0.18, mr * 0.20, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + mr * 0.28, my + mr * 0.30, mr * 0.13, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + mr * 0.18, my - mr * 0.36, mr * 0.09, 0, 6.2832); ctx.fill();

  /* aurora above horizon */
  for (const L of LAYERS) drawRibbon(L, t, breathe, px, py);

  /* horizon glow behind mountains */
  ctx.globalCompositeOperation = 'lighter';
  ctx.save();
  ctx.translate(W * 0.5 + px * 24, horizonY + 4);
  ctx.scale(1, 0.16);
  let hg = ctx.createRadialGradient(0, 0, 4, 0, 0, W * 0.55);
  hg.addColorStop(0, 'rgba(64,214,180,0.30)'); hg.addColorStop(0.5, 'rgba(96,60,220,0.14)'); hg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(-W * 0.6, -W * 0.3, W * 1.2, W * 0.6);
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';

  /* mountains */
  const rimGrad = ctx.createLinearGradient(0, 0, W, 0);
  rimGrad.addColorStop(0, 'rgba(46,232,190,0.9)');
  rimGrad.addColorStop(0.45, 'rgba(150,110,255,0.9)');
  rimGrad.addColorStop(1, 'rgba(46,200,255,0.9)');
  const rimGradNear = ctx.createLinearGradient(0, 0, W, 0);
  rimGradNear.addColorStop(0, 'rgba(46,232,190,0.55)');
  rimGradNear.addColorStop(0.5, 'rgba(150,110,255,0.45)');
  rimGradNear.addColorStop(1, 'rgba(46,200,255,0.55)');
  drawRidge(ridgePoints(horizonY + 1, 0.145, 0.0042, 5.1, 1.5), '#0d0d27', rimGrad, 5, px, py);
  drawRidge(ridgePoints(horizonY + 2, 0.092, 0.0068, 13.7, 1.6), '#070718', rimGradNear, 10, px, py);

  /* water base */
  ctx.fillStyle = waterGrad;
  ctx.fillRect(-W * 0.05, horizonY, W * 1.1, H - horizonY + H * 0.05);

  /* reflections in water (compressed vertical mirror about the horizon) */
  ctx.save();
  ctx.beginPath(); ctx.rect(-W * 0.05, horizonY, W * 1.1, H - horizonY + 2); ctx.clip();
  ctx.translate(0, horizonY); ctx.scale(1, -0.34); ctx.translate(0, -horizonY);
  for (const L of LAYERS) drawRibbon(L, t + 0.4, 0.38, px, py);
  ctx.restore();
  /* darken reflected light with depth */
  let wg = ctx.createLinearGradient(0, horizonY, 0, H);
  wg.addColorStop(0, 'rgba(3,3,18,0.18)');
  wg.addColorStop(0.35, 'rgba(2,2,14,0.55)');
  wg.addColorStop(1, 'rgba(1,1,8,0.88)');
  ctx.fillStyle = wg;
  ctx.fillRect(-W * 0.05, horizonY, W * 1.1, H - horizonY + 2);

  /* moon glitter on water */
  ctx.save();
  ctx.translate(mx, horizonY + (H - horizonY) * 0.30);
  ctx.scale(1, 0.30);
  let gg = ctx.createRadialGradient(0, 0, 2, 0, 0, W * 0.088);
  gg.addColorStop(0, 'rgba(232,232,255,0.30)'); gg.addColorStop(1, 'rgba(232,232,255,0)');
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.arc(0, 0, W * 0.088, 0, 6.2832); ctx.fill();
  ctx.restore();

  /* drifting shimmer streaks */
  for (const s of streaks) {
    const yy = horizonY + 7 + s.y * (H - horizonY - 12);
    const cx = s.x * W + Math.sin(t * s.sp + s.ph) * (16 + s.y * 44);
    const tw = 0.5 + 0.5 * Math.sin(t * 1.15 + s.ph * 2.0);
    let alpha = (0.05 + 0.16 * tw) * (0.4 + s.y * 0.9);
    const nearMoon = Math.exp(-Math.pow((cx - mx) / 110, 2)) * 0.20 * tw;
    alpha += nearMoon;
    const lg = ctx.createLinearGradient(cx - s.len / 2, yy, cx + s.len / 2, yy);
    lg.addColorStop(0, `rgba(${s.col},0)`);
    lg.addColorStop(0.5, `rgba(${s.col},${Math.min(0.5, alpha).toFixed(4)})`);
    lg.addColorStop(1, `rgba(${s.col},0)`);
    ctx.fillStyle = lg;
    ctx.fillRect(cx - s.len / 2, yy - s.thick / 2, s.len, s.thick);
  }

  /* thin luminous horizon line */
  ctx.fillStyle = 'rgba(150,130,255,0.28)';
  ctx.fillRect(0, horizonY, W, 1);

  /* near shoreline silhouettes */
  ctx.fillStyle = '#010109';
  ctx.beginPath();
  ctx.moveTo(-20, H + 20);
  ctx.lineTo(-20, H * 0.962);
  ctx.bezierCurveTo(W * 0.09, H * 0.928, W * 0.20, H * 0.978, W * 0.33, H + 20);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(W + 20, H + 20);
  ctx.lineTo(W + 20, H * 0.938);
  ctx.bezierCurveTo(W * 0.925, H * 0.905, W * 0.85, H * 0.972, W * 0.71, H + 20);
  ctx.closePath(); ctx.fill();

  /* snow */
  const wind = Math.sin(t * 0.23) * 16;
  for (const f of snow) {
    f.y += (f.vy * dt * (H / 760 || 1)) / H;
    f.x += ((Math.sin(t * 0.8 + f.ph) * 12 + wind) * dt) / W;
    if (f.y > 1.02) { f.y = -0.02 - Math.random() * 0.06; f.x = Math.random(); }
    if (f.x > 1.02) f.x = -0.02; else if (f.x < -0.02) f.x = 1.02;
    const sx = f.x * W, sy = f.y * H;
    ctx.globalAlpha = 0.32 + (f.r / 3) * 0.45;
    ctx.fillStyle = '#f2f4ff';
    ctx.beginPath(); ctx.arc(sx, sy, f.r, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* shooting star */
  meteorTimer -= dt;
  if (!meteor.active && meteorTimer <= 0) {
    const dir = Math.random() < 0.5 ? 1 : -1;
    const spd = H * (0.85 + Math.random() * 0.35);
    meteor.active = true;
    meteor.x = W * (0.3 + Math.random() * 0.62);
    meteor.y = H * (0.05 + Math.random() * 0.22);
    meteor.vx = -dir * spd * 0.82;
    meteor.vy = spd * 0.52;
    meteor.life = 0; meteor.max = 0.8 + Math.random() * 0.3;
    meteorTimer = 4.2 + Math.random() * 6.5;
  }
  if (meteor.active) {
    meteor.life += dt;
    const k = meteor.life / meteor.max;
    if (k >= 1) meteor.active = false;
    else {
      meteor.x += meteor.vx * dt; meteor.y += meteor.vy * dt;
      const fade = Math.pow(1 - k, 1.7);
      const tx = meteor.x - meteor.vx * 0.11, ty = meteor.y - meteor.vy * 0.11;
      let mgrad = ctx.createLinearGradient(meteor.x, meteor.y, tx, ty);
      mgrad.addColorStop(0, `rgba(255,255,255,${0.95 * fade})`);
      mgrad.addColorStop(0.35, `rgba(190,215,255,${0.55 * fade})`);
      mgrad.addColorStop(1, 'rgba(160,190,255,0)');
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = mgrad; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(meteor.x, meteor.y); ctx.lineTo(tx, ty); ctx.stroke();
      ctx.globalAlpha = 0.35 * fade; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(meteor.x, meteor.y); ctx.lineTo(tx, ty); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = `rgba(255,255,255,${0.9 * fade})`;
      ctx.beginPath(); ctx.arc(meteor.x, meteor.y, 1.8, 0, 6.2832); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  ctx.restore(); /* un-scale world */

  /* vignette + grain */
  ctx.fillStyle = vigGrad;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 0.055;
  ctx.imageSmoothingEnabled = false;
  const gx = Math.random() * 14 - 7, gy = Math.random() * 14 - 7;
  ctx.drawImage(grainCanvas, gx, gy, W + 14, H + 14);
  ctx.imageSmoothingEnabled = true;
  ctx.globalAlpha = 1;
}
requestAnimationFrame(frame);
</script>
</body>
</html>
