<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Violet Meridian</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #08021a;
    touch-action: none;
    overscroll-behavior: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="art" aria-label="Generative abstract light art"></canvas>
<script>
(() => {
  const canvas = document.getElementById('art');
  const ctx = canvas.getContext('2d', { alpha: false });

  const TAU = Math.PI * 2;
  const palette = [
    [34, 243, 208],   // glacial teal
    [255, 62, 165],   // magenta
    [255, 179, 71],   // ember gold
    [148, 87, 255],   // violet
    [72, 132, 255]    // ultramarine
  ];

  let W = 0, H = 0, cx = 0, cy = 0, minDim = 1, dpr = 1, grain = null;
  let particles = [];
  let stars = [];
  let motes = [];
  const pointer = { x: 0.5, y: 0.5, tx: 0.5, ty: 0.5 };

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.75);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W * 0.5;
    cy = H * 0.52;
    minDim = Math.min(W, H);
    makeGrain();
    seedField();
  }

  function makeGrain() {
    const size = 128;
    grain = document.createElement('canvas');
    grain.width = size;
    grain.height = size;
    const g = grain.getContext('2d');
    const image = g.createImageData(size, size);
    for (let i = 0; i < image.data.length; i += 4) {
      const v = 118 + Math.random() * 137;
      image.data[i] = image.data[i + 1] = image.data[i + 2] = v;
      image.data[i + 3] = Math.random() < 0.5 ? 14 : 0;
    }
    g.putImageData(image, 0, 0);
  }

  function seedField() {
    particles = [];
    const count = Math.floor((W * H) / 1050);
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * TAU;
      const radius = Math.pow(Math.random(), 1.45);
      particles.push({
        angle,
        radius,
        speed: (0.018 + Math.random() * 0.038) * (Math.random() < 0.5 ? 1 : -1),
        radial: (Math.random() - 0.5) * 0.026,
        size: 0.5 + Math.pow(Math.random(), 2.4) * 3.2,
        hue: (Math.random() * palette.length) | 0,
        phase: Math.random() * TAU,
        wobble: 0.38 + Math.random() * 0.9
      });
    }

    stars = [];
    for (let i = 0; i < 150; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.15 + 0.15,
        a: 0.25 + Math.random() * 0.7,
        phase: Math.random() * TAU
      });
    }

    motes = [];
    for (let i = 0; i < 36; i++) {
      motes.push({
        x: Math.random(),
        y: Math.random(),
        r: 24 + Math.random() * Math.max(W, H) * 0.12,
        color: palette[(Math.random() * palette.length) | 0],
        drift: 0.12 + Math.random() * 0.28,
        phase: Math.random() * TAU
      });
    }
  }

  function smoothstep(a, b, x) {
    const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  }

  function drawBackground(t, pulse) {
    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.9);
    bg.addColorStop(0, '#190a3c');
    bg.addColorStop(0.34, '#0c0630');
    bg.addColorStop(1, '#030011');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (const m of motes) {
      const drift = Math.sin(t * 0.08 * m.drift + m.phase) * minDim * 0.06;
      const driftY = Math.cos(t * 0.066 * m.drift + m.phase * 1.7) * minDim * 0.055;
      const x = m.x * W + drift + (pointer.x - 0.5) * minDim * 0.08;
      const y = m.y * H + driftY + (pointer.y - 0.5) * minDim * 0.06;
      const c = m.color;
      const g = ctx.createRadialGradient(x, y, 0, x, y, m.r);
      g.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},0.20)`);
      g.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0)`);
      ctx.fillStyle = g;
      ctx.fillRect(x - m.r, y - m.r, m.r * 2, m.r * 2);
    }
    ctx.restore();

    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (const s of stars) {
      const tw = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * 1.7 + s.phase));
      ctx.globalAlpha = s.a * tw;
      ctx.fillStyle = '#eee6ff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    ctx.save();
    if (grain) {
      const pattern = ctx.createPattern(grain, 'repeat');
      ctx.globalAlpha = 0.52;
      ctx.fillStyle = pattern;
      ctx.globalCompositeOperation = 'overlay';
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
  }

  function drawRibbons(t) {
    const layers = [
      { base: 0.16, amp: 0.105, freq: 2.1, phase: 0.0, color: palette[0], width: 78, alpha: 0.34, drift: 0.00055 },
      { base: 0.34, amp: 0.145, freq: 1.4, phase: 1.8, color: palette[1], width: 112, alpha: 0.28, drift: -0.00034 },
      { base: 0.56, amp: 0.125, freq: 1.7, phase: 3.6, color: palette[3], width: 135, alpha: 0.25, drift: 0.00042 },
      { base: 0.76, amp: 0.165, freq: 1.2, phase: 5.1, color: palette[2], width: 74, alpha: 0.22, drift: -0.00048 }
    ];

    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    layers.forEach((layer, li) => {
      const c = layer.color;
      for (let pass = 0; pass < 2; pass++) {
        const spread = pass === 0 ? 1 : 0.42;
        ctx.beginPath();
        const mobile = Math.min(W, H) * (0.43 + 0.045 * Math.sin(t * 0.42 + li));
        for (let x = -40; x <= W + 40; x += Math.max(10, W / 90)) {
          const u = x / W;
          const wave =
            Math.sin(u * TAU * layer.freq + t * (0.55 + li * 0.08) * 0.62 + layer.phase) *
              layer.amp * H +
            Math.sin(u * TAU * (layer.freq * 2.7 + 0.8) - t * 0.74 + li * 1.35) * layer.amp * H * 0.32 +
            Math.cos(u * TAU * 0.72 + t * 0.32 + li) * minDim * 0.045;
          const y = H * layer.base + wave * spread + Math.sin(u * Math.PI + t * 0.12) * minDim * 0.035;
          if (x === -40) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }

        ctx.shadowBlur = pass === 0 ? 42 : 18;
        ctx.shadowColor = `rgba(${c[0]},${c[1]},${c[2]},0.85)`;
        ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${layer.alpha * (pass === 0 ? 0.58 : 1)})`;
        ctx.lineWidth = layer.width * spread * (0.58 + 0.42 * pulseScale(t, li));
        ctx.stroke();
      }
    });

    ctx.restore();
  }

  function pulseScale(t, seed) {
    return 0.72 + 0.28 * Math.sin(t * 1.35 + seed * 1.9);
  }

  function drawCore(t, pulse) {
    const px = pointer.x - 0.5, py = pointer.y - 0.5;
    const x = cx + px * minDim * 0.085;
    const y = cy + py * minDim * 0.07;

    ctx.save();
    ctx.globalCompositeOperation = 'screen';

    // rotating halo rings
    const ringCount = 5;
    for (let i = 0; i < ringCount; i++) {
      const radius = minDim * (0.08 + i * 0.058 + 0.012 * Math.sin(t * 1.5 + i)) * (0.92 + pulse * 0.18);
      const c = palette[(i + 1) % palette.length];
      ctx.beginPath();
      ctx.ellipse(x, y, radius * 1.38, radius * 0.53, -0.18 + Math.sin(t * 0.32 + i) * 0.07, 0, TAU);
      ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${0.24 - i * 0.036})`;
      ctx.lineWidth = 2.2 + (2 - i * 0.28);
      ctx.shadowBlur = 22;
      ctx.shadowColor = `rgba(${c[0]},${c[1]},${c[2]},0.9)`;
      ctx.stroke();
    }

    // vertical light column
    const colGrad = ctx.createLinearGradient(x, 0, x, H);
    colGrad.addColorStop(0, 'rgba(128,92,255,0)');
    colGrad.addColorStop(0.28, 'rgba(86,226,255,0.08)');
    colGrad.addColorStop(0.5, 'rgba(255,225,235,0.34)');
    colGrad.addColorStop(0.72, 'rgba(255,62,165,0.11)');
    colGrad.addColorStop(1, 'rgba(24,8,58,0)');
    ctx.fillStyle = colGrad;
    ctx.fillRect(x - minDim * 0.018, 0, minDim * 0.036, H);

    // luminous heart
    const heart = ctx.createRadialGradient(x, y, 0, x, y, minDim * (0.16 + pulse * 0.055));
    heart.addColorStop(0, 'rgba(255,255,255,0.98)');
    heart.addColorStop(0.09, 'rgba(255,228,246,0.96)');
    heart.addColorStop(0.22, 'rgba(255,107,205,0.68)');
    heart.addColorStop(0.55, 'rgba(143,67,255,0.28)');
    heart.addColorStop(1, 'rgba(45,8,95,0)');
    ctx.fillStyle = heart;
    ctx.beginPath();
    ctx.arc(x, y, minDim * (0.16 + pulse * 0.055), 0, TAU);
    ctx.fill();

    // bright orbital beads
    for (let i = 0; i < 9; i++) {
      const orbit = minDim * (0.105 + i * 0.038);
      const ang = t * (0.42 + i * 0.018) + i * 2.399;
      const bx = x + Math.cos(ang) * orbit * 1.38;
      const by = y + Math.sin(ang) * orbit * 0.53 - Math.sin(ang * 1.7 + i) * 5;
      const c = palette[i % palette.length];
      const r = (i % 3 === 0 ? 3.4 : 1.5) * (1 + pulse * 0.45);
      ctx.shadowBlur = 18;
      ctx.shadowColor = `rgba(${c[0]},${c[1]},${c[2]},1)`;
      ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},0.95)`;
      ctx.beginPath();
      ctx.arc(bx, by, r, 0, TAU);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawParticles(t, pulse) {
    const px = pointer.x - 0.5, py = pointer.y - 0.5;
    const x0 = cx + px * minDim * 0.085;
    const y0 = cy + py * minDim * 0.07;
    const maxRadius = Math.hypot(W, H) * 0.5;

    ctx.save();
    ctx.globalCompositeOperation = 'screen';

    for (const p of particles) {
      p.angle += p.speed * (1 + pulse * 0.32);
      p.radius += p.radial * 0.010;
      if (p.radius > 1) p.radius = 0.035;
      if (p.radius < 0.018) p.radius = 0.96;

      const r = Math.pow(p.radius, 0.82) * maxRadius * 0.72;
      const swirl = Math.sin(p.phase + t * p.wobble) * 0.16;
      const angle = p.angle + swirl * (0.4 + p.radius) + (p.radius < 0.16 ? 0.55 : 0);
      const ell = 0.58 + 0.2 * Math.sin(p.phase * 0.7 + 1.1);
      const x = x0 + Math.cos(angle) * r * (1.08 + 0.08 * Math.sin(t * 0.2 + p.phase));
      const y = y0 + Math.sin(angle) * r * ell;
      const depth = 1 - smoothstep(0.25, 0.92, p.radius);
      const c = palette[p.hue];
      const alpha = 0.12 + depth * 0.78 * (0.58 + 0.42 * Math.sin(t * 2 + p.phase));

      ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
      ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
      ctx.beginPath();
      ctx.arc(x, y, p.size * (0.55 + depth * 1.3 + pulse * 0.35), 0, TAU);
      ctx.fill();

      if (p.size > 2.25) {
        ctx.globalAlpha *= 0.75;
        ctx.strokeStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - Math.sin(angle) * 18 * (0.6 + depth), y + Math.cos(angle) * 18 * ell * (0.6 + depth));
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  function drawBloomVeil(t, pulse) {
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const g = ctx.createRadialGradient(cx, cy, minDim * 0.02, cx, cy, minDim * (0.58 + pulse * 0.13));
    g.addColorStop(0, `rgba(255,180,230,${0.13 + pulse * 0.08})`);
    g.addColorStop(0.36, 'rgba(124,51,255,0.10)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    const vignette = ctx.createRadialGradient(cx, H * 0.5, minDim * 0.38, cx, H * 0.5, Math.max(W, H) * 0.82);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.66)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
  }

  function drawFrame(t) {
    pointer.x += (pointer.tx - pointer.x) * 0.055;
    pointer.y += (pointer.ty - pointer.y) * 0.055;

    const pulse = 0.5 + 0.5 * Math.sin(t * (Math.PI * 0.55) + 0.7);
    const breathe = Math.pow(pulse, 1.55);

    drawBackground(t, breathe);
    drawRibbons(t, breathe);
    drawParticles(t, breathe);
    drawCore(t, breathe);
    drawBloomVeil(t, breathe);
  }

  let last = performance.now();
  let start = last;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) * 0.001);
    last = now;
    const t = (now - start) * 0.001;
    drawFrame(t);
    requestAnimationFrame(frame);
  }

  function updatePointer(clientX, clientY) {
    pointer.tx = Math.min(1, Math.max(0, clientX / Math.max(1, W)));
    pointer.ty = Math.min(1, Math.max(0, clientY / Math.max(1, H)));
  }

  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('pointermove', e => updatePointer(e.clientX, e.clientY), { passive: true });
  window.addEventListener('pointerdown', e => updatePointer(e.clientX, e.clientY), { passive: true });
  window.addEventListener('touchmove', e => {
    const touch = e.touches[0];
    if (touch) updatePointer(touch.clientX, touch.clientY);
  }, { passive: true });

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
