<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#04070e">
<meta name="description" content="Vespers of the Deep — a generative bioluminescent landscape rendered live in WebGL.">
<title>Vespers of the Deep</title>
<style>
  :root { background: #04070e; }
  html, body { height: 100%; overflow: hidden; background: #04070e; }
  body  { margin: 0; background: #04070e; overscroll-behavior: none; }
  canvas, .fallback { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .fallback { background: radial-gradient(circle at 50% 38%, #12303c 0%, #061019 48%, #04070e 100%);
              animation: ebb 9s ease-in-out infinite alternate; }
  @keyframes ebb {
    0%   { filter: hue-rotate(-4deg) brightness(0.9) saturate(1.0); transform: scale(1.02); }
    100% { filter: hue-rotate(18deg) brightness(1.15) saturate(1.25); transform: scale(1.12) translateY(-2%); }
  }
</style>
</head>
<body>
<canvas id="art"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById("art");
  var gl = canvas.getContext("webgl", {
    antialias: false, alpha: false, depth: false, powerPreference: "high-performance"
  }) || canvas.getContext("experimental-webgl");

  var vertSrc =
    "attribute vec2 a_pos; varying vec2 v_uv;" +
    "void main(){ v_uv = a_pos * 0.5 + 0.5; gl_Position = vec4(a_pos, 0.0, 1.0); }";

  var fragSrc = [
    "precision highp float;",
    "uniform vec2 u_res; uniform float u_time; uniform vec2 u_mouse;",
    "uniform float u_dpr;",
    "float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }",
    "float noise(vec2 p){ vec2 i = floor(p); vec2 f = fract(p); vec2 u = f*f*(3.0-2.0*f);",
    " float a = hash(i), b = hash(i + vec2(1.0,0.0)), c = hash(i + vec2(0.0,1.0)), d = hash(i + vec2(1.0,1.0));",
    " return mix(mix(a,b,u.x), mix(c,d,u.x), u.y); }",
    "float fbm(vec2 p){ float v = 0.0; float a = 0.5; mat2 m = mat2(0.8,-0.6,0.6,0.8);",
    " for(int i = 0; i < 5; i++){ v += a * noise(p); p = m * p * 2.02 + vec2(3.7, 8.1); a *= 0.5; } return v; }",
    "void main(){",
    " vec2 uv = v_uv;",
    " float asp = u_res.x / u_res.y;",
    " vec2 p = (uv - 0.5); p.x *= asp; p.y *= 1.12;",
    " p += (u_mouse - vec2(0.5, 0.5)) * 0.045;",
    " float t = u_time;",
    " float tA = t * 0.055, tB = t * 0.012, tC = t * 0.19, tD = t * 0.017;",
    " /* domain-warped fbm nebula */",
    " vec2 q = vec2(fbm(p * 1.55 + vec2(tA, -tA * 0.7)), fbm(p * 1.55 + vec2(4.1, 1.3) - vec2(tA * 0.8, 0.0)));",
    " vec2 rw = vec2(fbm(p * 2.25 + vec2(1.8, 0.5) + q * 1.65), fbm(p * 2.25 + vec2(5.1, 3.2) - q * 1.65));",
    " float f = fbm(p * 2.6 + rw * 1.9);",
    " float f2 = fbm(p * 4.7 + rw * 1.15);",
    " float hueShift = 0.5 + 0.5 * sin(t * 0.085 + 1.3);",
    " /* abyss gradient */",
    " vec3 col = mix(vec3(0.004, 0.009, 0.020), vec3(0.012, 0.075, 0.082), clamp(f * 1.05 + 0.25, 0.0, 1.0));",
    " /* silhouette strata: wide slow teal layers */",
    " col += vec3(0.06, 0.32, 0.33) * smoothstep(0.52, 0.92, fbm(vec2(p.x * 1.4 + tD, p.y * 1.4 - tB)) * 1.35) * 0.55;",
    " /* deep caustic field near the floor */",
    " float ca = pow(clamp(fbm(p * 2.35 - vec2(tC * 0.35, -tC * 0.5) + vec2(2.7, -1.4)) - 0.42, 0.0, 1.0), 2.6);",
    " col += vec3(0.72, 0.50, 0.16) * ca * exp(p.y * 2.9 + 0.9) * 1.5;",
    " /* the sun: warm core, low below centre */",
    " vec2 sunP = vec2(0.02, -0.42);",
    " float ds = distance(p, sunP);",
    " float sun = exp(-ds * ds * 6.4);",
    " float sunCore = exp(-ds * ds * 15.0);",
    " col = mix(col, vec3(0.35, 0.13, 0.05), sun * 0.45);",
    " col += mix(vec3(1.0, 0.45, 0.12), vec3(1.0, 0.83, 0.48), hueShift * 0.6 + sunCore * 0.7) * sun * 1.1;",
    " /* cold cyan halo around the sun */",
    " col += vec3(0.25, 0.78, 1.0) * exp(-ds * ds * 13.5) * 0.9;",
    " /* filaments radiating from the sun */",
    " vec2 dir = p - sunP;",
    " float ang = atan(dir.y, dir.x);",
    " float fil = pow(abs(sin(ang * 4.5 + rw.x * 2.7 + rw.y * 2.2 + tD)), 7.0);",
    " fil *= exp(-ds * 1.45) * 0.95;",
    " col += mix(vec3(1.0, 0.72, 0.33), vec3(0.68, 0.95, 0.72), hueShift * 0.42) * fil;",
    " /* sonar ripple rings around the sun */",
    " float ring = abs(sin(ds * 7.2 - t * 1.25));",
    " col += vec3(0.35, 0.92, 1.0) * pow(max(0.0, 1.0 - ring), 10.0) * 0.34 * exp(-ds * 2.1);",
    " /* magenta ribbon band */",
    " float ribbon = smoothstep(0.62, 0.98, f2 + max(0.0, rw.y - 0.55) * 0.7);",
    " col = mix(col, vec3(0.62, 0.10, 0.34), ribbon * 0.42);",
    " col += vec3(0.92, 0.22, 0.55) * smoothstep(0.66, 1.05, rw.y * 0.6 + rw.x * 0.75 + f2 * 0.55) * 0.30;",
    " /* plankton motes, twinkling, drifting up */",
    " float aspF = max(asp, 0.75);",
    " vec2 uv2 = vec2(uv.x * aspF * 24.0, uv.y * 24.0);",
    " vec2 gid = floor(uv2);",
    " float h1 = hash(gid + 13.13);",
    " float h2 = hash(gid * 1.37 + vec2(71.7, 17.3));",
    " float h3 = hash(gid * 1.61 + vec2(9.2, 40.8));",
    " float tw = 0.5 + 0.5 * sin(t * (0.55 + h1 * 1.9) + 6.2831 * h2);",
    " float mrad = (0.0035 + h3 * 0.0085) * (0.8 + 0.35 * sin(t * 1.6 + h2 * 9.0));",
    " vec2 mpos = (gid + vec2(0.2 + 0.6 * h1, 0.15 + 0.7 * h2)) / vec2(aspF * 24.0, 24.0);",
    " mpos.y = fract(mpos.y + u_time * (0.006 + 0.012 * h1));",
    " mpos.x = fract(mpos.x + u_time * (0.004 + 0.009 * h2));",
    " mpos = vec2(mpos.x * aspF * 0.95 + 0.05, mpos.y);",
    " float md = distance(uv, mpos);",
    " col += vec3(0.82, 0.97, 0.86) * smoothstep(mrad, 0.0, md) * (0.25 + 0.75 * tw) * (0.35 + h1 * 0.75);",
    " /* rare gold mote */",
    " float h4 = hash(gid + vec2(99.1, 3.3));",
    " float gold = smoothstep(0.93, 1.0, h4) * (0.5 + 0.5 * sin(t * 2.2 + h2 * 20.0));",
    " mpos = (gid + vec2(0.2 + 0.6 * h3, 0.15 + 0.7 * h1)) / vec2(aspF * 24.0, 24.0);",
    " mpos.y = fract(mpos.y + u_time * (0.006 + 0.012 * h3));",
    " mpos.x = fract(mpos.x + u_time * (0.004 + 0.009 * h1));",
    " mpos = vec2(mpos.x * aspF * 0.95 + 0.05, mpos.y);",
    " col += vec3(1.0, 0.80, 0.35) * smoothstep(mrad * 1.35, 0.0, distance(uv, mpos)) * gold * 1.4;",
    " /* gentle vignette to keep the frame tight */",
    " float vig = smoothstep(1.18, 0.3, distance(uv, vec2(0.5, 0.52)) * 1.38);",
    " col *= mix(0.30, 1.22, vig);",
    " /* barely-there grain */",
    " float grain = hash(uv * vec2(aspF * 913.7, 577.3) + floor(u_time * 60.0) * vec2(91.7, 13.9));",
    " col += (grain - 0.5) * 0.030 * vec3(1.0, 0.9, 0.8);",
    " gl_FragColor = vec4(clamp(col, 0.0, 1.18), 1.0);",
    "}"
  ].join("\n");

  function compile(shader, type, source) {
    var s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.warn("Shader error:", gl.getShaderInfoLog(s));
      throw new Error("shader compile failed");
    }
    return s;
  }

  function buildProgram() {
    var program = gl.createProgram();
    gl.attachShader(program, compile(gl.VERTEX_SHADER, gl.VERTEX_SHADER, 0, vertSrc));
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, gl.FRAGMENT_SHADER, 0, fragSrc));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error("shader link failed: " + gl.getProgramInfoLog(program));
    }
    return program;
  }

  var program = null, ok = false;
  try { program = buildProgram(); ok = true; } catch (e) {}

  var attrPos, locUniform, locTime, locRes, locMouse, locDpr;
  if (ok) {
    attrPos = gl.getAttribLocation(program, "a_pos");
    locUniform = gl.getUniformLocation(program, "u_time");
    locRes = gl.getUniformLocation(program, "u_res");
    locMouse = gl.getUniformLocation(program, "u_mouse");
    locDpr = gl.getUniformLocation(program, "u_dpr");
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 2, -1, -2, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(attrPos);
    gl.vertexAttribPointer(attrPos, 2, gl.FLOAT, false, 0, 0);
  }

  /* half-resolution render target buffer the shader draws into directly */
  var rtFramebuffer = null, rtTexture = null, rtWidth = 1, rtHeight = 1, quad = null;
  if (ok) {
    rtFramebuffer = gl.createFramebuffer();
    rtTexture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, rtTexture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.bindFramebuffer(gl.FRAMEBUFFER, rtFramebuffer);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, rtTexture, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 3, 1]), gl.STATIC_DRAW);
  }

  function resize() {
    var cssW = window.innerWidth, cssH = window.innerHeight;
    var scale = Math.min(1, 1050 / Math.max(cssW, 1));
    var w = Math.max(160, Math.round(cssW * scale));
    var h = Math.max(160, Math.round(w * cssH / cssW));
    canvas.width = w; canvas.height = h;
    if (ok) {
      rtWidth = w; rtHeight = h;
      gl.bindFramebuffer(gl.FRAMEBUFFER, rtFramebuffer);
      gl.viewport(0, 0, w, h);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, rtTexture, 0);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    }
  }
  resize();
  window.addEventListener("resize", resize, { passive: true });

  /* mouse parallax (harmless on touch) */
  var mouse = { x: 0.5, y: 0.5 };
  canvas.addEventListener("pointermove", function (e) {
    mouse.x = e.clientX / window.innerWidth;
    mouse.y = 1 - e.clientY / window.innerHeight;
  }, { passive: true });
  if (!gl) { canvas.classList.add("fallback"); }

  if (ok) {
    gl.useProgram(program);
    gl.uniform1i(locDpr, 0);
    var start = performance.now();
    function frame(now) {
      var t = (now - start) / 1000.0;
      gl.bindFramebuffer(gl.FRAMEBUFFER, rtFramebuffer);
      gl.viewport(0, 0, rtWidth, rtHeight);
      gl.useProgram(program);
      gl.uniform2f(locRes, rtWidth, rtHeight);
      gl.uniform1f(locTime, t);
      gl.uniform2f(locMouse, mouse.x, mouse.y);
      gl.bindBuffer(gl.ARRAY_BUFFER, quad);
      gl.enableVertexAttribArray(attrPos);
      gl.vertexAttribPointer(attrPos, 2, gl.FLOAT, false, 0, 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      /* composite: webgl canvas is already drawn scaled to device; overlay nothing */
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
