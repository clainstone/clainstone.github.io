<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#03060c">
<title>Sunrift — where the light settles</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#03060c}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const cv=document.getElementById('c');
const ctx=cv.getContext('2d',{alpha:false});
const TAU=Math.PI*2;
let W=1,H=1,DPR=1,gSX=0,gSY=0,gR=0;

/* seeded rng */
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
const rng=mulberry32(20250607);
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);};
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);

/* ---------- seeded world ---------- */
const STARS=[];for(let i=0;i<165;i++){STARS.push({x:rng(),y:rng()*0.44,z:0.3+rng()*0.7,ph:rng()*TAU,tw:0.5+rng()*2.0,gold:rng()<0.2});}
const CLOUDS=[];for(let i=0;i<9;i++){CLOUDS.push({x:rng()*1.5-0.25,y:0.07+rng()*0.23,s:0.085+rng()*0.105,sp:0.0026+rng()*0.0042,ph:rng()*TAU,warm:i%3!==2,amp:0.35+rng()*0.65});}
const BIRDS=[];for(let i=0;i<6;i++){BIRDS.push({x:rng(),y:0.24+rng()*0.12,sp:0.0055+rng()*0.008,s:0.7+rng()*0.95,ph:rng()*TAU});}
const EMBERS=[];for(let i=0;i<190;i++){EMBERS.push({fx:rng(),fy:0.02+rng()*0.96,spd:0.03+rng()*0.09,sz:0.7+rng()*rng()*2.5,ph:rng()*TAU,ivory:rng()<0.16});}
const BLOB=[[-0.95,0.10,0.52],[-0.5,-0.18,0.66],[0,-0.40,0.82],[0.5,-0.16,0.64],[0.95,0.08,0.50]];

/* static grain tile */
const noise=document.createElement('canvas');noise.width=noise.height=144;
(function(){const n=noise.getContext('2d');const id=n.createImageData(144,144);for(let i=0;i<id.data.length;i+=4){const v=(Math.random()*255)|0;id.data[i]=v;id.data[i+1]=v;id.data[i+2]=v;id.data[i+3]=255;}n.putImageData(id,0,0);})();

/* ember glow sprites */
function makeSprite(inner,mid){const s=document.createElement('canvas');s.width=s.height=64;const c=s.getContext('2d');const g=c.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,inner);g.addColorStop(0.25,mid);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,64,64);return s;}
const emberSprite=makeSprite('rgba(255,236,170,1)','rgba(255,166,74,0.55)');
const emberSpritePale=makeSprite('rgba(255,255,240,1)','rgba(255,236,200,0.45)');

function resize(){DPR=Math.min(window.devicePixelRatio||1,1.5);W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);resize();

/* ---------- fixed step ---------- */
const DT=0.016;let tG=0;

/* ---------- ridge model ---------- */
function ridgeHeight(u,seed){
 return 0.5
  +0.40*Math.sin(u*Math.PI*2*1.32+seed*2.1)
  +0.27*Math.sin(u*Math.PI*2*3.55+seed*5.3+1.7)
  +0.17*Math.sin(u*Math.PI*2*7.8+seed*9.1+4.1)
  +0.09*Math.sin(u*Math.PI*2*13.4+seed*12.3+2.2);
}
function drawRidge(baseF,ampPx,color,rim){
 const N=46,pts=[];
 for(let i=0;i<=N;i++){const u=i/N;pts.push([(u-0.045)*W*1.09,baseF*H+(ridgeHeight(u,rim?5.1:9.4)-0.5)*ampPx]);}
 ctx.beginPath();ctx.moveTo(-6,H+6);
 for(let i=0;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
 ctx.lineTo(W+6,H+6);ctx.closePath();ctx.fillStyle=color;ctx.fill();
 if(rim){
  const rg=ctx.createLinearGradient(0,0,W,0);
  rg.addColorStop(Math.max(0,(gSX-gR*3.4)/W),'rgba(255,150,90,0)');
  rg.addColorStop(clamp(gSX/W,0,1),'rgba(255,190,128,0.6)');
  rg.addColorStop(clamp((gSX+gR*3.4)/W,0,1),'rgba(255,150,90,0)');
  ctx.strokeStyle=rg;ctx.lineWidth=1.6;ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.stroke();
 }
}

/* glint palette */
const GLINT=[];for(let i=0;i<=18;i++){const a=0.05+Math.pow(i/18,1.4)*0.5;GLINT.push('rgba(255,176,96,'+a.toFixed(3)+')');}

function frame(){
 tG+=DT;
 const t=tG,m=Math.min(W,H);
 const sx=W*0.705, sy=H*0.305, R=m*0.155;
 gSX=sx;gSY=sy;gR=R;

 /* 1 · sky */
 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#02050c');g.addColorStop(0.30,'#0a1020');g.addColorStop(0.52,'#131a2c');
 g.addColorStop(0.66,'#1d1622');g.addColorStop(0.78,'#241623');g.addColorStop(0.90,'#101017');g.addColorStop(1,'#03060b');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 /* warm haze at horizon */
 g=ctx.createRadialGradient(sx,H*0.575,0,sx,H*0.575,W*0.40);
 g.addColorStop(0,'rgba(255,150,82,0.34)');g.addColorStop(0.35,'rgba(206,104,64,0.14)');g.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 /* 2 · stars */
 for(let i=0;i<STARS.length;i++){const s=STARS[i];
  const a=(0.25+0.75*s.z)*(0.55+0.45*Math.sin(t*s.tw+s.ph));
  const sz=s.z*1.35+0.55;
  ctx.fillStyle=s.gold?'rgba(255,222,168,'+a.toFixed(3)+')':'rgba(228,238,255,'+a.toFixed(3)+')';
  ctx.fillRect(s.x*W,s.y*H,sz,sz);
 }

 /* 3 · sun + halo + god rays (behind clouds) */
 ctx.globalCompositeOperation='lighter';
 g=ctx.createRadialGradient(sx,sy,0,sx,sy,R*4.6);
 g.addColorStop(0,'rgba(255,196,120,0.72)');g.addColorStop(0.22,'rgba(255,150,80,0.32)');g.addColorStop(0.52,'rgba(180,70,60,0.11)');g.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,sy,R*4.6,0,TAU);ctx.fill();
 /* rays fan */
 for(let i=0;i<6;i++){
  const dir=Math.PI+(i-2.5)*0.36+Math.sin(t*0.42+i*1.9)*0.09;
  const spread=0.135+0.045*Math.sin(t*0.5+i*2.7+1);
  const len=W*0.72;
  const g2=ctx.createLinearGradient(0,0,Math.cos(dir)*len,Math.sin(dir)*len);
  g2.addColorStop(0,'rgba(255,182,116,0.20)');g2.addColorStop(0.55,'rgba(220,120,70,0.05)');g2.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g2;ctx.beginPath();ctx.moveTo(sx,sy);ctx.arc(sx,sy,len,dir-spread,dir+spread);ctx.closePath();ctx.fill();
 }
 /* vertical light shaft */
 g=ctx.createLinearGradient(0,sy,0,H*0.88);
 g.addColorStop(0,'rgba(255,196,130,0.30)');g.addColorStop(0.3,'rgba(255,160,95,0.12)');g.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=g;
 const shW=R*1.5;
 ctx.fillRect(sx-shW/2,sy,shW,H*0.88-sy);
 g=ctx.createLinearGradient(0,sy,0,sy-R*2.8);
 g.addColorStop(0,'rgba(255,190,120,0.16)');g.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=g;
 ctx.fillRect(sx-shW/3,sy-R*2.8,shW/1.5,R*2.8);
 ctx.globalCompositeOperation='source-over';

 /* 4 · disc + core + anamorphic flare + ring */
 g=ctx.createRadialGradient(sx,sy,0,sx,sy,R);
 g.addColorStop(0,'#fffef2');g.addColorStop(0.30,'#ffe9a8');g.addColorStop(0.58,'#ffc261');g.addColorStop(0.82,'#f5733a');g.addColorStop(1,'rgba(240,110,40,0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,sy,R,0,TAU);ctx.fill();
 g=ctx.createRadialGradient(sx,sy,0,sx,sy,R*0.55);
 g.addColorStop(0,'rgba(255,255,255,0.95)');g.addColorStop(0.55,'rgba(255,231,160,0.35)');g.addColorStop(1,'rgba(255,220,150,0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,sy,R*0.55,0,TAU);ctx.fill();
 ctx.strokeStyle='rgba(255,226,160,0.5)';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(sx,sy,R*1.28,0,TAU);ctx.stroke();
 ctx.strokeStyle='rgba(255,190,120,0.16)';ctx.lineWidth=5;ctx.beginPath();ctx.arc(sx,sy,R*1.36,0,TAU);ctx.stroke();
 ctx.globalCompositeOperation='lighter';
 ctx.save();ctx.translate(sx,sy);ctx.scale(1,0.135);
 g=ctx.createRadialGradient(0,0,0,0,0,W*0.46);
 g.addColorStop(0,'rgba(255,200,140,0.42)');g.addColorStop(0.3,'rgba(255,160,95,0.17)');g.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,W*0.46,0,TAU);ctx.fill();
 ctx.restore();
 ctx.globalCompositeOperation='source-over';

 /* 5 · clouds */
 for(let i=0;i<CLOUDS.length;i++){const c=CLOUDS[i];
  const span=1.5;
  let cx=((((c.x+t*c.sp)%span)+span)%span)-0.25;cx*=W;
  const wob=Math.sin(t*0.55+c.ph)*m*0.004;
  const cy=c.y*H+Math.sin(t*0.16+c.ph*1.7)*m*0.006;
  const sc=c.s*m;
  const warm=c.warm,a0=warm?1:0.62;
  for(let j=0;j<BLOB.length;j++){
   const o=BLOB[j],bx=cx+o[0]*sc,by=cy+o[1]*sc*1.05,r=o[2]*sc;
   g=ctx.createRadialGradient(bx,by,0,bx,by,r);
   if(warm){
    const al=0.42*c.amp*a0*(0.8+0.2*Math.sin(t*0.4+c.ph+j*1.9));
    g.addColorStop(0,'rgba(255,172,110,'+al.toFixed(3)+')');
    g.addColorStop(0.5,'rgba(206,96,74,'+(al*0.5).toFixed(3)+')');
    g.addColorStop(1,'rgba(0,0,0,0)');
   }else{
    g.addColorStop(0,'rgba(146,176,216,'+(0.30*c.amp*a0).toFixed(3)+')');
    g.addColorStop(0.5,'rgba(76,100,148,'+(0.18*c.amp*a0).toFixed(3)+')');
    g.addColorStop(1,'rgba(0,0,0,0)');
   }
   ctx.fillStyle=g;ctx.beginPath();ctx.arc(bx,by,r,0,TAU);ctx.fill();
  }
 }

 /* 6 · birds */
 ctx.strokeStyle='rgba(5,8,13,0.88)';
 for(let i=0;i<BIRDS.length;i++){const b=BIRDS[i];
  let bx=((((b.x+t*b.sp*0.055)%1.25)+1.25)%1.25)-0.125;bx*=W;
  const by=b.y*H+Math.sin(t*1.25+b.ph)*7;
  const w=b.s*12,h=b.s*(5.2+3.1*Math.abs(Math.sin(t*2.9+b.ph)));
  ctx.lineWidth=Math.max(1.3,b.s*1.5);
  ctx.beginPath();
  ctx.moveTo(bx-w,by);
  ctx.quadraticCurveTo(bx-w*0.38,by-h*0.72,bx,by-h*0.12);
  ctx.quadraticCurveTo(bx+w*0.38,by-h*0.72,bx+w,by);
  ctx.quadraticCurveTo(bx+w*0.42,by+h*0.34,bx,by+h*0.12);
  ctx.quadraticCurveTo(bx-w*0.42,by+h*0.34,bx-w,by);
  ctx.stroke();
 }

 /* 7 · mountains (far rim light, near silhouette) */
 drawRidge(0.505,m*0.062,'#141c2b',true);
 drawRidge(0.545,m*0.075,'#05090f',false);

 /* 8 · sea */
 const horizon=H*0.575;
 g=ctx.createLinearGradient(0,horizon,0,H);
 g.addColorStop(0,'#241417');g.addColorStop(0.18,'#12202b');g.addColorStop(0.5,'#081119');g.addColorStop(1,'#02050a');
 ctx.fillStyle=g;ctx.fillRect(0,horizon,W,H-horizon);

 /* sun reflection shaft */
 ctx.globalCompositeOperation='lighter';
 g=ctx.createLinearGradient(sx-120,0,sx+120,0);
 g.addColorStop(0,'rgba(255,120,50,0)');g.addColorStop(0.5,'rgba(255,168,100,0.34)');g.addColorStop(1,'rgba(255,120,50,0)');
 ctx.fillStyle=g;ctx.fillRect(sx-120,horizon,240,H-horizon);
 ctx.globalCompositeOperation='source-over';

 /* 9 · glitter */
 const ROWS=40;
 for(let i=0;i<ROWS;i++){
  const p=i/(ROWS-1);
  const y=horizon+(H-horizon)*Math.pow(p,1.72);
  const wave=Math.sin(t*1.7-p*5.2+Math.sin(t*0.55+i*0.9)*1.35);
  const wob=Math.sin(t*0.85+p*4.4+1.2)*(4+p*30);
  const wobX=sx+wob;
  const dashLen=6+p*92;
  const nDash=2+Math.floor(p*7);
  for(let j=0;j<nDash;j++){
   const seed=i*31.7+j*7.13;
   const h1v=hash(seed),h2v=hash(seed+3.7),h3v=hash(seed+9.2);
   const bx=wobX+(h1v-0.5)*(10+p*175);
   const dashL=(5+h3v*44)*(0.22+p*1.75);
   const aligned=Math.max(0,1-Math.abs(bx-wobX)/(30+p*150));
   const aBase=0.05+0.34*Math.pow(Math.max(0,Math.sin(i*0.42+t*2.05+h2v*5.6)),2);
   const alpha=aBase*(1-p*0.28)*(0.35+1.9*aligned)+0.02;
   if(alpha<0.05)continue;
   ctx.fillStyle=GLINT[clamp(Math.round(alpha*18),0,18)];
   const wob2=Math.sin(t*2.2+i*1.7+h2v*6.28)*(0.8+p*2.6);
   ctx.fillRect(bx+wob2,y,dashL,0.8+p*2.5);
  }
 }

 /* 10 · embers rising */
 ctx.globalCompositeOperation='lighter';
 for(let i=0;i<EMBERS.length;i++){const e=EMBERS[i];
  e.fy-=e.spd*DT;
  if(e.fy<0.03){e.fy=0.94+Math.random()*0.06;e.fx=Math.random();}
  const ex=(e.fx+Math.sin(t*0.9+e.ph)*0.012)*W;
  const ey=e.fy*H;
  const size=(1.4+e.sz*2.6)*(0.85+0.3*Math.sin(t*2+e.ph*3));
  const fade=clamp(Math.min(e.fy-0.02,0.96-e.fy)*7,0,1);
  ctx.globalAlpha=fade*0.9;
  ctx.drawImage(e.ivory?emberSpritePale:emberSprite,ex-size*3,ey-size*3,size*6,size*6);
 }
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';

 /* 11 · vignette */
 g=ctx.createRadialGradient(W*0.5,H*0.46,m*0.4,W*0.5,H*0.52,Math.max(W,H)*0.85);
 g.addColorStop(0,'rgba(2,3,6,0)');g.addColorStop(0.72,'rgba(2,3,6,0.18)');g.addColorStop(1,'rgba(1,2,4,0.72)');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 /* 12 · grain */
 ctx.globalAlpha=0.05;
 for(let y=-144;y<H+144;y+=144){for(let x=-144;x<W+144;x+=144){
  ctx.drawImage(noise,0,0,144,144,x+(Math.random()*28-14),y+(Math.random()*28-14),144,144);
 }}
 ctx.globalAlpha=1;

 /* 13 · fade-in */
 const fade=1-t*0.9;
 if(fade>0){ctx.fillStyle='rgba(2,4,8,'+fade.toFixed(3)+')';ctx.fillRect(0,0,W,H);}

 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
