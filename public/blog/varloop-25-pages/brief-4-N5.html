<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
<meta name="color-scheme" content="dark"/>
<title>Aurora of Forgotten Stars</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #02010c;
    overflow: hidden;
    overscroll-behavior: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: block;
    width: 100vw; height: 100vh;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
/* ============ noise ============ */
function hash2(ix, iy, seed) {
  let h = (seed | 0) ^ Math.imul(ix | 0, 374761393) ^ Math.imul(iy | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, seed) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * fx * (fx * (fx * 6 - 15) + 10);
  const vy = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
  const a = hash2(ix, iy, seed), b = hash2(ix + 1, iy, seed);
  const c = hash2(ix, iy + 1, seed), d = hash2(ix + 1, iy + 1, seed);
  const ab = a + (b - a) * ux, cd = c + (d - c) * ux;
  return ab + (cd - ab) * vy;
}
function fbm(x, y, seed, oct) {
  let sum = 0, amp = 0.5, norm = 0, f = 1;
  for (let i = 0; i < oct; i++) {
    sum += amp * vnoise(x * f, y * f, seed + i * 101);
    norm += amp; amp *= 0.5; f *= 2.03;
  }
  return sum / norm;
}
/* ============ helpers ============ */
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
function sstep(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
function grad3(h, stops) {
  h = clamp(h, 0, 1);
  for (let i = 1; i < stops.length; i++) {
    if (h <= stops[i][0]) {
      const s0 = stops[i - 1], s1 = stops[i];
      return mix3(s0[1], s1[1], (h - s0[0]) / ((s1[0] - s0[0]) || 1e-6));
    }
  }
  const last = stops[stops.length - 1][1];
  return [last[0], last[1], last[2]];
}
/* ============ sky pipeline ============ */
let ASPECT = 1.8;
const HOR = 0.68; // horizon line, fraction of height
const MOON_NX = 0.665, MOON_NY = 0.272, MOON_R = 0.112;

function skyColor(cx, cy, t, refl) {
  // base gradient: near-black indigo -> muted teal at horizon
  let col = grad3(cy / HOR, [
    [0.00, [2, 1, 12]],
    [0.55, [13, 7, 36]],
    [1.00, [9, 32, 38]]
  ]);

  // main aurora ribbon (green -> cyan -> violet -> pink)
  const cA = 0.175 + 0.15 * fbm(cx * 1.5 + 3.3 + t * 0.055, 5.4 - t * 0.02, 11, 3);
  let A = Math.exp(-Math.pow((cy - cA) * 7.6, 2));
  A *= sstep(0.47, 0.82, fbm(cx * 2.3 + 91.7 - t * 0.055, 9.2, 23, 3));
  A *= sstep(0.38, 0.75, vnoise(cx * 9.0 + t * 0.5, t * 1.8 + 2.1, 41));
  const hA = fbm(cx * 2.1 + 0.6 + t * 0.035, cy * 2.9 + 7.3, 31, 3);
  const cAcol = grad3(hA, [
    [0.00, [18, 240, 170]],
    [0.34, [0, 209, 224]],
    [0.68, [150, 102, 255]],
    [1.00, [255, 106, 199]]
  ]);
  col = mix3(col, cAcol, clamp(A, 0, 1) * 0.72);

  // warm lower ribbon (gold -> ember -> coral)
  const cB = 0.435 + 0.105 * fbm(cx * 2.5 + 21.3 - t * 0.04, 2.8 + t * 0.025, 51, 2);
  let B = Math.exp(-Math.pow((cy - cB) * 10.5, 2)) * 0.5;
  B *= 0.3 + 0.7 * fbm(cx * 4.6 + 55.5 + t * 0.05, 14.1, 67, 2);
  const hB = fbm(cx * 1.6 + 4.4, 3.3 + t * 0.03, 71, 2);
  const cBcol = grad3(hB, [
    [0.00, [255, 210, 128]],
    [0.55, [255, 138, 74]],
    [1.00, [255, 84, 92]]
  ]);
  col = mix3(col, cBcol, clamp(B, 0, 1) * 0.58);

  // faint pink ribbon near zenith
  const cC = 0.02 + 0.028 * fbm(cx * 1.15 + 63.2 + t * 0.07, 12.8, 81, 2);
  let C = Math.exp(-Math.pow((cy - cC) * 22, 2)) * 0.3;
  C *= sstep(0.38, 0.74, fbm(cx * 3.2 + t * 0.045 + 8.8, 17.5, 97, 2));
  col = mix3(col, [255, 92, 178], clamp(C, 0, 1) * 0.22);

  // star field
  if (!refl) {
    const fade = 1 - sstep(0.40, HOR, cy);
    if (fade > 0.02) {
      const cs = 1 / 118;
      const ix = Math.floor(cx / cs), iy = Math.floor(cy / cs);
      for (let oy = -1; oy <= 1; oy++) {
        for (let ox = -1; ox <= 1; ox++) {
          const cellX = ix + ox, cellY = iy + oy;
          if (cellY < 0) continue;
          const r1 = hash2(cellX, cellY, 555);
          if (r1 < 0.82) continue;
          const px = (cellX + hash2(cellX, cellY, 556)) * cs;
          const py = (cellY + hash2(cellX, cellY, 557)) * cs;
          const dx = cx - px, dy = cy - py;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const rr = 0.009 + (r1 - 0.82) * 0.05;
          if (dist > rr) continue;
          const twinkle = 0.55 + 0.45 * Math.sin(t * (1.5 + 2.5 * hash2(cellX, cellY, 558)) + hash2(cellX, cellY, 559) * 6.283);
          const bright = (0.5 + (r1 - 0.82) * 7) * twinkle;
          const glow2 = Math.pow(1 - dist / rr, 3);
          const tint = mix3([198, 224, 255], [255, 226, 180], hash2(cellX, cellY, 560));
          const add = glow2 * bright * fade * 1.5;
          col = [col[0] + tint[0] * add, col[1] + tint[1] * add, col[2] + tint[2] * add];
        }
      }
    }
    // moon: outer glow, crescent body with craters
    const mx = MOON_NX * ASPECT, my = MOON_NY, mr = MOON_R;
    const dxm = cx - mx, dym = cy - my;
    const dm = Math.sqrt(dxm * dxm + dym * dym);
    const glow = Math.exp(-dm * 3.1);
    col = [col[0] + 66 * glow + 22 * glow, col[1] + 52 * glow + 16 * glow, col[2] + 26 * glow + 52 * glow];
    if (dm < mr * 1.03) {
      const sox = mx + mr * 0.44, soy = my - mr * 0.30, sor = mr * 0.88;
      const sdx = cx - sox, sdy = cy - soy;
      const dds = Math.sqrt(sdx * sdx + sdy * sdy);
      const shadow = sstep(sor * 1.1, sor * 0.42, dds);   // 1 deep inside shadow
      const disc = sstep(mr, mr * 0.96, dm);
      const inv = Math.max(dm, 1e-4);
      const nux = dxm / inv, nuy = dym / inv;
      let lum = 0.5 + 0.5 * (nux * -0.55 + nuy * -0.83);
      lum = 0.4 + 0.6 * clamp(lum, 0, 1);
      const crat = vnoise(cx * 26 + 4.7, cy * 26 + 9.3, 202) * 0.55 + vnoise(cx * 52 + 1.2, cy * 52 + 7.7, 203) * 0.45;
      lum *= 0.8 + crat * 0.36;
      let moonCol = mix3([126, 104, 80], [250, 238, 214], clamp(lum, 0, 1));
      moonCol = mix3(moonCol, [40, 32, 60], shadow * 0.92);
      col = mix3(col, moonCol, disc);
    }
  }

  // far hazy ridge
  if (cy > HOR - 0.10) {
    const topFar = HOR - (0.012 + 0.035 * fbm(cx * 1.9 + 150.2, 8.8, 320, 3));
    if (cy > topFar) col = [26, 16, 46];
  }
  // near dark ridge with warm rim
  if (cy > HOR - 0.13) {
    const hNear = 0.018
      + 0.038 * fbm(cx * 2.35 + 88.2, 5.6, 123, 3)
      + 0.018 * fbm(cx * 6.3 + 31.4, 2.3, 212, 2);
    const topNear = HOR - hNear;
    if (cy > topNear) {
      const ri = 0.5 + 0.5 * fbm(cx * 3.4 + 12.1, 8.8, 455, 2);
      col = [5, 3, 18];
      const rim = Math.exp(-(cy - topNear) * 260) * (0.45 + 0.4 * ri);
      col = [col[0] + rim * 185, col[1] + rim * 96, col[2] + rim * 52];
    }
  }
  return col;
}

function pixelAt(cx, cy, t) {
  let col;
  if (cy <= HOR) {
    col = skyColor(cx, cy, t, false);
  } else {
    // mirror the sky into the lake
    const my2 = 2 * HOR - cy;
    const ripple = (vnoise(cx * 4.6 + t * 1.05, cy * 30 + t * 1.35, 333) - 0.5) * 0.045
      + Math.sin(cy * 43 + t * 1.7) * 0.004;
    let rc = skyColor(cx + ripple, my2, t, true);
    const dDepth = sstep(HOR, 1, cy);
    const depthMul = 1 - dDepth * 0.6;
    rc = [rc[0] * 0.5 * depthMul + 3, rc[1] * 0.58 * depthMul + 5, rc[2] * 0.64 * depthMul + 15];
    // moon glint column on the water
    const gx = cx + ripple * 2 - MOON_NX * ASPECT;
    const shG = vnoise(t * 2.2 + 3.3, cy * 36 + 8.8, 777);
    const glint = Math.exp(-gx * gx * 1500) * (0.25 + 0.75 * Math.pow(shG, 1.5)) * Math.exp(-(cy - HOR) * 2.3);
    rc = [rc[0] + 255 * glint * 0.6, rc[1] + 208 * glint * 0.52, rc[2] + 158 * glint * 0.38];
    col = rc;
  }
  // horizon glow line
  const hline = Math.exp(-Math.abs(cy - HOR) * 60);
  col = [col[0] + hline * 20 + hline * hline * 26, col[1] + hline * 44 + hline * hline * 9, col[2] + hline * 46];
  return col;
}

/* ============ canvas / buffers ============ */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const buf = document.createElement('canvas');
const bctx = buf.getContext('2d');
let W = 0, H = 0;
let bufW = 0, bufH = 0, img = null;
let scaleTarget = 0.165;
const SCALE_MIN = 0.115, SCALE_MAX = 0.22;

function resizeBuffer() {
  let bh = clamp(Math.round(H * scaleTarget), 84, 172);
  let bw = Math.round(bh * ASPECT);
  if (bw > 300) { bw = 300; bh = Math.round(bw / ASPECT); }
  if (bw === bufW && bh === bufH) return;
  bufW = bw; bufH = bh;
  buf.width = bw; buf.height = bh;
  img = bctx.createImageData(bw, bh);
}
function resizeAll() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
  ASPECT = W / H;
  resizeBuffer();
}
window.addEventListener('resize', resizeAll);

/* ============ glow sprites (no external assets) ============ */
function glowSprite(rgb, alpha) {
  const s = 64, c = document.createElement('canvas');
  c.width = s; c.height = s;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  rg.addColorStop(0, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + alpha + ')');
  rg.addColorStop(0.28, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + (alpha * 0.5) + ')');
  rg.addColorStop(1, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0)');
  g.fillStyle = rg; g.fillRect(0, 0, s, s);
  return c;
}
function bokehSprite(rgb) {
  const s = 96, c = document.createElement('canvas');
  c.width = s; c.height = s;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  rg.addColorStop(0.00, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0.04)');
  rg.addColorStop(0.60, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0.05)');
  rg.addColorStop(0.78, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0.18)');
  rg.addColorStop(0.90, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0.5)');
  rg.addColorStop(1.00, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0)');
  g.fillStyle = rg; g.fillRect(0, 0, s, s);
  return c;
}
const MOTE_RGB = [[255, 210, 140], [255, 138, 180], [124, 245, 205], [166, 140, 255], [255, 166, 112]];
const moteSprites = MOTE_RGB.map(c => glowSprite(c, 1));
const bokehSprites = [[190, 150, 255], [255, 200, 130], [110, 240, 205]].map(bokehSprite);
const whiteGlow = glowSprite([235, 240, 255], 1);

/* ============ floating layers ============ */
const motes = [], bokeh = [];
function spawnMote(p, anywhere) {
  p.x = Math.random() * W;
  p.y = anywhere ? Math.random() * H : H + 12;
  p.r = 1.6 + Math.pow(Math.random(), 2.2) * 3.4;
  p.vy = 14 + Math.random() * 30;
  p.sway = 4 + Math.random() * 16;
  p.phase = Math.random() * 6.283;
  p.tw = 0.6 + Math.random() * 1.3;
  p.twPhase = Math.random() * 6.283;
  p.sprite = moteSprites[(Math.random() * moteSprites.length) | 0];
  p.alpha = 0.45 + Math.random() * 0.5;
}
function spawnBokeh(b) {
  b.x = Math.random() * W;
  b.y = H * (0.18 + Math.random() * 0.72);
  b.r = 24 + Math.random() * 56;
  b.vx = (Math.random() - 0.5) * 6;
  b.phase = Math.random() * 6.283;
  b.sprite = bokehSprites[(Math.random() * bokehSprites.length) | 0];
  b.alpha = 0.09 + Math.random() * 0.12;
}
function seedLayers() {
  motes.length = 0; bokeh.length = 0;
  const n = W < 760 ? 55 : 88;
  for (let i = 0; i < n; i++) { const p = {}; spawnMote(p, true); motes.push(p); }
  for (let i = 0; i < 9; i++) { const b = {}; spawnBokeh(b); bokeh.push(b); }
}

let shooter = null, shootTimer = 1.6;
function updateShooter(dt) {
  if (!shooter) {
    shootTimer -= dt;
    if (shootTimer <= 0) {
      const dir = Math.random() < 0.5 ? 1 : -1;
      shooter = {
        x: dir > 0 ? -40 : W + 40,
        y: H * (0.05 + Math.random() * 0.28),
        vx: dir * (560 + Math.random() * 260),
        vy: 240 + Math.random() * 120,
        life: 1
      };
      shootTimer = 5 + Math.random() * 5.5;
    }
    return;
  }
  shooter.x += shooter.vx * dt;
  shooter.y += shooter.vy * dt;
  shooter.life -= dt * 0.9;
  if (shooter.life <= 0 || shooter.x < -220 || shooter.x > W + 220) { shooter = null; return; }
  const tail = 0.14;
  const tx = shooter.x - shooter.vx * tail, ty = shooter.y - shooter.vy * tail;
  const grad = ctx.createLinearGradient(shooter.x, shooter.y, tx, ty);
  grad.addColorStop(0, 'rgba(255,255,255,' + (0.95 * shooter.life) + ')');
  grad.addColorStop(0.4, 'rgba(190,200,255,' + (0.5 * shooter.life) + ')');
  grad.addColorStop(1, 'rgba(150,140,255,0)');
  ctx.strokeStyle = grad;
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(shooter.x, shooter.y);
  ctx.lineTo(tx, ty);
  ctx.stroke();
  ctx.globalAlpha = shooter.life;
  const hs = 34;
  ctx.drawImage(whiteGlow, shooter.x - hs / 2, shooter.y - hs / 2, hs, hs);
  ctx.globalAlpha = 1;
}

function drawLayers(dt, t) {
  ctx.globalCompositeOperation = 'lighter';
  for (const b of bokeh) {
    b.x += (b.vx + Math.sin(t * 0.25 + b.phase) * 3) * dt;
    if (b.x < -b.r * 2) b.x = W + b.r * 2;
    else if (b.x > W + b.r * 2) b.x = -b.r * 2;
    ctx.globalAlpha = b.alpha * (0.75 + 0.25 * Math.sin(t * 0.6 + b.phase));
    ctx.drawImage(b.sprite, b.x - b.r, b.y - b.r * 0.72, b.r * 2, b.r * 1.44);
  }
  for (const p of motes) {
    p.y -= p.vy * dt;
    p.x += Math.sin(t * 0.85 + p.phase) * p.sway * dt;
    if (p.y < -14) { p.y = H + 12; p.x = Math.random() * W; }
    const tw = 0.5 + 0.5 * Math.sin(t * p.tw * 2.1 + p.twPhase);
    ctx.globalAlpha = p.alpha * (0.45 + 0.55 * tw);
    const sz = p.r * 2 + p.r * 11;
    ctx.drawImage(p.sprite, p.x - sz / 2, p.y - sz / 2, sz, sz);
    ctx.globalAlpha = p.alpha * tw;
    ctx.fillStyle = 'rgba(255, 250, 235, 0.9)';
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.min(1.6, p.r * 0.32), 0, 6.2832);
    ctx.fill();
  }
  updateShooter(dt);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ============ render ============ */
function renderShader(t) {
  const data = img.data;
  for (let y = 0; y < bufH; y++) {
    const ny = (y + 0.5) / bufH, cy = ny;
    const dyv = ny - 0.44;
    for (let x = 0; x < bufW; x++) {
      const nx = (x + 0.5) / bufW, cx = nx * ASPECT;
      const p = pixelAt(cx, cy, t);
      const dxN = nx - 0.5;
      const dvn = Math.sqrt(dxN * dxN * 1.25 + dyv * dyv * 1.1) / 0.8;
      const vig = 1 - 0.55 * sstep(0.28, 1.02, dvn);
      let r = p[0] * vig, g = p[1] * vig, b = p[2] * vig;
      // gentle contrast lift
      r = clamp((r - 108) * 1.09 + 108, 0, 255);
      g = clamp((g - 108) * 1.09 + 108, 0, 255);
      b = clamp((b - 108) * 1.09 + 108, 0, 255);
      // film grain
      const gr = (Math.random() - 0.5) * 11;
      r += gr; g += gr; b += gr + 1.6;
      const i = (y * bufW + x) * 4;
      data[i] = r < 0 ? 0 : (r > 255 ? 255 : r);
      data[i + 1] = g < 0 ? 0 : (g > 255 ? 255 : g);
      data[i + 2] = b < 0 ? 0 : (b > 255 ? 255 : b);
      data[i + 3] = 255;
    }
  }
  bctx.putImageData(img, 0, 0);
}

/* ============ main loop ============ */
let lastFrame = 0, emaMs = 16, tick = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dtMs = lastFrame ? now - lastFrame : 16;
  lastFrame = now;
  const dt = clamp(dtMs / 1000, 0.001, 0.05);
  const t = (now / 1000) % 720; // keep noise args small
  renderShader(t);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(buf, 0, 0, W, H);
  drawLayers(dt, t);
  // adaptive quality: hold >= 30fps on weak devices
  emaMs = emaMs * 0.93 + Math.min(dtMs, 50) * 0.07;
  if ((tick = (tick + 1) % 40) === 0) {
    if (emaMs > 30 && scaleTarget > SCALE_MIN) {
      scaleTarget = Math.max(SCALE_MIN, scaleTarget - 0.02);
      resizeBuffer();
    } else if (emaMs < 17 && scaleTarget < SCALE_MAX) {
      scaleTarget = Math.min(SCALE_MAX, scaleTarget + 0.018);
      resizeBuffer();
    }
  }
}

resizeAll();
seedLayers();
requestAnimationFrame(frame);
</script>
</body>
</html>
