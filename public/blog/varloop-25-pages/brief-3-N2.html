<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vespertine Bloom</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05010d; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="art"></canvas>
<script>
(() => {
  const canvas = document.getElementById('art');
  const gl = canvas.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' });
  const VERT = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;
  const FRAG = `
    precision highp float;
    uniform vec2 resolution;
    uniform float time;
    float hash(vec2 p){
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
    }
    float noise(vec2 p){
      vec2 i = floor(p), f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
                 mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
    }
    float fbm(vec2 p){
      float sum = 0.0, amp = 0.5;
      for (int i = 0; i < 5; i++) {
        sum += amp * noise(p);
        p = p * 2.03 + vec2(19.7, 7.3);
        amp *= 0.5;
      }
      return sum;
    }
    void main(){
      vec2 uv = gl_FragCoord.xy / resolution;
      float aspect = resolution.x / resolution.y;
      vec2 p = (uv - 0.5) * 2.0;
      p.x *= aspect;
      float t = time * 0.075;

      vec2 drift = vec2(sin(t * 1.7) * 0.18, cos(t * 1.25) * 0.15);
      vec2 q = vec2(
        fbm(p * 1.35 + vec2(t * 1.10, -t * 0.70) + drift),
        fbm(p * 1.35 + vec2(5.2, 1.3) - vec2(t * 0.85, t * 1.15))
      );
      float f = fbm(p * 1.75 + q * 2.55 + vec2(0.0, t * 1.35));
      float bloom = smoothstep(0.24, 0.92, f);
      float filaments = smoothstep(0.55, 1.0, 1.0 - abs(2.0 * f - 1.0));

      vec2 corePos = vec2(sin(t * 2.1) * 0.18, -0.12 + cos(t * 1.55) * 0.16);
      float heart = length((p - corePos) * vec2(1.20, 1.42));
      float core = exp(-max(heart, 0.001) * 3.9);
      float halo = exp(-max(heart + 0.18, 0.001) * 1.85);

      vec3 deepVoid = vec3(0.012, 0.006, 0.045);
      vec3 indigo = vec3(0.075, 0.025, 0.24);
      vec3 violet = vec3(0.34, 0.055, 0.40);
      vec3 magenta = vec3(0.78, 0.12, 0.39);
      vec3 ember = vec3(1.00, 0.36, 0.18);
      vec3 gold = vec3(1.00, 0.80, 0.43);

      vec3 col = mix(deepVoid, indigo, bloom);
      col = mix(col, violet, smoothstep(0.52, 0.82, f) * 0.85);
      col = mix(col, magenta, smoothstep(0.72, 1.0, f) * filaments * 0.72);
      col += gold * halo * 0.16;
      col = mix(col, ember, pow(core, 2.0) * 0.82);
      col = mix(col, gold, pow(core, 4.8));

      float sparkle = step(0.997, hash(floor(p * 34.0) + floor(time * 2.0)));
      col += sparkle * vec3(0.35, 0.48, 0.80) * (0.55 + 0.45 * sin(time * 4.0 + hash(floor(p * 11.0)) * 40.0));

      float vignette = smoothstep(1.35, 0.42, length(uv - 0.5) * 1.45);
      col *= mix(0.38, 1.0, vignette);
      col += (hash(gl_FragCoord.xy + fract(time)) - 0.5) * 0.025;
      gl_FragColor = vec4(col, 1.0);
    }`;

  function compile(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
    return shader;
  }

  let program = null;
  if (gl) {
    try {
      program = gl.createProgram();
      gl.attachShader(program, compile(gl.VERTEX_SHADER, VERT));
      gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAG));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) program = null;
    } catch (e) { program = null; }
  }

  if (program) {
    const position = gl.getAttribLocation(program, 'p');
    const location = {
      resolution: gl.getUniformLocation(program, 'resolution'),
      time: gl.getUniformLocation(program, 'time')
    };
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(position);
    gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
    gl.useProgram(program);

    function render() {
      const scale = Math.min(window.devicePixelRatio || 1, 1.5);
      const width = Math.max(1, Math.floor(window.innerWidth * scale));
      const height = Math.max(1, Math.floor(window.innerHeight * scale));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      gl.viewport(0, 0, width, height);
      gl.uniform2f(location.resolution, width, height);
      gl.uniform1f(location.time, performance.now() / 1000);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  } else {
    const ctx = canvas.getContext('2d');
    const start = performance.now();
    function fallback() {
      const w = canvas.width = window.innerWidth, h = canvas.height = window.innerHeight;
      const t = (performance.now() - start) / 1000;
      const grad = ctx.createRadialGradient(w * (0.5 + Math.sin(t) * 0.05), h * 0.62, 10, w * 0.5, h * 0.62, Math.max(w, h) * 0.75);
      grad.addColorStop(0, '#ffe08a'); grad.addColorStop(0.32, '#ff5a2c'); grad.addColorStop(0.62, '#4b0752'); grad.addColorStop(1, '#03010d');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
      requestAnimationFrame(fallback);
    }
    fallback();
  }
})();
</script>
</body>
</html>
