<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Ember Tides</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #030612; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(() => {
  const canvas = document.getElementById('stage');
  const gl = canvas.getContext('webgl', { antialias: true, alpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
  if (!gl) { canvas.style.background = '#07142a'; return; }
  gl.getExtension('OES_element_index_uint');

  const vert = `
    attribute vec2 position;
    void main() { gl_Position = vec4(position, 0.0, 1.0); }
  `;
  const frag = `
    precision highp float;
    uniform vec2 u_resolution;
    uniform float u_time;

    float hash11(float p) { return fract(sin(p * 127.1) * 43758.5453123); }
    vec3 hash33(vec3 p) {
      p = vec3(dot(p, vec3(127.1, 311.7, 74.7)), dot(p, vec3(269.5, 183.3, 246.1)), dot(p, vec3(113.5, 271.9, 124.6)));
      return fract(sin(p) * 43758.5453123);
    }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      float a = hash11(dot(i, vec2(127.1, 311.7)));
      float b = hash11(dot(i + vec2(1.0, 0.0), vec2(127.1, 311.7)));
      float c = hash11(dot(i + vec2(0.0, 1.0), vec2(127.1, 311.7)));
      float d = hash11(dot(i + vec2(1.0, 1.0), vec2(127.1, 311.7)));
      return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
    }
    float fbm(vec2 p) {
      float v = 0.0, amp = 0.55;
      mat2 rot = mat2(0.8, -0.6, 0.6, 0.8);
      for (int i = 0; i < 5; i++) {
        v += amp * noise(p);
        p = rot * p * 2.0 + vec2(3.7, 1.3);
        amp *= 0.52;
      }
      return v;
    }

    void main() {
      vec2 uv = gl_FragCoord.xy / u_resolution.xy;
      float aspect = u_resolution.x / u_resolution.y;
      vec2 p = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / min(u_resolution.x, u_resolution.y);
      p *= 2.15;

      float t = u_time * 0.16;
      float r = length(p);
      float theta = atan(p.y, p.x);
      const float sectors = 7.0;
      const float k = 6.28318530718 / sectors;
      float sectorFloat = theta / k + u_time * 0.025;
      float sector = floor(sectorFloat);
      float beta = mod(theta - k * 0.5, k) - k * 0.5 + sin(t * 0.23) * 0.08;
      float boundary = abs(beta) / (k * 0.5); // 0 centre, 1 edge
      float petal = pow(clamp(cos(beta), 0.0, 1.0), 3.6);
      float sectorHue = hash11(sector + 19.19);

      // Domain-warped living tissue.
      vec2 q = p * 1.55;
      q += 0.55 * vec2(
        fbm(p * 1.55 + vec2(t * 0.85, -t * 0.42) + 4.7),
        fbm(p * 1.55 + vec2(-t * 0.38, t * 0.74) + 9.2)
      );
      float n = fbm(q * 1.28 + vec2(r * 1.7 - t * 0.55, theta * 0.72 + r * 0.8 + t * 0.34));
      float fine = fbm(p * 6.2 + n * 1.85 - vec2(t * 0.9, t * 0.35));

      // Palette: deep abyss -> bioluminescent teal -> magenta -> ember gold.
      vec3 deep = vec3(0.012, 0.018, 0.075);
      vec3 teal = vec3(0.00, 0.42, 0.48);
      vec3 cyan = vec3(0.05, 0.78, 0.82);
      vec3 magenta = vec3(0.90, 0.08, 0.48);
      vec3 ember = vec3(1.00, 0.60, 0.12);
      vec3 violet = vec3(0.34, 0.10, 0.55);

      vec3 col = mix(deep, violet, smoothstep(0.28, 0.76, n));
      col = mix(col, teal, smoothstep(0.34, 0.72, n + 0.18 * sin(r * 4.0 - t * 2.0 + sectorHue)));
      col = mix(col, cyan, smoothstep(0.62, 0.92, fine) * 0.38);

      // Petals open from the heart of the bloom.
      float radialFall = exp(-r * (1.18 + 0.35 * sectorHue));
      float bloomPulse = 0.88 + 0.22 * sin(u_time * 1.45 + r * 3.6 - sectorHue * 5.0);
      float petalMask = petal * radialFall * bloomPulse * smoothstep(1.18, 0.12, r) * (0.30 + 0.95 * n);
      vec3 petalColor = mix(magenta, ember, smoothstep(0.32, 0.95, petal * (0.42 + 0.78 * n + sectorHue * 0.35)));
      petalColor = mix(petalColor, cyan, smoothstep(0.68, 1.0, 1.0 - petal) * 0.32);
      col += petalColor * petalMask * 1.35;

      // Bright veins along petal edges.
      float vein = smoothstep(0.78, 0.985, boundary) * radialFall * (0.20 + 0.80 * fine);
      col += vec3(0.35, 0.95, 1.00) * vein * 1.05;

      // Fine filamentary glow inside the petals.
      float filament = pow(clamp(0.5 + 0.5 * sin(r * 38.0 - n * 16.0 - sectorHue * 9.0 + t * 2.4), 0.0, 1.0), 9.0);
      col += mix(cyan, ember, sectorHue) * filament * petal * radialFall * 0.85;

      // Concentric tide ripples.
      float ripple = pow(0.5 + 0.5 * sin(r * 22.0 - n * 7.0 - u_time * 0.85), 7.0);
      col += vec3(0.02, 0.20, 0.45) * ripple * smoothstep(1.55, 0.1, r) * (0.35 + 0.65 * fine);

      // Hot breathing core.
      float core = exp(-r * r * 13.0) * (0.85 + 0.35 * sin(u_time * 1.8));
      col += vec3(1.00, 0.43, 0.08) * core * 1.15;
      col += vec3(1.00, 0.88, 0.42) * exp(-r * r * 42.0) * (0.75 + 0.25 * sin(u_time * 2.4));

      // Sparks drifting outward from the centre.
      float sparkField = step(0.982, hash11(floor(sectorFloat * 3.0) * 91.7 + floor(fine * 13.0) * 17.31 + floor(u_time * 2.0) * 0.618));
      float spark = sparkField * radialFall * smoothstep(0.1, 0.9, fine);
      col += vec3(1.0, 0.82, 0.45) * spark * 1.8;

      // Filmic tone, vignette and grain.
      col *= 1.0 - 0.48 * smoothstep(0.55, 1.45, length(p * vec2(0.72, 1.18)));
      col = pow(max(col, vec3(0.0)), vec3(0.82));
      float grain = hash11(dot(gl_FragCoord.xy, vec2(12.9898, 78.233)) + fract(u_time * 24.0) * 37.0) - 0.5;
      col += grain * 0.038;
      col = clamp(col, 0.0, 1.0);

      gl_FragColor = vec4(col, 1.0);
    }
  `;

  function compile(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error(log);
      return null;
    }
    return shader;
  }
  const vertexShader = compile(gl.VERTEX_SHADER, vert);
  const fragmentShader = compile(gl.FRAGMENT_SHADER, frag);
  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) return;
  gl.useProgram(program);

  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const position = gl.getAttribLocation(program, 'position');
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

  const uResolution = gl.getUniformLocation(program, 'u_resolution');
  const uTime = gl.getUniformLocation(program, 'u_time');
  const start = performance.now();
  let frame = 0;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const width = Math.max(1, Math.floor(window.innerWidth * dpr));
    const height = Math.max(1, Math.floor(window.innerHeight * dpr));
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
      gl.viewport(0, 0, width, height);
    }
  }

  function frameLoop(now) {
    resize();
    gl.uniform2f(uResolution, canvas.width, canvas.height);
    gl.uniform1f(uTime, (now - start) / 1000);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    frame = requestAnimationFrame(frameLoop);
  }
  window.addEventListener('resize', resize, { passive: true });
  frameLoop(start);
})();
</script>
</body>
</html>
