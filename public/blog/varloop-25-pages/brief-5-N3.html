<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ember Meridian</title>
<style>
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#020507; }
  canvas { display:block; width:100vw; height:100vh; cursor:default; }
</style>
</head>
<body>
<canvas id="art" aria-hidden="true"></canvas>
<script>
(() => {
  const canvas = document.getElementById('art');
  const gl = canvas.getContext('webgl', { antialias:false, alpha:false, depth:false, stencil:false });
  if (!gl) return fallback(canvas);

  const compile = (type, source) => {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
    return shader;
  };
  const vertex = `attribute vec2 position; void main(){ gl_Position = vec4(position, 0.0, 1.0); }`;
  const fragment = `
precision highp float;
uniform vec2 uRes;
uniform float uTime;

float hash21(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
}
float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0;
  float amp = 0.52;
  mat2 rot = mat2(0.80, 0.60, -0.60, 0.80);
  for (int i = 0; i < 5; i++) {
    v += amp * noise(p);
    p = rot * p * 2.03 + vec2(19.7, -7.3);
    amp *= 0.52;
  }
  return v;
}

void main() {
  vec2 p = (gl_FragCoord.xy * 2.0 - uRes) / min(uRes.x, uRes.y);
  float x = p.x;
  float y = p.y;
  float t = uTime;
  float horizon = -0.18;

  float drift = t * 0.085;
  float n1 = fbm(p * 1.35 + vec2(drift * 0.9, -drift * 0.35));
  float n2 = fbm(p * 2.55 + vec2(-drift * 1.25, drift * 0.75) + n1 * 1.45);
  float warp = fbm(p * 3.05 + n1 * 1.65 + vec2(-drift * 2.1, drift * 1.35));

  vec3 abyss  = vec3(0.002, 0.006, 0.011);
  vec3 teal    = vec3(0.018, 0.27, 0.28);
  vec3 magenta = vec3(0.32, 0.035, 0.19);
  vec3 gold    = vec3(1.00, 0.42, 0.075);
  vec3 peach   = vec3(1.00, 0.84, 0.58);

  float above = smoothstep(horizon - 0.02, horizon + 0.11, y);
  vec3 color = mix(vec3(0.004, 0.014, 0.020), abyss, clamp(smoothstep(horizon + 0.05, 1.55, y), 0.0, 1.0));
  color += teal * exp(-abs(y - horizon) * 4.7) * 0.22;
  color += magenta * exp(-pow((y - horizon) * 3.6, 2.0)) * 0.20;

  float auroraMask = above * exp(-pow((y - 0.82) * 0.95, 2.0));
  float auroraA = smoothstep(0.58, 0.96, fbm(vec2(x * 0.88 + t * 0.055, y * 2.15 - t * 0.018)));
  float auroraB = smoothstep(0.70, 0.99, fbm(vec2(x * 1.32 - t * 0.040 + 5.1, y * 3.0 + t * 0.025)));
  color += teal * auroraA * auroraMask * 0.50;
  color += magenta * auroraB * auroraMask * 0.34;

  float sunY = horizon + 0.34;
  vec2 sp = vec2((x - 0.05 * sin(t * 0.23)) * 1.12, y - sunY);
  float sunDist = length(sp);
  float sunEdge = 0.385 + (fbm(p * 5.5 + t * 0.035) - 0.5) * 0.030;
  float sunCore = 1.0 - smoothstep(sunEdge - 0.018, sunEdge + 0.018, sunDist);
  float sunGlow = exp(-sunDist * 3.15);
  vec3 sunColor = mix(gold, peach, clamp(1.0 - sunDist / sunEdge, 0.0, 1.0));
  color += sunColor * sunCore * 1.25;
  color += vec3(1.0, 0.30, 0.055) * sunGlow * 0.52;
  color += peach * exp(-sunDist * 8.5) * 0.35;

  float ridge = horizon + 0.045 + (fbm(vec2(x * 1.22 + 3.7, 11.3 + fbm(vec2(x * 0.62, 2.9)) * 1.8)) - 0.50) * 0.50;
  float aboveRidge = 1.0 - smoothstep(ridge - 0.014, ridge + 0.014, y);
  float ridgeLand = aboveRidge * smoothstep(horizon - 0.025, horizon + 0.012, y);
  color = mix(color, vec3(0.002, 0.004, 0.006), ridgeLand);
  float rim = exp(-abs(y - ridge) * 74.0) * step(horizon, y);
  color += gold * rim * (0.52 + 0.30 * n2);

  float depth = max(horizon - y, 0.0);
  float water = 1.0 - smoothstep(horizon - 0.022, horizon + 0.020, y);
  vec3 waterCol = mix(vec3(0.003, 0.009, 0.014), vec3(0.010, 0.058, 0.066), exp(-depth * 1.75));
  color = mix(color, waterCol, water);
  color += vec3(0.28, 0.050, 0.012) * exp(-depth * 5.0) * water * 0.75;

  float streakCenter = (n2 - 0.5) * 0.42 + sin(y * 5.7 + t * 1.15) * 0.035;
  float streakWidth = 0.075 + depth * 0.34;
  float streak = exp(-pow((x - streakCenter) / streakWidth, 2.0)) * smoothstep(-1.55, horizon - 0.04, y);
  color += mix(gold, peach, exp(-depth * 3.8)) * streak * 0.68;

  float ca = fbm(vec2((x + (n2 - 0.5) * 0.75) * 2.75, depth * 7.8 - t * 0.42 + warp * 1.9));
  float caustic = pow(smoothstep(0.74, 0.985, ca), 1.9) * (1.0 - clamp(depth * 0.72, 0.0, 1.0));
  color += vec3(0.015, 0.31, 0.31) * caustic * water * 0.85;
  float hotCaustic = pow(smoothstep(0.88, 0.998, fbm(vec2(x * 4.4 - warp * 2.1, depth * 14.0 + t * 0.30))), 2.4);
  color += gold * hotCaustic * (1.0 - clamp(depth * 0.90, 0.0, 1.0)) * water * 0.55;

  float sparkle = smoothstep(0.965, 0.999, fbm(vec2(x * 8.5 + warp * 3.0, depth * 19.0 - t * 1.25)));
  color += peach * sparkle * (1.0 - clamp(depth * 1.35, 0.0, 1.0)) * water * 0.45;

  float grain = hash21(gl_FragCoord.xy + vec2(fract(t) * 431.0, fract(t * 1.7) * 191.0));
  color += (grain - 0.5) * 0.042;
  float vig = 1.0 - smoothstep(0.42, 1.65, length(p * vec2(0.88, 0.82)));
  color *= mix(0.48, 1.05, vig);

  color = pow(clamp(color, 0.0, 1.25), vec3(0.92));
  gl_FragColor = vec4(color, 1.0);
}`;

  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);

  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const location = gl.getAttribLocation(program, 'position');
  gl.enableVertexAttribArray(location);
  gl.vertexAttribPointer(location, 2, gl.FLOAT, false, 0, 0);

  const resLoc = gl.getUniformLocation(program, 'uRes');
  const timeLoc = gl.getUniformLocation(program, 'uTime');
  const scale = Math.min(0.78, 1500 / Math.max(window.innerWidth, window.innerHeight));

  function resize() {
    const w = Math.max(1, Math.floor(window.innerWidth * scale));
    const h = Math.max(1, Math.floor(window.innerHeight * scale));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
  }

  function frame(now) {
    resize();
    gl.uniform2f(resLoc, canvas.width, canvas.height);
    gl.uniform1f(timeLoc, (now || 0) * 0.001);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', resize, { passive:true });
  requestAnimationFrame(frame);
})();

function fallback(canvas) {
  const ctx = canvas.getContext('2d');
  const resize = () => { canvas.width = innerWidth; canvas.height = innerHeight; };
  resize();
  addEventListener('resize', resize, { passive:true });
  const start = performance.now();
  const tick = now => {
    const t = (now - start) * 0.001;
    const w = canvas.width, h = canvas.height, cx = w * 0.5, cy = h * 0.43;
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#010409'); g.addColorStop(.45, '#07262b'); g.addColorStop(.52, '#b33b12'); g.addColorStop(.58, '#03070b'); g.addColorStop(1, '#000102');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    const sun = ctx.createRadialGradient(cx, cy, 2, cx, cy, Math.min(w, h) * .42);
    sun.addColorStop(0, '#fff0c4'); sun.addColorStop(.22, '#ffa03a'); sun.addColorStop(1, 'rgba(255, 70, 10, 0)');
    ctx.fillStyle = sun; ctx.beginPath(); ctx.arc(cx, cy, Math.min(w, h) * .42, 0, 7); ctx.fill();
    ctx.fillStyle = '#010203'; ctx.beginPath();
    ctx.moveTo(0, h * .58);
    for (let i = 0; i <= 48; i++) {
      const x = i / 48 * w;
      const y = h * .58 - (Math.sin(i * .73 + 1.7) * .5 + Math.sin(i * 1.7) * .35 + .55) * h * .10;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(w, h * .62); ctx.lineTo(0, h * .62); ctx.closePath(); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 10; i++) {
      const yy = h * .62 + (i / 10) * h * .34 + Math.sin(t * 1.3 + i) * 4;
      const lw = w * (.12 + i * .035);
      const lg = ctx.createLinearGradient(cx - lw, 0, cx + lw, 0);
      lg.addColorStop(0, 'rgba(255, 105, 20, 0)'); lg.addColorStop(.5, `rgba(255, ${150 + i * 5}, 55, ${.34 - i * .024})`); lg.addColorStop(1, 'rgba(255, 105, 20, 0)');
      ctx.fillStyle = lg; ctx.fillRect(cx - lw, yy, lw * 2, 1.8 + (i % 3));
    }
    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
