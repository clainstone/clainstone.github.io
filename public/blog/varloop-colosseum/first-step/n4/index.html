<style>

  #controls {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; align-items: center; gap: 10px;
    background: rgba(16, 18, 28, 0.72);
    border: 1px solid rgba(232, 214, 168, 0.3);
    border-radius: 40px;
    padding: 8px 12px;
    backdrop-filter: blur(6px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);

    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(201, 168, 106, 0.16);
    color: #ece1c4; font-size: 19px; line-height: 1;
    transition: background .15s ease, transform .15s ease;
    display: flex; align-items: center; justify-content: center;
  }
  #controls button:hover { background: rgba(201, 168, 106, 0.42); transform: translateY(-1px); }
  #controls button:active { transform: translateY(1px) scale(.97); }
  #controls button.active { background: rgba(201, 168, 106, 0.6); color: #141420; }
  #controls .sep { width: 1px; height: 26px; background: rgba(232, 214, 168, 0.22); }

function archHole(cx, archWidth, springY, radius) {
  const p = new THREE.Path();
  const r = radius;
  p.moveTo(cx - r, 0);
  p.lineTo(cx - r, springY);
  p.absarc(cx, springY, r, Math.PI, 0, false);
  p.lineTo(cx + r, 0);
  p.closePath();
  return p;
}

function inscriptionTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 220;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#5b4630';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.strokeStyle = '#c9b285';
  ctx.lineWidth = 6;
  ctx.strokeRect(14, 14, c.width - 28, c.height - 28);
  ctx.fillStyle = '#e8d9b4';
  ctx.textAlign = 'center';
  ctx.font = '600 62px Georgia, serif';
  ctx.fillText('CONSTANTINVS AVG', c.width / 2, 92);
  ctx.font = '500 40px Georgia, serif';
  ctx.fillStyle = '#cbb487';
  ctx.fillText('· PONTIF MAX · IMP VII ·', c.width / 2, 165);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

// ---------------------------------------------------------------- city buildings
function makeBuilding(x, z, w, d, h, color, opts = {}) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = opts.ry || 0;
  scene.add(g);
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.92 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  body.position.y = h / 2;
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  const rimMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(color).multiplyScalar(0.78), roughness: 0.95 });
  const rim = new THREE.Mesh(new THREE.BoxGeometry(w + 0.22, 0.34, d + 0.22), rimMat);
  rim.position.y = h + 0.17;
  rim.castShadow = true;
  g.add(rim);
  // parapet hint (thin inner wall)
  const parapet = new THREE.Mesh(new THREE.BoxGeometry(w - 0.35, 0.3, d - 0.35), new THREE.MeshStandardMaterial({ color: new THREE.Color(color).multiplyScalar(0.92), roughness: 0.95 }));
  parapet.position.y = h + 0.42;
  // opening not needed; parapet acts as roof cap border effect
  // (keep small height, subtle)
  g.add(parapet);

  // door on one edge of the facade
  const doorX = (opts.doorX !== undefined ? opts.doorX : -(w / 2 - 0.95));
  const door = new THREE.Mesh(new THREE.BoxGeometry(1.05, 1.95, 0.12), new THREE.MeshStandardMaterial({ color: 0x472d1d, roughness: 0.8 }));
  door.position.set(doorX, 0.98, d / 2 + 0.045);
  g.add(door);
  const doorFrame = new THREE.Mesh(new THREE.BoxGeometry(1.35, 0.18, 0.18), rimMat);
  doorFrame.position.set(doorX, 2.06, d / 2 + 0.05);
  g.add(doorFrame);

  // windows on the street-facing side (+z local)
  const cols = Math.max(1, Math.floor((w - 1.2) / 1.6));
  const winYs = [];
  for (let wy = 1.9; wy + 0.55 <= h - 0.5; wy += 1.5) winYs.push(wy);
  if (winYs.length === 0) winYs.push(h - 1.1);
  g.updateMatrixWorld(true);
  for (const wy of winYs) {
    for (let c = 0; c < cols; c++) {
      const wx = (c - (cols - 1) / 2) * 1.72;
      if (wy < 2.6 && Math.abs(wx - doorX) < 1.15) continue; // leave clear around the door
      const local = new THREE.Vector3(wx, wy, d / 2 + 0.03);
      const world = g.localToWorld(local.clone());
      addWindow(world.x, world.y, world.z, opts.ry || 0, 0.74, 1.02);
    }
  }
  // side windows on the +x face for taller blocks
  if (h >= 3.8) {
    const sideLocal = new THREE.Vector3(w / 2 + 0.03, 2.35, 0);
    const world = g.localToWorld(sideLocal.clone());
    addWindow(world.x, world.y, world.z, (opts.ry || 0) + Math.PI / 2, 0.74, 1.02);
  }
  // rooftop details
  if (opts.tank) {
    const tank = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.85, 12), new THREE.MeshStandardMaterial({ color: 0x7d5a2e, roughness: 0.85 }));
    tank.position.set(-w * 0.22, h + 0.85, -d * 0.2);
    tank.castShadow = true;
    g.add(tank);
    const funnel = new THREE.Mesh(new THREE.ConeGeometry(0.56, 0.42, 12), new THREE.MeshStandardMaterial({ color: 0x5a3f1f, roughness: 0.9 }));
    funnel.position.set(-w * 0.22, h + 1.42, -d * 0.2);
    g.add(funnel);
  }
  if (opts.antenna) {
    const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.07, 1.7, 6), ironDark);
    ant.position.set(w * 0.25, h + 1.1, d * 0.18);
    g.add(ant);
    const crossBar = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.05, 0.05), ironDark);
    crossBar.position.set(w * 0.25, h + 1.68, d * 0.18);
    g.add(crossBar);

      // loop around the fountain
      const a = p.phase + elapsed * p.speed * 0.32;
      const rx = 3.1, rz = 2.15;
      x = 0.6 + Math.cos(a) * rx;
      z = 6.4 + Math.sin(a) * rz;
      const tx = -Math.sin(a) * rx, tz = Math.cos(a) * rz;
      ry = Math.atan2(tx, tz);
    } else if (p.kind === 1) {
      // back and forth along the front sidewalks
      const dir = p.offset > 0.5 ? 1 : -1;
      const zPos = p.offset > 0.5 ? 14.3 : 21.3;
      const travel = 31; // x range -15.5 .. 15.5
      const period = (elapsed * p.speed * 0.075 + p.offset * 3.7) % 2;
      let xPos, facing;
      if (period < 1) { xPos = -15.5 + period * travel; facing = 1 * dir > 0 ? 1 : -1; facing = dir; }
      else { xPos = 15.5 - (period - 1) * travel; facing = -dir; }
      // walking direction sign depends on dir so walkers pass each other on both sidewalks
      x = xPos;
      z = zPos;
      ry = facing > 0 ? Math.PI / 2 : -Math.PI / 2;
    } else {
      // slow circle in front of the broken temple
      const a = p.phase + elapsed * p.speed * 0.24;
      x = 15.0 + Math.cos(a) * 3.1;
      z = -3.3 + Math.sin(a) * 2.0;
      const tx = -Math.sin(a) * 3.1, tz = Math.cos(a) * 2.0;
      ry = Math.atan2(tx, tz);
    }
    const bob = Math.abs(Math.sin(elapsed * 7.5 * p.speed + p.phase * 3)) * 0.055;
    const scale = 1 + 0.04 * Math.sin(p.phase * 7);
    q.setFromAxisAngle(vAxis.set(0, 1, 0), ry);
    col.set(x, bob, z);
    m.compose(col, q, new THREE.Vector3(scale, scale, scale));
    personMesh.setMatrixAt(i, m);
    headMesh.setMatrixAt(i, m);
  }
  personMesh.instanceMatrix.needsUpdate = true;
  headMesh.instanceMatrix.needsUpdate = true;
}

// ---------------- day / night engine
const KEYS = [
  { t: 0.00, top: 0x05081c, bot: 0x111736, fog: 0x0a0f28, hemiSky: 0x27315e, hemiGnd: 0x0c0d18, hemiI: 0.34, amb: 0.20, sun: 0xffffff, sunI: 0.0, lampI: 2.6, winI: 1.6, glow: 0.30 },
  { t: 0.20, top: 0x070d28, bot: 0x1b2148, fog: 0x111834, hemiSky: 0x2a3564, hemiGnd: 0x0e0f1d, hemiI: 0.37, amb: 0.20, sun: 0xffffff, sunI: 0.0, lampI: 2.6, winI: 1.6, glow: 0.30 },
  { t: 0.24, top: 0x1c2050, bot: 0x54334f, fog: 0x2c2340, hemiSky: 0x3d3560, hemiGnd: 0x141018, hemiI: 0.40, amb: 0.21, sun: 0xffc9a0, sunI: 0.0, lampI: 2.5, winI: 1.5, glow: 0.55 },
  { t: 0.275, top: 0x39406e, bot: 0xe2724a, fog: 0x53324a, hemiSky: 0x584a5e, hemiGnd: 0x2c201a, hemiI: 0.52, amb: 0.22, sun: 0xff9a52, sunI: 1.7, lampI: 1.25, winI: 0.9, glow: 1.6 },
  { t: 0.33, top: 0x2f6fc0, bot: 0xe4c39a, fog: 0xa89a8e, hemiSky: 0x9db8d8, hemiGnd: 0x4a4238, hemiI: 0.68, amb: 0.22, sun: 0xffe2b0, sunI: 2.3, lampI: 0.0, winI: 0.0, glow: 0.7 },
  { t: 0.50, top: 0x2a6fc0, bot: 0xcfe8ea, fog: 0xaecdd6, hemiSky: 0xbcd8e8, hemiGnd: 0x556052, hemiI: 0.82, amb: 0.24, sun: 0xffffff, sunI: 2.7, lampI: 0.0, winI: 0.0, glow: 0.5 },
  { t: 0.68, top: 0x2a6fc0, bot: 0xc4ddda, fog: 0xaebfbd, hemiSky: 0xaeccd8, hemiGnd: 0x505a4c, hemiI: 0.78, amb: 0.23, sun: 0xfff3d4, sunI: 2.4, lampI: 0.0, winI: 0.0, glow: 0.55 },
  { t: 0.735, top: 0x3a3a6e, bot: 0xff7a3d, fog: 0x54303a, hemiSky: 0x5e4460, hemiGnd: 0x33241e, hemiI: 0.5, amb: 0.2, sun: 0xff8040, sunI: 1.5, lampI: 1.4, winI: 1.0, glow: 1.7 },
  { t: 0.80, top: 0x121838, bot: 0x322647, fog: 0x1a1834, hemiSky: 0x2a2c54, hemiGnd: 0x0f0e1c, hemiI: 0.38, amb: 0.2, sun: 0xffffff, sunI: 0.0, lampI: 2.5, winI: 1.5, glow: 0.4 },
  { t: 0.90, top: 0x05081c, bot: 0x111736, fog: 0x0a0f28, hemiSky: 0x232c58, hemiGnd: 0x0c0d18, hemiI: 0.34, amb: 0.2, sun: 0xffffff, sunI: 0.0, lampI: 2.6, winI: 1.6, glow: 0.3 },
  { t: 1.00, top: 0x05081c, bot: 0x111736, fog: 0x0a0f28, hemiSky: 0x27315e, hemiGnd: 0x0c0d18, hemiI: 0.34, amb: 0.20, sun: 0xffffff, sunI: 0.0, lampI: 2.6, winI: 1.6, glow: 0.30 },
];
const _ca = new THREE.Color(), _cb = new THREE.Color();
function lerpColorKey(a, b, u, target) {
  _ca.setHex(a); _cb.setHex(b);
  target.copy(_ca.lerp(_cb, u));
  return target;
}
function lerpNum(a, b, u) { return a + (b - a) * u; }
const _dir = new THREE.Vector3();
const _moonDir = new THREE.Vector3();
function updateTimeOfDay(t) {
  const time = ((t % 1) + 1) % 1;
  let i = 0;
  while (i < KEYS.length - 2 && KEYS[i + 1].t <= time) i++;
  const A = KEYS[i], B = KEYS[i + 1];
  const u = THREE.MathUtils.clamp((time - A.t) / Math.max(1e-5, B.t - A.t), 0, 1);
  const dayFactor = THREE.MathUtils.smoothstep(Math.sin((time - 0.25) * Math.PI * 2), -0.09, 0.16);

  // sky colors
  lerpColorKey(A.top, B.top, u, skyUniforms.topColor.value);
  lerpColorKey(A.bot, B.bot, u, skyUniforms.bottomColor.value);
  const fogCol = lerpColorKey(A.fog, B.fog, u, scene.fog.color);
  lerpColorKey(A.hemiSky, B.hemiSky, u, hemi.color);
  lerpColorKey(A.hemiGnd, B.hemiGnd, u, hemi.groundColor);
  hemi.intensity = lerpNum(A.hemiI, B.hemiI, u);
  amb.intensity = lerpNum(A.amb, B.amb, u);

  // sun path (east at 0.25, high at 0.5, west at 0.75)
  const phi = (time - 0.25) * Math.PI * 2;
  const sinPhi = Math.sin(phi), cosPhi = Math.cos(phi);
  _dir.set(cosPhi, sinPhi, 0.55).normalize();   // sun direction (elevation may be negative at night)
  _moonDir.set(-cosPhi, -sinPhi, 0.55).normalize(); // moon opposite
  const sunElev = sinPhi;
  const active = sunElev > -0.05 ? _dir : _moonDir;

  // directional light
  const sunCol = lerpColorKey(A.sun, B.sun, u, dirLight.color);
  const nightCol = new THREE.Color(0x8fa8e8);
  dirLight.color.copy(nightCol).lerp(sunCol, dayFactor);
  const keySunI = lerpNum(A.sunI, B.sunI, u);
  dirLight.intensity = lerpNum(0.42, keySunI, dayFactor);
  dirLight.position.copy(active).multiplyScalar(120).add(new THREE.Vector3(0, 0, 0));
  dirLight.target.position.set(0, 0, 0);
  dirLight.target.updateMatrixWorld();

  // sky glow around active body
  const lowWarm = THREE.MathUtils.clamp(1 - Math.abs(sunElev) * 2.6, 0, 1);
  skyUniforms.sunDirection.value.copy(active);
  skyUniforms.sunColor.value.copy(dirLight.color);
  skyUniforms.glowStrength.value = lerpNum(A.glow, B.glow, u) * (0.75 + lowWarm * 0.9);

  // sun / moon spheres
  sunMesh.visible = sunElev > -0.14;
  moonMesh.visible = -sunElev > -0.14 && sunElev < 0.18;
  sunMesh.position.copy(_dir).multiplyScalar(330);
  moonMesh.position.copy(_moonDir).multiplyScalar(330);

  // stars
  starMat.opacity = THREE.MathUtils.clamp(1 - dayFactor * 1.35, 0, 1) * 0.95;

  // clouds dim at night
  const nightF = 1 - dayFactor;
  cloudMat.color.setHex(0xffffff).lerp(new THREE.Color(0x39406b), nightF * 0.88);

  // lamps + windows glow
  const lampI = lerpNum(A.lampI, B.lampI, u);
  const winI = lerpNum(A.winI, B.winI, u);
  lampGlassMat.emissiveIntensity = lampI * 2.1;
  windowMat.emissiveIntensity = winI * 1.6;
}

// ---------------- interaction
let azimuth = Math.PI / 4;
let azimuthTarget = Math.PI / 4;
let dragging = false;
let lastPointerX = 0;
let pointerDownPos = null;
const dom = renderer.domElement;
dom.style.touchAction = 'none';
dom.addEventListener('pointerdown', (event) => {
  dragging = true;
  lastPointerX = event.clientX;
  pointerDownPos = { x: event.clientX, y: event.clientY, t: performance.now() };
  dom.setPointerCapture(event.pointerId);
});
dom.addEventListener('pointermove', (event) => {
  if (!dragging) return;
  const dx = event.clientX - lastPointerX;
  lastPointerX = event.clientX;
  azimuth -= dx * 0.0072;
  azimuthTarget = azimuth; // damping follows while dragging
});
function snapAzimuth(value) {
  const step = Math.PI / 2, base = Math.PI / 4;
  return base + Math.round((value - base) / step) * step;
}
dom.addEventListener('pointerup', (event) => {
  if (!dragging) return;
  dragging = false;
  try { dom.releasePointerCapture(event.pointerId); } catch (_) {}
  azimuthTarget = snapAzimuth(azimuth);
});
dom.addEventListener('pointercancel', () => { dragging = false; azimuthTarget = snapAzimuth(azimuth); });
dom.addEventListener('wheel', (event) => {
  event.preventDefault();
  viewTarget = THREE.MathUtils.clamp(viewTarget * Math.exp(event.deltaY * 0.0011), VIEW_MIN, VIEW_MAX);
}, { passive: false });

const btnLeft = document.getElementById('btn-left');
const btnRight = document.getElementById('btn-right');
const btnPause = document.getElementById('btn-pause');
function rotateStep(deltaSign) {
  const base = Math.PI / 4, step = Math.PI / 2;
  const k = Math.round((azimuthTarget - base) / step);
  azimuthTarget = base + (k + deltaSign) * step;
}
btnLeft.addEventListener('click', () => rotateStep(-1));
btnRight.addEventListener('click', () => rotateStep(1));
let paused = false;
btnPause.addEventListener('click', () => {
  paused = !paused;
  btnPause.classList.toggle('active', paused);
  btnPause.textContent = paused ? '▶' : '❚❚';
});

// -------------------- loop
let lastFrameMs = 0;
let simTime = 0;
const params = new URLSearchParams(window.location.search);
const timeParam = parseFloat(params.get('time'));
const cycleOffset = Number.isFinite(timeParam) ? THREE.MathUtils.clamp(timeParam, 0, 1) : 0.35;

let cycleDistance = 0;
function animate() {
  requestAnimationFrame(animate);
  const ms = performance.now();
  if (!lastFrameMs) lastFrameMs = ms;
  const dt = Math.min((ms - lastFrameMs) / 1000, 0.05);
  lastFrameMs = ms;
  simTime += dt;
  const t = simTime;
  if (!paused) {
    cycleDistance += dt;
    elapsedDay = (cycleOffset + cycleDistance / 60) % 1;
  }
  updateTimeOfDay(elapsedDay);
  updatePeople(t);
  updateTraffic(t, dt);
  updateClouds(dt);
  updateBirds(t, dt);
  updateCamera(dt);
  renderer.render(scene, camera);
}
let elapsedDay = cycleOffset;

function updateTraffic(t, dt) {
  busAngle += (2.35 / 8.85) * dt;
  const p = roadPoint(busRx, busRz, busAngle);
  bus.position.set(p.x, 0, p.z);
  bus.rotation.set(0, Math.atan2(p.tx, p.tz), 0);
  orbit += (3.4 / 6.6) * dt;
  const v1 = roadPoint(busRx * 0.82, busRz * 0.82, orbit);
  vespaA.position.set(v1.x, 0, v1.z);
  vespaA.rotation.set(0, Math.atan2(v1.tx, v1.tz), 0);
  const v2 = roadPoint(busRx * 1.14, busRz * 1.14, orbit * 0.82 + 2.4);
  vespaB.position.set(v2.x, 0, v2.z);
  vespaB.rotation.set(0, Math.atan2(v2.tx, v2.tz), 0);
}
function updateClouds(dt) {
  for (const c of clouds) {
    c.group.position.x += c.speed * dt;
    if (c.group.position.x > 70) c.group.position.x = -70;
  }
}
function updateBirds(t, dt) {
  for (const bird of birds) {
    const u = bird.userData;
    u.angle += u.speed * dt;
    const x = u.cx + Math.cos(u.angle) * u.radius;
    const z = u.cz + Math.sin(u.angle) * u.radius * 0.82;
    const zBob = Math.sin(t * 0.8 + u.phase) * 0.8;
    bird.position.set(x, u.height + zBob, z);
    const tx = -Math.sin(u.angle) * u.radius, tz = Math.cos(u.angle) * u.radius * 0.82;
    bird.rotation.y = Math.atan2(tx, tz);
    const flap = Math.sin(t * 8.5 + u.phase) * 0.62;
    u.left.rotation.z = flap;
    u.right.rotation.z = -flap;
  }
}
function updateCamera(dt) {
  const damp = 1 - Math.exp(-dt * 6.5);
  azimuth += (azimuthTarget - azimuth) * damp;
  viewSize += (viewTarget - viewSize) * (1 - Math.exp(-dt * 5));
  const ce = Math.cos(CAM_ELEV), se = Math.sin(CAM_ELEV);
  camera.position.set(
    TARGET.x + Math.sin(azimuth) * ce * CAM_DIST,
    TARGET.y + se * CAM_DIST,
    TARGET.z + Math.cos(azimuth) * ce * CAM_DIST
  );
  camera.lookAt(TARGET);
  const aspect = window.innerWidth / window.innerHeight;
  camera.left = -23.5 * aspect;
  camera.right = 23.5 * aspect;
  camera.top = 23.5;
  camera.bottom = -23.5;
  camera.zoom = 23.5 / viewSize;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
});

window.__diorama = { scene, camera, renderer };

updateTimeOfDay(elapsedDay);
animate();
