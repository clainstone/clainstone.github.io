<style>

    padding: 9px 16px; cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: background 0.15s, transform 0.1s;
  }
  .controls button:hover { background: rgba(60, 48, 34, 0.8); }

    position: fixed; bottom: 18px; right: 16px; z-index: 10;
    color: rgba(244, 232, 200, 0.75); font-size: 11.5px; letter-spacing: 0.08em;
    background: rgba(24, 20, 16, 0.45); border-radius: 8px; padding: 6px 10px;

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   Piazza del Colosseo — low-poly isometric diorama
   ============================================================ */

const canvas = document.getElementById('scene');

// --- starting time of day from ?time=0..1 (0 = midnight, 0.5 = noon) ---
const params = new URLSearchParams(location.search);
let startTime = parseFloat(params.get('time'));
if (!isFinite(startTime)) startTime = 0.5;
startTime = Math.min(0.999, Math.max(0, startTime));

// --- renderer ---
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;

const scene = new THREE.Scene();

// --- camera (orthographic isometric) ---
const VIEW = { frustumSize: 64, elevation: 0.47, dist: 150, baseZoom: 1.0 };
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 1500);
const camTarget = new THREE.Vector3(0, -4.5, 0);
let yaw = 0;
function updateCameraFrustum() {
  const aspect = window.innerWidth / window.innerHeight;
  const s = VIEW.frustumSize;
  camera.left = -s * aspect / 2; camera.right = s * aspect / 2;
  camera.top = s / 2; camera.bottom = -s / 2;
  camera.updateProjectionMatrix();
}
function updateCamera() {
  const ce = Math.cos(VIEW.elevation), si = Math.sin(VIEW.elevation);
  camera.position.set(
    camTarget.x + Math.sin(yaw) * ce * VIEW.dist,
    camTarget.y + si * VIEW.dist,
    camTarget.z + Math.cos(yaw) * ce * VIEW.dist
  );
  camera.lookAt(camTarget);
}
updateCameraFrustum();
updateCamera();

/* ---------------- helpers ---------------- */
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const rand = (a, b) => a + Math.random() * (b - a);

function canvasTexture(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}

// --- procedural textures ---
const pavingTex = canvasTexture(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#d7c9a6'; ctx.fillRect(0, 0, w, h);
  const n = 4, s = w / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const v = rand(-7, 7);
    ctx.fillStyle = `rgb(${215 + v | 0},${201 + v | 0},${166 + v | 0})`;
    ctx.fillRect(i * s + 2, j * s + 2, s - 4, s - 4);
  }
  ctx.strokeStyle = 'rgba(120,104,76,0.55)'; ctx.lineWidth = 2;
  for (let i = 0; i <= n; i++) {
    ctx.beginPath(); ctx.moveTo(i * s, 0); ctx.lineTo(i * s, h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * s); ctx.lineTo(w, i * s); ctx.stroke();
  }
  for (let k = 0; k < 220; k++) {
    ctx.fillStyle = `rgba(90,76,52,${rand(0.04, 0.12)})`;
    ctx.fillRect(rand(0, w), rand(0, h), 2, 2);
  }
});
pavingTex.repeat.set(9, 9);

const grassTex = canvasTexture(128, 128, (ctx, w, h) => {
  ctx.fillStyle = '#6fa050'; ctx.fillRect(0, 0, w, h);
  for (let k = 0; k < 340; k++) {
    ctx.fillStyle = Math.random() < 0.5 ? 'rgba(60,110,48,0.35)' : 'rgba(140,180,95,0.32)';
    ctx.fillRect(rand(0, w), rand(0, h), rand(1, 3), rand(1, 3));
  }
});
grassTex.repeat.set(4, 4);

const cobbleTex = canvasTexture(128, 128, (ctx, w, h) => {
  ctx.fillStyle = '#33323c'; ctx.fillRect(0, 0, w, h);
  const n = 4, s = w / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const off = (j % 2) * s * 0.5;
    const v = rand(-6, 8);
    ctx.fillStyle = `rgb(${66 + v | 0},${64 + v | 0},${76 + v | 0})`;
    ctx.beginPath();
    ctx.roundRect(i * s + off * 0 + (j % 2 ? s * 0.5 : 0) - 1, j * s + 2, s - 5, s - 5, 7);
    ctx.fill();
  }
  for (let k = 0; k < 160; k++) {
    ctx.fillStyle = `rgba(20,20,26,${rand(0.1, 0.28)})`;
    ctx.fillRect(rand(0, w), rand(0, h), 2, 2);
  }
});

const inscriptionTex = canvasTexture(1024, 160, (ctx, w, h) => {
  ctx.fillStyle = '#e4d5b0'; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = '#a5976f'; ctx.lineWidth = 6;
  ctx.strokeRect(14, 14, w - 28, h - 28);
  ctx.fillStyle = '#5d4c2f';
  ctx.font = 'bold 62px Georgia, serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('SENATVS POPVLVSQVE ROMANVS', w / 2, h / 2 + 2);
});

const souvenirTex = canvasTexture(256, 128, (ctx, w, h) => {
  ctx.fillStyle = '#f3e2c2'; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = '#a5562a'; ctx.lineWidth = 6; ctx.strokeRect(8, 8, w - 16, h - 16);
  ctx.fillStyle = '#8a4a1e'; ctx.font = 'bold 40px Georgia, serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('SOUVENIRS', w / 2, h / 2 + 2);
});

// --- shared materials ---
const M = {
  paving: new THREE.MeshStandardMaterial({ map: pavingTex, roughness: 0.95, flatShading: true }),
  grass: new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.95, flatShading: true }),
  cobbleH: new THREE.MeshStandardMaterial({ map: cobbleTex, roughness: 0.95, flatShading: true }),
  cobbleV: new THREE.MeshStandardMaterial({ map: cobbleTex, roughness: 0.95, flatShading: true }),
  soil: new THREE.MeshStandardMaterial({ color: 0x6b4d33, roughness: 1, flatShading: true }),
  rock: new THREE.MeshStandardMaterial({ color: 0x7d6e5a, roughness: 1, flatShading: true }),
  travertine: new THREE.MeshStandardMaterial({ color: 0xe3d5ae, roughness: 0.9, flatShading: true }),
  travertineDark: new THREE.MeshStandardMaterial({ color: 0xd6c69e, roughness: 0.9, flatShading: true }),
  archOpening: new THREE.MeshStandardMaterial({ color: 0x2b2018, roughness: 1 }),
  seat: new THREE.MeshStandardMaterial({ color: 0xcfae7e, roughness: 0.95, flatShading: true }),
  arenaFloor: new THREE.MeshStandardMaterial({ color: 0xd8c193, roughness: 0.95, flatShading: true }),
  darkHole: new THREE.MeshStandardMaterial({ color: 0x241a12, roughness: 1 }),
  roof: new THREE.MeshStandardMaterial({ color: 0xb25939, roughness: 0.9, flatShading: true }),
  house1: new THREE.MeshStandardMaterial({ color: 0xe8d8b6, roughness: 0.9, flatShading: true }),
  house2: new THREE.MeshStandardMaterial({ color: 0xdfc9a4, roughness: 0.9, flatShading: true }),
  house3: new THREE.MeshStandardMaterial({ color: 0xe2cda6, roughness: 0.9, flatShading: true }),
  iron: new THREE.MeshStandardMaterial({ color: 0x25292b, roughness: 0.55, metalness: 0.65, flatShading: true }),
  wood: new THREE.MeshStandardMaterial({ color: 0x8a6242, roughness: 0.9, flatShading: true }),
  canvas: new THREE.MeshStandardMaterial({ color: 0xefe3c2, roughness: 0.95, flatShading: true }),
  water: new THREE.MeshStandardMaterial({ color: 0x4f87a8, roughness: 0.25, metalness: 0.1, flatShading: true }),
  trunk: new THREE.MeshStandardMaterial({ color: 0x6f4e32, roughness: 1, flatShading: true }),
  pineCrown: new THREE.MeshStandardMaterial({ color: 0x3f6b3a, roughness: 0.95, flatShading: true }),
  cypress: new THREE.MeshStandardMaterial({ color: 0x2c4e31, roughness: 0.95, flatShading: true }),
  rubble: new THREE.MeshStandardMaterial({ color: 0x9d8d72, roughness: 1, flatShading: true }),
  gravel: new THREE.MeshStandardMaterial({ color: 0xbfb190, roughness: 1, flatShading: true }),
  busRed: new THREE.MeshStandardMaterial({ color: 0xd8442c, roughness: 0.55, flatShading: true }),
  tire: new THREE.MeshStandardMaterial({ color: 0x1e1c1e, roughness: 0.9, flatShading: true }),
  chrome: new THREE.MeshStandardMaterial({ color: 0xd8dce0, roughness: 0.3, metalness: 0.8, flatShading: true }),
  skin: new THREE.MeshStandardMaterial({ color: 0xe0b184, roughness: 0.9, flatShading: true }),
  headDark: new THREE.MeshStandardMaterial({ color: 0x3a2e22, roughness: 0.9, flatShading: true }),
};
// cobble repeats per orientation
M.cobbleH.map = cobbleTex;
M.cobbleH.map.repeat.set(10, 1.4);
M.cobbleV.map = cobbleTex;
// cloned so they can scale independently
M.cobbleV.map = cobbleTex.clone(); M.cobbleV.map.needsUpdate = true;
M.cobbleV.map.repeat.set(1.4, 10);

/* ============================================================
   Sky, lights, sun/moon/stars/clouds/birds
   ============================================================ */
// backdrop: vertical gradient canvas as scene.background (cheap + full frame)
const bgCanvas = document.createElement('canvas');
bgCanvas.width = 2; bgCanvas.height = 256;
const bgCtx = bgCanvas.getContext('2d');
const bgTex = new THREE.CanvasTexture(bgCanvas);
bgTex.colorSpace = THREE.SRGBColorSpace;
bgTex.magFilter = THREE.LinearFilter;
bgTex.minFilter = THREE.LinearFilter;
scene.background = bgTex;
function updateBackground(top, hor) {
  const grad = bgCtx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0.0, '#' + top);
  grad.addColorStop(0.52, '#' + hor);
  grad.addColorStop(1.0, '#' + new THREE.Color('#' + hor).multiplyScalar(0.62).getHexString());
  bgCtx.fillStyle = grad;
  bgCtx.fillRect(0, 0, 2, 256);
  bgTex.needsUpdate = true;
}

const sunMesh = new THREE.Mesh(
  new THREE.SphereGeometry(11, 20, 14),
  new THREE.MeshBasicMaterial({ color: 0xfff2c0, fog: false })
);
scene.add(sunMesh);
const moonMesh = new THREE.Mesh(
  new THREE.SphereGeometry(8, 18, 12),
  new THREE.MeshBasicMaterial({ color: 0xe9edf6, fog: false })
);
scene.add(moonMesh);

// stars
const starGeo = new THREE.BufferGeometry();
{
  const n = 420, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const u = Math.random(), v = Math.random();
    const theta = 2 * Math.PI * u, phi = Math.acos(1 - v * 0.85); // upper hemisphere bias
    const r = 400;
    pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = r * Math.cos(phi) + 10;
    pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
}
const starMat = new THREE.PointsMaterial({ color: 0xdde4ff, size: 2.4, sizeAttenuation: false, transparent: true, opacity: 0, depthWrite: false, fog: false });
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// lights
const sunLight = new THREE.DirectionalLight(0xfff2dd, 2.6);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -52; sunLight.shadow.camera.right = 52;
sunLight.shadow.camera.top = 52; sunLight.shadow.camera.bottom = -52;
sunLight.shadow.camera.near = 20; sunLight.shadow.camera.far = 220;
sunLight.shadow.bias = -0.0004;
sunLight.shadow.normalBias = 0.5;
scene.add(sunLight);
scene.add(sunLight.target);

const hemi = new THREE.HemisphereLight(0xbad4ee, 0xb0a488, 0.75);
scene.add(hemi);
const ambient = new THREE.AmbientLight(0xfff2e0, 0.17);
scene.add(ambient);

const lampLights = [];
for (const [lx, lz] of [[-13, 15.4], [9.5, 11.6]]) {
  const p = new THREE.PointLight(0xffb45e, 0, 22, 2);
  p.position.set(lx, 4.4, lz);
  scene.add(p); lampLights.push(p);
}

/* ============================================================
   Tile: earth slab + rock underside
   ============================================================ */
const tileGroup = new THREE.Group();
scene.add(tileGroup);

function buildTile() {
  const slabMat = [M.soil, M.soil, M.paving, M.soil, M.soil, M.soil];
  const slab = new THREE.Mesh(new THREE.BoxGeometry(64, 2.6, 64), slabMat);
  slab.position.y = -1.3;
  slab.receiveShadow = true;
  tileGroup.add(slab);

  // layered earth band (slightly inset, darker)
  const band = new THREE.Mesh(new THREE.BoxGeometry(63, 1.1, 63), M.soil);
  band.position.y = -2.9;
  tileGroup.add(band);

  // rocky underside: 4-sided tapered prism with per-row jitter
  const H = 16, rTop = 45.5, rBot = 7.5;
  const rockGeo = new THREE.CylinderGeometry(rTop, rBot, H, 4, 5);
  rockGeo.rotateY(Math.PI / 4);
  const pos = rockGeo.attributes.position;
  const rows = new Map();
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i);
    const row = Math.round((y / H + 0.5) * 5);
    if (!rows.has(row)) rows.set(row, 1 + rand(-0.18, 0.22));
    const f = rows.get(row);
    pos.setX(i, pos.getX(i) * f);
    pos.setZ(i, pos.getZ(i) * f);
  }
  rockGeo.computeVertexNormals();
  const rock = new THREE.Mesh(rockGeo, M.rock);
  rock.position.y = -3.2 - H / 2 + 0.2;
  rock.castShadow = false;
  tileGroup.add(rock);

  const tip = new THREE.Mesh(new THREE.ConeGeometry(7.5, 11, 4), M.rock);
  tip.geometry.rotateY(Math.PI / 4);
  tip.position.y = -3.2 - H - 4.4;
  tileGroup.add(tip);
}
buildTile();

/* ============================================================
   Ground surfaces: grass patches, ring road, plaza
   ============================================================ */
function flatBox(w, h, d, mat, x, y, z, ry = 0, receive = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.rotation.y = ry;
  m.receiveShadow = receive;
  tileGroup.add(m);
  return m;
}

// grass patches (kept clear of landmarks)
flatBox(23.4, 0.18, 5.6, M.grass, 9.7, 0.09, -18.3);   // north strip
flatBox(4.6, 0.18, 17.5, M.grass, 19.0, 0.09, -3.2);   // east strip (z -11.9..5.5)

// ring road (dark cobbles): 4 strips + 4 corners
const ROAD_IN = 21.5, ROAD_OUT = 27.0, ROAD_MID = (ROAD_IN + ROAD_OUT) / 2, ROAD_W = ROAD_OUT - ROAD_IN;
flatBox(54.5, 0.16, ROAD_W, M.cobbleH, 0, 0.08, -ROAD_MID);   // N
flatBox(54.5, 0.16, ROAD_W, M.cobbleH, 0, 0.08, ROAD_MID);                          // S
flatBox(ROAD_W, 0.16, 43.0, M.cobbleV, -ROAD_MID, 0.08, 0);          // W
flatBox(ROAD_W, 0.16, 43.0, M.cobbleV, ROAD_MID, 0.08, 0);                           // E
for (const [sx, sz] of [[-1, -1], [-1, 1], [1, -1], [1, 1]]) {
  flatBox(ROAD_W, 0.16, ROAD_W, M.cobbleH, sx * ROAD_MID, 0.08, sz * ROAD_MID);
}

// plaza apron (light paving, slightly proud)
flatBox(41, 0.12, 41, M.paving, 0, 0.02, 0, 0).material = M.paving;

/* ============================================================
   COLOSSEUM
   ============================================================ */
const COLOSSEO_C = new THREE.Vector3(-10.5, 0, -5.5);
const COLOSSEO = { rx: 10.5, rz: 8.0, gapHalf: 45 * Math.PI / 180 };
const colossium = new THREE.Group();
colossium.position.copy(COLOSSEO_C);
colossium.rotation.y = -Math.PI / 2; // local +x (gap center) -> world +z
tileGroup.add(colossium);

// extruded elliptical ring sector: shape in (cos, -sin) space (world
// z = -y after rotation), extruded along +z (becomes y after rotateX)
function ellipseRingSector(rOut, rIn, h, a0, a1, mat, yBase, seg = 64) {
  const s = new THREE.Shape();
  s.absarc(0, 0, rOut, a0, a1, false);
  s.absarc(0, 0, rIn, a1, a0, true);
  s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: false, curveSegments: Math.max(24, Math.ceil(Math.abs(a1 - a0) / (Math.PI / 4)) * 8) });
  geo.rotateX(-Math.PI / 2); // shape (x, y) -> world (x, z = -y); extrusion depth -> +y
  const mesh = new THREE.Mesh(geo, mat);
  mesh.scale.set(1, 1, 1);
  mesh.position.y = yBase;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
function scaledRing(rOut, rIn, h, a0, a1, mat, yBase) {
  const m = ellipseRingSector(rOut, rIn, h, a0, a1, mat, yBase);
  m.scale.set(COLOSSEO.rx, 1, COLOSSEO.rz);
  return m;
}

// NOTE: shape angle phi maps to local world angle theta = -phi (z = -y).
// Gap centered at local angle 0 => shape gap phi in [-45deg, +45deg]
const gapA = COLOSSEO.gapHalf;                       // half-angle of the gap (local shape space)
const gapC = 0;                                       // gap centered at local angle 0 (faces the camera via the group rotation)
const wallStart = gapA, wallEnd = 2 * Math.PI - gapA;
// shape phi = -local world theta
const shapeArc0 = -(2 * Math.PI - gapA);             // shape start
const shapeArc1 = -gapA;                             // shape end

const WALL_TIERS = [
  { base: 2.6, h: 2.9, rIn: 0.88, rOut: 1.0, archW: 1.15, archH: 1.85, archBaseY: 2.85, columns: true },
  { base: 5.5, h: 2.5, rIn: 0.88, rOut: 1.0, archW: 1.05, archH: 1.65, archBaseY: 5.75, columns: true },
  { base: 8.0, h: 2.3, rIn: 0.88, rOut: 1.0, archW: 0.95, archH: 1.5, archBaseY: 8.25, columns: true },
];
for (const t of WALL_TIERS) {
  const ring = scaledRing(t.rOut, t.rIn, t.h, shapeArc0, shapeArc1, M.travertine, t.base);
  colossium.add(ring);
}
// tier moldings (thin ledges at tier boundaries)
for (const yb of [2.6, 5.5, 8.0]) {
  colossium.add(scaledRing(1.005, 0.885, 0.22, shapeArc0, shapeArc1, M.travertineDark, yb - 0.06));
}
// fourth storey: solid ring with small rectangular windows
// NOTE: wall spans shape phi in [-spanBack, ...]; gap shape [-gapA, +gapA]
const fourthBase = 10.3, fourthH = 1.6;
colossium.add(scaledRing(1.0, 0.88, fourthH, shapeArc0, shapeArc1, M.travertine, fourthBase));
colossium.add(scaledRing(1.02, 0.88, 0.26, shapeArc0, shapeArc1, M.travertineDark, fourthBase + fourthH));
// full-height base ring (solid, under the wall, outer ring)
colossium.add(scaledRing(1.0, 0.88, 2.6, 0, Math.PI * 2, M.travertineDark, 0));

// inner ring (arena wall) — full circle
function fullRing(rOut, rIn, h, mat, yBase) {
  const s = new THREE.Shape();
  s.absarc(0, 0, rOut, 0, Math.PI * 2, false);
  const hole = new THREE.Path();
  hole.absarc(0, 0, rIn, 0, Math.PI * 2, true);
  s.holes.push(hole);
  const geo = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: false, curveSegments: 72 });
  geo.rotateX(-Math.PI / 2);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.scale.set(COLOSSEO.rx, 1, COLOSSEO.rz);
  mesh.position.y = yBase;
  mesh.castShadow = true;

function archedBlock(w, h, r, springY, depth) {
  const s = new THREE.Shape();
  s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(w / 2, h); s.lineTo(-w / 2, h); s.closePath();
  const hole = new THREE.Path();
  hole.moveTo(-r, 0);
  hole.lineTo(-r, springY);
  hole.absarc(0, springY, r, Math.PI, 0, true);
  hole.lineTo(r, 0);
  hole.closePath();
  s.holes.push(hole);
  const geo = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: false, curveSegments: 22 });
  geo.translate(0, 0, -depth / 2);
  const m = new THREE.Mesh(geo, M.travertine);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

function house(x, z, w, d, h, mat, rotY = 0) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  body.position.y = h / 2;
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  const roofH = h * 0.42;
  const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.hypot(w, d) / 2 * 1.12, roofH, 4), M.roof);
  roof.rotation.y = Math.PI / 4;
  roof.position.y = h + roofH / 2;
  roof.castShadow = true;
  g.add(roof);
  const chim = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.7, 0.4), M.roof);
  chim.position.set(w * 0.28, h + roofH * 0.35, d * 0.18);
  g.add(chim);
  g.position.set(x, 0, z);
  g.rotation.y = rotY;
  tileGroup.add(g);
  // windows on the +z face
  const nx = Math.max(2, Math.round(w / 1.7));
  const ny = Math.max(1, Math.round(h / 1.7));
  for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) {
    const lx = -w / 2 + (i + 0.5) * (w / nx);
    const ly = 0.85 + j * (h / ny);
    const world = new THREE.Vector3(lx, ly, d / 2 + 0.06).applyAxisAngle(new THREE.Vector3(0, 1, 0), rotY).add(new THREE.Vector3(x, 0, z));
    windowSpots.push({ x: world.x, y: ly, z: world.z, rotY, colossiumSpace: false });
  }
  // door
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.85, 1.3, 0.1), M.wood);
  const doorWorld = new THREE.Vector3(0, 0.65, d / 2 + 0.06).applyAxisAngle(new THREE.Vector3(0, 1, 0), rotY).add(new THREE.Vector3(x, 0, z));
  door.position.copy(doorWorld);
  door.rotation.y = rotY;
  tileGroup.add(door);
  return g;
}

function roundedRectPoints(hx, hz, cr, segsPerCorner = 7, segsPerEdge = 8, cx = 0, cz = 0) {
  const pts = [];
  const straights = [
    { x: -(hx - cr), z: -hz, dx: 1, dz: 0, len: 2 * (hx - cr) },   // top edge (z = -hz)
    { x: hx, z: -(hz - cr), dx: 0, dz: 1, len: 2 * (hz - cr) },    // right edge
    { x: hx - cr, z: hz, dx: -1, dz: 0, len: 2 * (hx - cr) },      // bottom edge
    { x: -hx, z: (hz - cr), dx: 0, dz: -1, len: 2 * (hz - cr) },   // left edge
  ];
  const corners = [
    { x: hx - cr, z: -(hz - cr), a0: -Math.PI / 2 },
    { x: hx - cr, z: hz - cr, a0: 0 },
    { x: -(hx - cr), z: hz - cr, a0: Math.PI / 2 },
    { x: -(hx - cr), z: -(hz - cr), a0: Math.PI },
  ];
  for (let e = 0; e < 4; e++) {
    const s = straights[e];
    for (let i = 0; i < segsPerEdge; i++) {
      const t = i / segsPerEdge;
      pts.push(new THREE.Vector3(cx + s.x + s.dx * s.len * t, 0, cz + s.z + s.dz * s.len * t));
    }
    const c = corners[e];
    for (let i = 0; i < segsPerCorner; i++) {
      const t = i / segsPerCorner;
      const a = c.a0 + t * (Math.PI / 2);
      pts.push(new THREE.Vector3(cx + c.x + Math.cos(a) * cr, 0, cz + c.z + Math.sin(a) * cr));
    }
  }
  return pts;
}

const STOPS = [
  { t: 0.00, top: 0x0c1332, hor: 0x1a2242, hemiSky: 0x2c3756, hemiGnd: 0x1c1624, hemi: 0.46, g: 1.0 },

  { t: 0.50, top: 0x3f7fd4, hor: 0xd8ecf2, hemiSky: 0xbad4ee, hemiGnd: 0xb0a488, hemi: 0.88, g: 0.0 },
  { t: 0.66, top: 0x3a6fb4, hor: 0xdcd2b8, hemiSky: 0xa8c0dc, hemiGnd: 0x9a8c6e, hemi: 0.78, g: 0.0 },
  { t: 0.75, top: 0x37396e, hor: 0xff9060, hemiSky: 0x7a6a84, hemiGnd: 0x44332c, hemi: 0.62, g: 0.38 },
  { t: 0.80, top: 0x1e2749, hor: 0x583e60, hemiSky: 0x40486e, hemiGnd: 0x262030, hemi: 0.48, g: 0.82 },
  { t: 0.90, top: 0x101638, hor: 0x1e2546, hemiSky: 0x2c3756, hemiGnd: 0x1c1624, hemi: 0.46, g: 0.96 },
  { t: 1.00, top: 0x0c1332, hor: 0x1a2242, hemiSky: 0x2c3756, hemiGnd: 0x1c1624, hemi: 0.46, g: 1.0 },
];
const _c1 = new THREE.Color(), _c2 = new THREE.Color();
function sampleStops(t, key) {
  for (let i = 0; i < STOPS.length - 1; i++) {
    const a = STOPS[i], b = STOPS[i + 1];
    if (t >= a.t && t <= b.t) {
      const k = (t - a.t) / (b.t - a.t);
      if (key === 'g' || key === 'hemi') return a[key] + (b[key] - a[key]) * k;
      _c1.setHex(a[key]); _c2.setHex(b[key]);
      return _c1.lerp(_c2, k).clone();
    }
  }
  return new THREE.Color(0x000000);
}

let lastFrameT = performance.now();

function updateDayNight(t, dt) {
  const theta = 2 * Math.PI * (t - 0.25);
  const elev = Math.sin(theta);
  const sunDir = new THREE.Vector3(Math.cos(theta), Math.sin(theta), -0.42).normalize();

  // sky + lights
  updateBackground(sampleStops(t, 'top').getHexString(), sampleStops(t, 'hor').getHexString());
  const hemiSky = sampleStops(t, 'hemiSky'), hemiGnd = sampleStops(t, 'hemiGnd');
  hemi.color.copy(hemiSky); hemi.groundColor.copy(hemiGnd);
  hemi.intensity = sampleStops(t, 'hemi');
  const g = sampleStops(t, 'g');

  const maxElev = Math.max(0, elev);
  const sunI = 2.75 * (0.28 + 0.72 * maxElev);
  const moonI = 0.72;
  const moonDir = new THREE.Vector3(0.42, 0.82, -0.38).normalize();
  const dusk = Math.max(0, 1 - Math.abs(elev) * 3.2); // 1 near horizon

  if (elev > -0.02) {
    sunLight.position.copy(sunDir).multiplyScalar(95).add(new THREE.Vector3(0, 0, 0));
    sunLight.color.setHex(0xfff2dd).lerp(new THREE.Color(0xff8a3c), dusk);
    sunLight.intensity = sunI;
  } else {
    sunLight.position.copy(moonDir).multiplyScalar(95);
    sunLight.color.setHex(0xaebfdd);
    sunLight.intensity = moonI;
  }
  sunLight.target.position.set(0, 0, 0);

  // sun / moon meshes
  const sunVisible = elev > -0.035;
  sunMesh.visible = sunVisible;
  if (sunVisible) {
    sunMesh.position.copy(sunDir).multiplyScalar(400);
    sunMesh.scale.setScalar(1 + dusk * 0.5);
    sunMesh.material.color.setHex(0xfff2c0).lerp(new THREE.Color(0xff8a3c), dusk * 0.85);
  }
  moonMesh.visible = !sunVisible;
  if (!sunVisible) moonMesh.position.copy(moonDir).multiplyScalar(395);

  // stars
  starMat.opacity = Math.max(0, 1 - Math.abs(elev) * 2.6);

  // night glow
  lampGlowMat.emissiveIntensity = g * 2.6;
  windowsMat.emissiveIntensity = g * 2.4;
  for (const p of lampLights) p.intensity = g * 58;

  // clouds tinted
  cloudMat.color.setHex(0xffffff).lerp(new THREE.Color(0x39415e), g * 0.85);

  // animate people / vehicles / clouds / birds
  people.forEach((p, i) => {
    p.u = (p.u + dt * p.speed / p.len) % 1;
    const pos = p.curve.getPointAt(p.u);
    const tan = p.curve.getTangentAt(p.u);
    const bob = Math.abs(Math.sin((p.u * 20 + p.bobPhase))) * 0.09;
    _dummy.position.set(pos.x, bob, pos.z);
    _dummy.rotation.set(0, Math.atan2(tan.x, tan.z), 0);
    _dummy.scale.setScalar(1.02);
    _dummy.updateMatrix();
    bodyInst.setMatrixAt(i, _dummy.matrix);
    _dummy.position.y = bob + 0.82;
    _dummy.updateMatrix();
    headInst.setMatrixAt(i, _dummy.matrix);
  });
  bodyInst.instanceMatrix.needsUpdate = true;
  headInst.instanceMatrix.needsUpdate = true;

  for (const v of vehicles) {
    v.u = (v.u + dt * v.speed / v.len) % 1;
    const pos = v.curve.getPointAt(v.u);
    const tan = v.curve.getTangentAt(v.u);
    v.group.position.set(pos.x, 0.18, pos.z);
    v.group.rotation.y = Math.atan2(tan.x, tan.z);
  }

  for (const c of clouds) {
    c.position.x += dt * c.userData.speed;
    if (c.position.x > 110) { c.position.x = -110; c.position.z = rand(-55, 55); }
  }
  const tNow = performance.now() * 0.001;
  for (const b of birds) {
    const u = b.userData;
    const a = u.phase + tNow * u.speed;
    b.position.set(Math.cos(a) * u.r, u.y + Math.sin(tNow * 0.7 + u.phase) * 1.6, Math.sin(a) * u.r);
    b.rotation.y = Math.atan2(-Math.sin(a), Math.cos(a));
    const flap = Math.sin(tNow * 9 + u.phase) * 0.55;
    u.wl.rotation.z = flap;
    u.wr.rotation.z = -flap;
  }
}

let snapAnim = null;
let targetYaw = 0;
let dragging = false, dragStartX = 0, dragStartYaw = 0;

function cancelSnap() { snapAnim = null; }
function snapToNearest(y) {
  const q = Math.round(y / (Math.PI / 2)) * (Math.PI / 2);
  snapAnim = { from: y, to: q, t0: performance.now(), dur: 420 };
  targetYaw = q;
}

canvas.addEventListener('pointerdown', e => {
  dragging = true;
  canvas.setPointerCapture(e.pointerId);
  canvas.classList.add('dragging');
  dragStartX = e.clientX; dragStartYaw = yaw;
  cancelSnap();
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  yaw = dragStartYaw - (e.clientX - dragStartX) * 0.0062;
});
function endDrag(e) {
  if (!dragging) return;
  dragging = false;
  canvas.classList.remove('dragging');
  snapToNearest(yaw);
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

/* ============================================================
   Main loop
   ============================================================ */
function animate() {
  const nowT = performance.now();
  const dt = Math.min((nowT - lastFrameT) / 1000, 0.05);
  lastFrameT = nowT;
  if (!paused) cycleT = (cycleT + dt / 60) % 1;

  // snap tween
  if (snapAnim && !dragging) {
    const k = (performance.now() - snapAnim.t0) / snapAnim.dur;
    if (k >= 1) { yaw = snapAnim.to; snapAnim = null; }
    else {
      const e = 1 - Math.pow(1 - k, 3);
      yaw = snapAnim.from + (snapAnim.to - snapAnim.from) * e;
    }
  }

  updateDayNight(cycleT, dt);
  updateCamera();
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);

/* set up window.__diorama */
window.__diorama = { scene, camera, renderer };
</script>
