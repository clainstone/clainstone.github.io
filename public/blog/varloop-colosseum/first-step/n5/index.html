{

  for (let i = 0; i < segs; i++) {
    const t = thetaStart + (i + 0.5) * (thetaEnd - thetaStart) / segs;
    const p = ellipsePoint(aM, bM, t);
    const n = ellipseNormal(aM, bM, t);
    const seg = new THREE.Mesh(geoBox, mat);
    seg.scale.set(spacing * widthScale, height, thick);
    seg.position.set(p.x, y0 + height / 2, p.z);
    seg.rotation.y = Math.atan2(n.x, n.z);
    seg.castShadow = true; seg.receiveShadow = true;
    group.add(seg);
  }

/* rounded-rectangle street loop for the bus and two moving vespas */
function makeRoundedLoop(cx, cz, hx, hz, r, seg) {
  const pts = [];
  const line = (x0, z0, x1, z1, n) => { for (let i = 0; i < n; i++) pts.push(new THREE.Vector2(x0 + (x1 - x0) * (i / n), z0 + (z1 - z0) * (i / n))); };
  const arcPts = (ax, az, rr, a0, a1, n) => { for (let i = 0; i < n; i++) { const a = a0 + (a1 - a0) * (i / n); pts.push(new THREE.Vector2(ax + rr * Math.cos(a), az + rr * Math.sin(a))); } };
  line(-(hx - r), -hz, hx - r, -hz, 12);
  arcPts(hx - r, -hz + r, r, -Math.PI / 2, 0, seg);
  line(hx, -(hz - r), hx, hz - r, 3);
  arcPts(hx - r, hz - r, r, 0, Math.PI / 2, seg);
  line(hx - r, hz, -(hx - r), hz, 12);
  arcPts(-(hx - r), hz - r, r, Math.PI / 2, Math.PI, seg);
  line(-hx, hz - r, -hx, -(hz - r), 3);
  arcPts(-(hx - r), -hz + r, r, Math.PI, Math.PI * 1.5, seg);
  const v3 = pts.map(p => new THREE.Vector3(cx + p.x, 0, cz + p.y));
  return new THREE.CatmullRomCurve3(v3, true, 'catmullrom', 0.04);
}

const loopBCum = (() => { const c = [0]; for (let i = 1; i <= loopB.length; i++) { c.push(c[i - 1] + loopB[(i - 1) % loopB.length].distanceTo(loopB[i % loopB.length])); } return c; })();

function loopBSample(s) {
  s = ((s % loopBLen) + loopBLen) % loopBLen;
  let i = 0;
  while (i < loopB.length - 1 && loopBCum[i + 1] < s) i++;
  if (loopBCum[i + 1] === loopBCum[i]) return loopB[0].clone();
  const segLen = loopBCum[i + 1] - loopBCum[i];
  const t = (s - loopBCum[i]) / segLen;
  const a2 = loopB[i], b2 = loopB[(i + 1) % loopB.length];
  return a2.clone().lerp(b2, t);
}

  const starCount = 900;
  const positions = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    // random point on upper hemisphere shell radius 140-190
    const theta = rand() * Math.PI * 2;
    const phi = rand() * Math.PI * 0.42 + 0.06; // bias toward zenith
    const r = 165;
    positions[i * 3] = Math.sin(phi) * Math.cos(theta) * r;
    positions[i * 3 + 1] = Math.cos(phi) * r;
    positions[i * 3 + 2] = Math.sin(phi) * Math.sin(theta) * r;
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const stars = new THREE.Points(starGeo, skyStarMat);
  stars.frustumCulled = false;
  root.add(stars);
  var starsObj = stars;
}

/* moon (visible at night) */
const moonMat = new THREE.MeshStandardMaterial({ color: 0xe9edf5, emissive: 0xbfc8dc, emissiveIntensity: 0.9, roughness: 0.9, flatShading: true });
const moon = new THREE.Mesh(new THREE.SphereGeometry(4.6, 14, 12), moonMat);
moon.visible = false;
root.add(moon);

/* birds — two-wing flapping */
const birdGroups = [];
const birdMat = new THREE.MeshStandardMaterial({ color: 0x2a2622, roughness: 0.9, side: THREE.DoubleSide });
function makeBird() {
  const g = new THREE.Group();
  const wingGeo = new THREE.BoxGeometry(0.62, 0.035, 0.2);
  wingGeo.translate(0.31, 0, 0); // pivot at body
  const wingL = new THREE.Mesh(wingGeo, birdMat);
  const wingR = new THREE.Mesh(wingGeo, birdMat); wingR.scale.x = -1;
  g.add(wingL, wingR);
  const bodyA = new THREE.Mesh(geoCapsule, birdMat); bodyA.scale.set(0.16, 0.34, 0.16); g.add(bodyA);
  g.userData = { wingL, wingR, flap: rand() * 6.28, speed: randRange(2.4, 3.4), radius: randRange(6.5, 9.5), height: randRange(9.5, 13.5), center: new THREE.Vector3(randRange(-6, 6), 0, randRange(-4, 4)), dir: rand() < 0.5 ? 1 : -1, phase: rand() * 6.28 };
  return g;
}
for (let i = 0; i < 4; i++) { const b = makeBird(); root.add(b); birdGroups.push(b); }

/* ===============================================================================
   RAF LOOP / DAY-NIGHT / CONTROL WIRING
   ============================================================================= */
const clamp = THREE.MathUtils.clamp;
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const lerp = THREE.MathUtils.lerp;
const dampAngle = (from, to, lambda, dt) => {
  let d = (to - from) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2;
  return from + d * (1 - Math.exp(-lambda * dt));
};

const skyNoon = new THREE.Color(0x8ec3e8), skyDusk = new THREE.Color(0xf2a268), skyNight = new THREE.Color(0x0a0f28);
const sunNoon = new THREE.Color(0xfff3e0), sunDusk = new THREE.Color(0xffab63), moonColor = new THREE.Color(0x93a5d8);
const cloudDay = new THREE.Color(0xffffff), cloudDusk = new THREE.Color(0xf3c4a1), cloudNight = new THREE.Color(0x3d4560);
const tmpColor = new THREE.Color(), tmpColor2 = new THREE.Color();
const hemiSkyNoon = new THREE.Color(0xbfe3ee), hemiSkyNight = new THREE.Color(0x2a3454), hemiSkyDusk = new THREE.Color(0xe8a878);
const hemiGroundNoon = new THREE.Color(0x6b5540), hemiGroundNight = new THREE.Color(0x14141f);

const clockEl = document.querySelector('.clock .time');
const periodEl = document.querySelector('.clock .period');
const iconEl = document.querySelector('.clock .icon');
const markerEl = document.querySelector('.clockbar .marker');
const btnPause = document.getElementById('btnPause');
const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');
const counterMat = null; // counter uses own material captured below if needed

const lampFlicker = lampPointLights.map((p, i) => i * 1.7);

function updateSkyAndLights(dt, elapsed) {
  const raw = Math.sin(Math.PI * (timeOfDay - 0.25) / 0.5); // <0 midnight, 0 at horizon, 1 at noon
  const dayness = smoothstep(-0.16, 0.4, raw);
  const duskness = clamp(1 - Math.abs(raw) * 3.4, 0, 1);
  const nightness = clamp(1 - smoothstep(-0.4, 0.06, raw), 0, 1); // 1 at night
  const lightLevel = clamp(1 - raw * 2.15, 0, 1); // lamps on at/after horizon

  // sky
  skyColor.copy(skyNight).lerp(skyNoon, dayness);
  skyColor.lerp(skyDusk, duskness * 0.8 * (1 - nightness * 0.35));
  // sun / moon direction
  const isSun = raw > -0.075;
  const effTime = isSun ? timeOfDay : (timeOfDay + 0.5) % 1;
  const effRaw = isSun ? Math.max(raw, 0.001) : -raw;
  const elevAngle = effRaw * THREE.MathUtils.degToRad(62);
  const phi = ((effTime - 0.25) * Math.PI + Math.PI * 2) % (Math.PI * 2); // 0 at rise, π at set
  const cosEl = Math.cos(elevAngle);
  const dir = new THREE.Vector3(Math.cos(phi) * cosEl, Math.sin(elevAngle), Math.sin(phi) * cosEl).normalize();
  sun.position.copy(dir).multiplyScalar(80);
  sun.position.y = Math.max(sun.position.y, 2.2);
  sun.target.position.set(0, 0, 0);
  if (isSun) {
    sun.color.copy(sunDusk).lerp(sunNoon, clamp(raw * 1.6 + 0.25, 0, 1));
    sun.intensity = 0.42 + duskness * 0.85 + dayness * 1.18;
  } else {
    sun.color.copy(moonColor);
    sun.intensity = 0.42;
  }
  // hemisphere & ambient
  hemi.intensity = 0.24 + dayness * 0.66;
  hemi.color.copy(hemiSkyNight).lerp(hemiSkyNoon, dayness);
  hemi.color.lerp(hemiSkyDusk, duskness * 0.55);
  hemi.groundColor.copy(hemiGroundNight).lerp(hemiGroundNoon, dayness);
  ambient.intensity = 0.07 + dayness * 0.1;
  // clouds
  tmpColor.copy(cloudNight).lerp(cloudDay, dayness);
  tmpColor.lerp(cloudDusk, duskness * 0.85 * (1 - nightness * 0.4));
  cloudMat.color.copy(tmpColor);
  cloudMat.emissive.copy(tmpColor);
  cloudMat.emissiveIntensity = 0.38;
  // stars & moon
  skyStarMat.opacity = nightness * 0.95;
  if (typeof starsObj !== 'undefined' && starsObj.visible !== nightness > 0.3) starsObj.visible = nightness > 0.3;
  const moonDir = isSun ? new THREE.Vector3(-dir.x, -dir.y, -dir.z) : dir;
  if (isSun || -raw < 0.15) {
    // moon visible when it is above horizon: during night half of cycle
    const t2 = (timeOfDay + 0.5) % 1;
    const raw2 = Math.sin(Math.PI * (t2 - 0.25) / 0.5);
    if (raw2 > 0.12) {
      const phi2 = ((t2 - 0.25) * Math.PI + Math.PI * 2) % (Math.PI * 2);
      const el2 = raw2 * THREE.MathUtils.degToRad(54);
      const cdir = new THREE.Vector3(Math.cos(phi2) * Math.cos(el2), Math.sin(el2), Math.sin(phi2) * Math.cos(el2)).normalize();
      moon.position.copy(cdir).multiplyScalar(150);
      moon.visible = true;
    } else moon.visible = false;
  } else moon.visible = false;
  // lamps & windows & decor glow
  glowMat.opacity = lightLevel * 0.95;
  poolMat.opacity = lightLevel * 0.5;
  lampHeadMat.emissiveIntensity = 0.12 + lightLevel * 3.4;
  winLitMat.emissiveIntensity = lightLevel * 2.5;
  winDarkMat.color.setHex(0x232a35).lerp(new THREE.Color(0x10151f), nightness * 0.75);
  M.water.emissiveIntensity = 0.3 + lightLevel * 0.7;
  lampPointLights.forEach((p, i) => {
    const flicker = 0.9 + 0.1 * Math.sin(elapsed * 11 + lampFlicker[i]) * Math.sin(elapsed * 5.3 + lampFlicker[i] * 2);
    p.light.intensity = lightLevel * p.intensity * flicker;
  });
  return { raw, dayness, duskness, nightness, lightLevel };
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.elapsedTime;
  if (!state.paused) timeOfDay = (timeOfDay + dt / CYCLE_SECONDS) % 1;

  const { raw, dayness, nightness, lightLevel } = updateSkyAndLights(dt, elapsed);

  // stars slow spin
  if (typeof starsObj !== 'undefined') starsObj.rotation.y = elapsed * 0.004;

  // clouds drift eastward, wrap
  for (const cl of cloudGroups) {
    cl.position.x += cl.userData.speed * dt;
    if (cl.position.x > 32) cl.position.x = -32;
  }

  // birds
  for (const b of birdGroups) {
    const u = b.userData;
    const ang = u.phase + (elapsed * u.speed / u.radius) * u.dir;
    const x = u.center.x + Math.cos(ang) * u.radius;
    const z = u.center.z + Math.sin(ang) * u.radius;
    const y = u.height + Math.sin(elapsed * 1.35 + u.phase) * 0.7;
    const dx = -Math.sin(ang) * u.dir, dz = Math.cos(ang) * u.dir;
    b.position.set(x, y, z);
    b.rotation.y = Math.atan2(dx, dz);
    const flap = Math.sin(elapsed * 9 + u.flap) * 0.85;
    u.wingL.rotation.z = 0.18 + flap;
    u.wingR.rotation.z = -0.18 - flap;
  }

  // water jet wobble
  if (fountain.userData.jet) {
    const jet = fountain.userData.jet;
    const targetY = 0.42 * (1 + 0.22 * Math.sin(elapsed * 8.4));
    jet.scale.y = targetY;
    jet.position.y = 1.07 + targetY / 2;
  }

  // bus & vespos on street loop
  const busU = (elapsed * (1.9 / streetLength)) % 1;
  for (const veh of [{ m: bus, off: 0 }, { m: vespaA, off: 0.24 }, { m: vespaB, off: 0.62 }]) {
    const u = (busU + veh.off) % 1;
    const pos = streetLoop.getPointAt(u);
    const tangent = streetLoop.getTangentAt(u);
    veh.m.position.set(pos.x, 0.075 + Math.sin(elapsed * 9 + veh.off * 20) * 0.006, pos.z);
    veh.m.rotation.y = Math.atan2(-tangent.z, tangent.x);
    const wheels = veh.m.userData.wheels;
    const spin = (1.9 / (veh.m === bus ? 0.36 : 0.17)) * dt;
    for (const w of wheels) w.rotation.z -= spin;
  }

  // walkers
  for (const w of walkers) {
    let pos, tangent;
    if (w.kind === 'loopB') {
      w.s += w.dir * w.speed * dt;
      pos = loopBSample(w.s);
      const ahead = loopBSample(w.s + 0.22 * w.dir);
      tangent = ahead.clone().sub(pos); tangent.y = 0; tangent.normalize();
    } else {
      const fn = sampleFns[w.kind];
      const rApprox = w.kind === 'plaza' ? 3.1 : (w.kind === 'forum' ? 1.75 : 2.95);
      w.theta += w.dir * (w.speed / rApprox) * dt;
      const pNow = fn(w.theta);
      const pNext = fn(w.theta + 0.05 * w.dir);
      pos = pNow;
      tangent = pNext.clone().sub(pNow); tangent.y = 0; tangent.normalize();
    }
    const targetYaw = Math.atan2(tangent.x, tangent.z);
    w.g.rotation.y = dampAngle(w.g.rotation.y, targetYaw, 7.5, dt);
    w.phase += dt * w.speed * 7.4;
    const s2 = Math.sin(w.phase);
    w.legL.rotation.x = s2 * 0.68; w.legR.rotation.x = -s2 * 0.68;
    w.armL.rotation.x = -s2 * 0.55; w.armR.rotation.x = s2 * 0.55;
    w.g.position.set(pos.x, 0.02 + Math.abs(Math.cos(w.phase)) * w.bobAmp, pos.z);
  }
  for (const w of standing) {
    w.bobPhase += dt * 1.8;
    w.g.rotation.z = Math.sin(w.bobPhase) * 0.035;
    w.armL.rotation.x = -0.55 + Math.sin(w.bobPhase * 0.8) * 0.1;
    w.armR.rotation.x = 0.45 + Math.cos(w.bobPhase * 0.7) * 0.12;
  }

  // camera: smooth rotate snap & zoom
  state.azimuth = dampAngle(state.azimuth, state.targetAzimuth, 6.5, dt);
  state.zoom = lerp(state.zoom, state.targetZoom, 1 - Math.exp(-7 * dt));
  const cosElev = Math.cos(CAM_ELEV);
  camera.position.set(
    camTarget.x + Math.cos(state.azimuth) * cosElev * CAM_DIST,
    camTarget.y + Math.sin(CAM_ELEV) * CAM_DIST,
    camTarget.z + Math.sin(state.azimuth) * cosElev * CAM_DIST
  );
  camera.lookAt(camTarget);
  camera.zoom = state.zoom;
  camera.updateProjectionMatrix();

  // UI clock
  const totalMinutes = Math.floor((timeOfDay * 24) * 60 + 1e-6) % (24 * 60);
  const hh = String(Math.floor(totalMinutes / 60)).padStart(2, '0');
  const mm = String(totalMinutes % 60).padStart(2, '0');
  const clockText = hh + ':' + mm;
  if (clockEl.textContent !== clockText) {
    clockEl.textContent = clockText;
    const hour = totalMinutes / 60;
    let period = 'Night';
    if (hour >= 5 && hour < 7) period = 'Dawn';
    else if (hour >= 7 && hour < 11) period = 'Morning';
    else if (hour >= 11 && hour < 14) period = 'Midday';
    else if (hour >= 14 && hour < 17) period = 'Afternoon';
    else if (hour >= 17 && hour < 20) period = 'Dusk';
    periodEl.textContent = period;
    iconEl.textContent = (period === 'Dawn' || period === 'Dusk') ? '◐' : (period === 'Night' ? '☾' : '☀');
    markerEl.style.left = (timeOfDay * 100).toFixed(2) + '%';
  }

  renderer.render(scene, camera);
}

const clock = new THREE.Clock();

/* ---------------- controls ---------------- */
const nearestHalf = a => Math.round((a - Math.PI / 4) / (Math.PI / 2)) * (Math.PI / 2) + Math.PI / 4;
const canvas = renderer.domElement;
let dragState = null;
canvas.addEventListener('pointerdown', e => {
  dragState = { x: e.clientX, az: state.azimuth };
  state.dragging = true;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('pointermove', e => {
  if (!dragState) return;
  const dx = e.clientX - dragState.x;
  state.azimuth = dragState.az + dx * 0.0064;
  state.targetAzimuth = state.azimuth;
});
const endDrag = e => {
  if (!dragState) return;
  state.targetAzimuth = nearestHalf(state.azimuth);
  dragState = null;
  state.dragging = false;
};
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  state.targetZoom = clamp(state.targetZoom * Math.exp(-e.deltaY * 0.0011), 0.72, 2.7);
}, { passive: false });
btnLeft.addEventListener('click', () => { state.targetAzimuth = nearestHalf(state.targetAzimuth) + Math.PI / 2; });
btnRight.addEventListener('click', () => { state.targetAzimuth = nearestHalf(state.targetAzimuth) - Math.PI / 2; });
btnPause.addEventListener('click', () => {
  state.paused = !state.paused;
  btnPause.textContent = state.paused ? '▶' : '❚❚';
  btnPause.setAttribute('aria-label', state.paused ? 'Resume the day-night cycle' : 'Pause the day-night cycle');
  btnPause.title = state.paused ? 'Resume day-night cycle' : 'Pause day-night cycle';
});

/* ---------------- resize ---------------- */
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  updateCameraFrustum();
});

/* ---------------- completion hooks ---------------- */
window.__diorama = { scene, camera, renderer };
animate();
</script>
