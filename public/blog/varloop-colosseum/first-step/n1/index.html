<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Piazza del Colosseo — Roma</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #070a14;
    font-family: Georgia, 'Times New Roman', serif; }
  canvas { display: block; }
  #titleCard {
    position: fixed; top: 22px; left: 24px; z-index: 10;
    padding: 14px 20px 13px; min-width: 190px;
    background: linear-gradient(160deg, rgba(24,22,30,0.82), rgba(12,12,20,0.72));
    border: 1px solid rgba(226, 196, 135, 0.5);
    border-radius: 10px;
    box-shadow: 0 12px 34px rgba(0,0,0,0.45), inset 0 0 22px rgba(226,196,135,0.06);
    backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
    color: #efe6cf; user-select: none; pointer-events: none;
  }
  .card-eyebrow { font-size: 9px; letter-spacing: 0.34em; text-transform: uppercase;
    color: #e7c878; opacity: 0.95; margin-bottom: 5px; }
  #titleCard h1 { margin: 0; font-size: 21px; font-weight: 400; letter-spacing: 0.015em;
    color: #f7efdc; line-height: 1.15; }
  .card-rule { height: 2px; width: 54px; margin: 7px 0 6px;
    background: linear-gradient(90deg, #e7c878, rgba(231,200,120,0)); }
  .card-sub { font-size: 9.5px; letter-spacing: 0.2em; text-transform: uppercase;
    color: #c9bda0; }
  #controls { position: fixed; right: 20px; bottom: 22px; z-index: 10;
    display: flex; gap: 10px; }
  .ctl-btn { width: 58px; height: 58px; border-radius: 14px; cursor: pointer;
    border: 1px solid rgba(226,196,135,0.42);
    background: rgba(15,17,28,0.66);
    backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
    display: flex; align-items: center; justify-content: center;
    color: #e6c98a; transition: transform .16s ease, background .16s ease, color .16s ease, border-color .16s ease;
    outline: none; }
  .ctl-btn svg { width: 24px; height: 24px; }
  .ctl-btn:hover { transform: translateY(-3px); background: rgba(38,34,48,0.8);
    border-color: rgba(255, 226, 166, 0.9); color: #ffecaf; }
  .ctl-btn:active { transform: translateY(0px) scale(0.96); }
  .ctl-btn.active { background: rgba(214, 174, 82, 0.92); border-color: #fff0c0;
    color: #221505; box-shadow: 0 0 22px rgba(255, 214, 130, 0.35); }
  .ctl-btn.active:hover { background: rgba(228, 190, 100, 0.96); }
  #hint { position: fixed; left: 24px; bottom: 24px; z-index: 10;
    color: rgba(240, 231, 210, 0.85); font-size: 11.5px; line-height: 1.55;
    background: rgba(10, 12, 22, 0.55); border-left: 3px solid rgba(226,196,135,0.6);
    padding: 9px 14px; border-radius: 8px; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    pointer-events: none; user-select: none; }
  #hint b { color: #ffd98a; font-weight: 600; }
  #hint .keys { color: rgba(240,231,210,0.6); font-style: italic; }
</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.js","three/addons/":"./lib/addons/"}}</script>
</head>
<body>
<div id="titleCard">
  <div class="card-eyebrow">Roma · Italia</div>
  <h1>Piazza del<br>Colosseo</h1>
  <div class="card-rule"></div>
  <div class="card-sub">Colosseum · Roman Forum</div>
</div>
<div id="hint">
  <b>Drag</b> to rotate &nbsp;·&nbsp; <b>Scroll</b> to zoom<br>
  <span class="keys">release snaps the view to 45° steps</span>
</div>
<div id="controls">
  <button id="btnLeft" class="ctl-btn" title="Rotate 90° left" aria-label="Rotate left">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 10a8 8 0 1 1-1 7"/>
      <path d="M4 4v6h6"/>
    </svg>
  </button>
  <button id="btnPause" class="ctl-btn" title="Pause / resume day-night" aria-label="Pause day-night cycle">
    <svg id="pauseIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <line x1="9" y1="6" x2="9" y2="18"/>
      <line x1="15" y1="6" x2="15" y2="18"/>
    </svg>
    <svg id="playIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <button id="btnRight" class="ctl-btn" title="Rotate 90° right" aria-label="Rotate right">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 10a8 8 0 1 0 1 7"/>
      <path d="M20 4v6h-6"/>
    </svg>
  </button>
</div>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================= helpers ============================= */
const TAU = Math.PI * 2;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function angleDelta(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }

const urlParams = new URLSearchParams(location.search);
const startTime = clamp(parseFloat(urlParams.get('time') ?? '0.5') || 0, 0, 1);

/* ============================= renderer ============================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x9db0a4, 75, 165);

/* ============================= camera ============================= */
const TILT = 35.264 * Math.PI / 180;      // true isometric elevation
const ELEV = TILT;
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -90, 280);
let camYaw = Math.PI * 0.25;               // 45 deg default
let camDist = 62;
let camZoom = 1.0;
let camZoomTarget = 1.0;
const camTarget = new THREE.Vector3(0.4, -1.05, 0.2);

function updateCameraFrustum() {
  const aspect = window.innerWidth / window.innerHeight;
  const halfH = 15.6, halfW = halfH * aspect;
  camera.left = -halfW; camera.right = halfW; camera.top = halfH; camera.bottom = -halfH;
  camera.updateProjectionMatrix();
}
updateCameraFrustum();

function placeCamera() {
  const ce = Math.cos(ELEV), se = Math.sin(ELEV);
  const dir = new THREE.Vector3(
    Math.sin(camYaw) * ce, se,
    Math.cos(camYaw) * ce
  );
  camera.position.copy(camTarget).addScaledVector(dir, camDist);
  camera.lookAt(camTarget);
  camera.zoom = camZoom;
  camera.updateProjectionMatrix();
}
placeCamera();

/* ============================= lights ============================= */
const hemi = new THREE.HemisphereLight(0xbfdcff, 0x6a6355, 1.0);
scene.add(hemi);
const amb = new THREE.AmbientLight(0xfff2dd, 0.5);
scene.add(amb);
const sun = new THREE.DirectionalLight(0xffffff, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -21; sun.shadow.camera.right = 21;
sun.shadow.camera.top = 21; sun.shadow.camera.bottom = -21;
sun.shadow.camera.near = 8; sun.shadow.camera.far = 190;
sun.shadow.bias = -0.00035;
sun.shadow.normalBias = 0.03;
sun.shadow.radius = 4;
scene.add(sun);
scene.add(sun.target);
const lampGlow = new THREE.PointLight(0xffb46b, 0, 22, 2);
lampGlow.position.set(-1.1, 3.15, 11.6);
scene.add(lampGlow);
const forumGlow = new THREE.PointLight(0xffc07a, 0, 12, 2);
forumGlow.position.set(8.9, 2.3, 7.0);
scene.add(forumGlow);

/* ============================= canvas textures ============================= */
function makeCanvas(size, draw) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}
const rand = (() => { let s = 1234; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; })();

const texGrass = makeCanvas(256, (g, s) => {
  g.fillStyle = '#7fae5e'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 2400; i++) {
    const x = rand() * s, y = rand() * s, r = rand() * 2.1 + 0.5;
    const v = rand();
    g.fillStyle = v < 0.5 ? 'rgba(63,94,41,0.55)' : (v < 0.78 ? 'rgba(168,196,105,0.5)' : 'rgba(120,152,74,0.45)');
    g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
});
texGrass.wrapS = texGrass.wrapT = THREE.RepeatWrapping; texGrass.repeat.set(4, 4);

const texCobble = makeCanvas(256, (g, s) => {
  g.fillStyle = '#5c5348'; g.fillRect(0, 0, s, s);
  const rows = 8, cols = 6;
  for (let r = 0; r < rows; r++) {
    const off = (r % 2) ? s / cols / 2 : 0;
    for (let cIdx = -1; cIdx <= cols; cIdx++) {
      const x = cIdx * (s / cols) + off, w = s / cols - 3;
      const y = r * (s / rows), h = s / rows - 3;
      const shade = 72 + rand() * 34;
      g.fillStyle = `rgb(${shade},${shade - 7},${shade - 16})`;
      g.fillRect(x + 1.5, y + 1.5, w, h);
      g.fillStyle = 'rgba(255,255,255,0.08)';
      g.fillRect(x + 3, y + 3, w - 6, 3);
    }
  }
  for (let i = 0; i < 320; i++) {
    g.fillStyle = 'rgba(0,0,0,0.18)';
    g.fillRect(rand() * s, rand() * s, 1 + rand() * 2, 1 + rand() * 2);
  }
});
texCobble.wrapS = texCobble.wrapT = THREE.RepeatWrapping; texCobble.repeat.set(3, 3);

const texPaver = makeCanvas(256, (g, s) => {
  g.fillStyle = '#a5947c'; g.fillRect(0, 0, s, s);
  const tile = s / 4;
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
    const v = (rand() - 0.5) * 26;
    g.fillStyle = `rgb(${164 + v},${148 + v},${124 + v})`;
    g.fillRect(c * tile + 2, r * tile + 2, tile - 4, tile - 4);
    g.strokeStyle = 'rgba(70,58,44,0.55)'; g.lineWidth = 2;
    g.strokeRect(c * tile + 2, r * tile + 2, tile - 4, tile - 4);
    g.fillStyle = 'rgba(255,255,255,0.09)';
    g.fillRect(c * tile + 5, r * tile + 5, tile - 10, 5);
  }
  for (let i = 0; i < 380; i++) {
    g.fillStyle = 'rgba(60,50,40,0.14)';
    g.fillRect(rand() * s, rand() * s, 1 + rand() * 3, 1 + rand() * 3);
  }
});

const texPavementRing = makeCanvas(256, (g, s) => {
  g.fillStyle = '#a3906f'; g.fillRect(0, 0, s, s);
  const c = s / 2;
  for (let ring = 0; ring < 4; ring++) {
    g.strokeStyle = 'rgba(84,70,52,0.7)'; g.lineWidth = 5 - ring * 0.8;
    g.beginPath(); g.arc(c, c, 22 + ring * 52, 0, TAU); g.stroke();
    g.fillStyle = ring % 2 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.07)';
    g.beginPath(); g.arc(c, c, 20 + ring * 52, 0, TAU); g.fill();
    for (let k = 0; k < 14; k++) {
      const a = (k / 14) * TAU + ring * 0.22;
      const rr = 22 + ring * 52 + 9;
      g.fillStyle = 'rgba(80,66,50,0.5)';
      g.beginPath(); g.arc(c + Math.cos(a) * rr, c + Math.sin(a) * rr, 3.2, 0, TAU); g.fill();
    }
  }
});

const texStrata = makeCanvas(512, (g, s) => {
  const bands = [
    [0.0, '#7d6a55'], [0.16, '#7d6a55'],   // dirt band
    [0.16, '#6d5c48'], [0.34, '#6d5c48'],   // dirt slightly darker
    [0.34, '#57503f'], [0.46, '#57503f'],   // dark rock band 1
    [0.46, '#4b4438'], [0.62, '#4b4438'],   // dark rock band 2
    [0.62, '#3b352c'], [1.0, '#3b352c'],    // bottom rock
  ];
  for (const [off, col] of bands) { g.fillStyle = col; g.fillRect(0, off * s, s, s); }
  for (let i = 0; i < 1500; i++) {
    const y = rand() * s;
    g.fillStyle = rand() < 0.5 ? 'rgba(0,0,0,0.16)' : 'rgba(255,240,210,0.06)';
    g.fillRect(rand() * s, y, rand() * 60 + 8, rand() * 3 + 1);
  }
  for (let i = 0; i < 26; i++) {  // cracks
    g.strokeStyle = 'rgba(20,16,12,0.5)'; g.lineWidth = 1.4;
    g.beginPath();
    let x = rand() * s, y = rand() * s;
    g.moveTo(x, y);
    const segs = 3 + (rand() * 4) | 0;
    for (let j = 0; j < segs; j++) { x += (rand() - 0.5) * 90; y += (rand() - 0.3) * 40; g.lineTo(x, y); }
    g.stroke();
  }
  g.fillStyle = 'rgba(0,0,0,0.34)'; g.fillRect(0, 0, s, 9);
});

const texGrassEdge = makeCanvas(512, (g, s) => {
  g.fillStyle = '#5c4a30'; g.fillRect(0, 0, s, s);   // top soil line
  for (let y = 0; y < 60; y++) {
    g.fillStyle = `rgba(${94 + (rand() * 30) | 0},${74 + (rand() * 14) | 0},${44 + (rand() * 8) | 0},1)`;
    g.fillRect(0, y, s, 2);
  }
});

const texSign = (text, opts = {}) => makeCanvas(256, (g, s) => {
  g.fillStyle = opts.bg || '#2f4a2c'; g.beginPath(); g.arc ? g.arc(s/2, s/2, s/1.55, 0, TAU) : 0; g.fill();
  g.fillStyle = opts.bg || '#33502f'; g.fillRect(0, 0, s, s);
  if (opts.circle) { g.strokeStyle = '#d8c07a'; g.lineWidth = 5; g.beginPath(); g.arc(s/2, s/2, s/2 - 7, 0, TAU); g.stroke(); }
  g.strokeStyle = opts.border || '#d8c07a'; g.lineWidth = 5;
  g.strokeRect(5, 5, s - 10, s - 10);
  g.fillStyle = opts.fg || '#f4ead0';
  g.font = `600 ${opts.size || 34}px Georgia, serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const words = text.split(' ');
  if (words.length > 1) {
    g.font = `600 ${(opts.size || 34) - 6}px Georgia, serif`;
    words.forEach((w, i) => g.fillText(w, s/2, s*0.36 + i*(opts.size || 34)));
  } else {
    g.fillText(text, s/2, s/2 + 1);
  }
});

const texInscription = makeCanvas(512, (g, s) => {
  g.fillStyle = '#7e5a1e'; g.fillRect(0, 0, s, s);
  g.fillStyle = '#9c6f26'; g.fillRect(10, 10, s - 20, s - 20);
  g.strokeStyle = '#e9c96f'; g.lineWidth = 4; g.strokeRect(26, 26, s - 52, s - 52);
  g.fillStyle = '#f6e28a';
  g.font = '600 34px Georgia, serif'; g.textAlign = 'center';
  const lines = ['S · C · S ·', 'CONSTANTI', 'PVF'];
  lines.forEach((l, i) => g.fillText(l, s/2, s*0.38 + i*46));
  g.font = '20px Georgia, serif';
  g.fillText('∙ aur∙∙∙∙∙∙∙ ∙', s/2, s - 64);
});

const texCartSign = makeCanvas(512, (g, s) => {
  g.fillStyle = '#f2e6c8'; g.fillRect(0, 0, s, s);
  g.strokeStyle = '#7a2a1a'; g.lineWidth = 22; g.strokeRect(11, 11, s - 22, s - 22);
  g.fillStyle = '#7a2a1a';
  g.font = '700 96px Georgia, serif'; g.textAlign = 'center';
  g.fillText('IL COLOSSEO', s/2, s*0.40);
  g.fillStyle = '#a03020';
  g.font = '600 40px Georgia, serif';
  g.fillText("SOLO al CENTRO", s/2, s*0.63);
});

const texBusSide = makeCanvas(512, (g, s) => {
  g.fillStyle = '#f4ede0'; g.fillRect(0, 0, s, s);
  g.fillStyle = '#f4ede0'; g.fillRect(0, s*0.16, s, s*0.28);
  g.fillStyle = '#1d1b26';
  g.fillRect(s*0.07, s*0.22, s*0.44, s*0.22);   // window band
  g.fillStyle = '#d8d0be';
  g.fillRect(0, s*0.62, s, s*0.16);
  g.fillStyle = '#1d1b26';
  g.font = '700 58px Georgia, serif'; g.textAlign = 'left';
  g.fillText('NAPOLI →', s*0.52, s*0.47);
  g.font = '600 30px Georgia, serif';
  g.fillText('Piazza del Colosseo', s*0.52, s*0.90);
});

const texBusFront = makeCanvas(256, (g, s) => {
  g.fillStyle = '#8a1e12'; g.fillRect(0, 0, s, s);
  g.fillStyle = '#f4ede0'; g.fillRect(18, 18, s - 36, s - 36);
  g.fillStyle = '#b3301e'; g.font = '700 64px Georgia, serif'; g.textAlign = 'center';
  g.fillText('ROMA', s/2, s*0.52);
  g.fillStyle = '#1d1b26'; g.font = '600 30px Georgia, serif';
  g.fillText('17 km', s/2, s*0.74);
});

/* ============================= sky ============================= */
const skyUniforms = {
  topColor: { value: new THREE.Color('#3f7cc2') },
  horizonColor: { value: new THREE.Color('#cfe4da') },
  sunColor: { value: new THREE.Color('#ffffff') },
  sunDirection: { value: new THREE.Vector3(0, 1, 0) },
  moonDirection: { value: new THREE.Vector3(0, -1, 0) },
  sunI: { value: 1.6 },
  moonI: { value: 0 },
};
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  fog: false,
  uniforms: skyUniforms,
  vertexShader: `
    varying vec3 vDir;
    void main() {
      vDir = normalize(position);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying vec3 vDir;
    uniform vec3 topColor, horizonColor, sunColor;
    uniform vec3 sunDirection, moonDirection;
    uniform float sunI, moonI;
    void main() {
      vec3 dir = normalize(vDir);
      float h = dir.y;
      float mixH = pow(clamp(h * 0.5 + 0.5, 0.0, 1.0), 0.72);
      vec3 col = mix(horizonColor, topColor, mixH);
      float s = dot(dir, sunDirection) * 0.5 + 0.5;
      float glow = pow(clamp(s, 0.0, 1.0), 9.0);
      float disc = pow(clamp(s, 0.0, 1.0), 900.0) * 2.4;
      col += sunColor * (glow * 0.55 + disc * sunI * 0.35);
      float m = dot(dir, moonDirection) * 0.5 + 0.5;
      float mglow = pow(clamp(m, 0.0, 1.0), 26.0);
      float mdisc = pow(clamp(m, 0.0, 1.0), 1200.0) * 2.0;
      col += vec3(0.82, 0.87, 0.97) * (mglow * 0.28 + mdisc * moonI * 0.32);
      gl_FragColor = vec4(col, 1.0);
    }`,
});
const skyMesh = new THREE.Mesh(new THREE.SphereGeometry(280, 24, 16), skyMat);
scene.add(skyMesh);

/* sun & moon discs handled in-shader: skip separate meshes */

// stars
const starCount = 340;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  const az = rand() * TAU, el = 0.18 + rand() * 1.15;
  const r = 250;
  starPos[i * 3] = Math.cos(el) * Math.cos(az) * r;
  starPos[i * 3 + 1] = Math.sin(el) * r;
  starPos[i * 3 + 2] = Math.cos(el) * Math.sin(az) * r;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.7, sizeAttenuation: false, transparent: true, opacity: 0, depthWrite: false, fog: false });
scene.add(new THREE.Points(starGeo, starMat));

/* clouds */
const clouds = [];
const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, flatShading: true, transparent: true, opacity: 0.92, emissive: 0x8a94a0, emissiveIntensity: 0.18 });
const cloudMatShade = new THREE.MeshStandardMaterial({ color: 0xcfd6dc, roughness: 0.95, flatShading: true, emissive: 0x5c636e, emissiveIntensity: 0.25 });
for (let i = 0; i < 9; i++) {
  const grp = new THREE.Group();
  const nBlobs = 3 + (rand() * 3 | 0);
  for (let b = 0; b < nBlobs; b++) {
    const blob = new THREE.Mesh(new THREE.IcosahedronGeometry(0.9 + rand() * 1.5, 0), rand() < 0.3 ? cloudMatShade : cloudMat);
    blob.position.set((rand() - 0.5) * 4.6, (rand() - 0.5) * 0.8, (rand() - 0.5) * 2.0);
    blob.scale.y = 0.55;
    grp.add(blob);
  }
  const sc = 0.9 + rand() * 1.5;
  grp.scale.setScalar(sc);
  grp.position.set((rand() - 0.5) * 90, 13 + rand() * 6.5, -26 - rand() * 30);
  grp.rotation.y = rand() * TAU;
  scene.add(grp);
  clouds.push({ grp, speed: 0.14 + rand() * 0.22 });
}

/* birds */
const birds = [];
const birdMat = new THREE.MeshBasicMaterial({ color: 0x20242e, side: THREE.DoubleSide, fog: false });
function makeBird() {
  const grp = new THREE.Group();
  const body = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.34, 5), birdMat);
  body.rotation.z = Math.PI / 2;
  grp.add(body);
  const wingGeo = new THREE.BufferGeometry();
  wingGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([

/* arch band: half-annulus above y=0 at bay center */
function buildArchGeom() {
  const shape = new THREE.Shape();
  shape.absarc(0, 0, 0.58, Math.PI, 0, true);   // outer upper arc (left to right via top)
  shape.lineTo(-0.34, 0);
  // careful: moving along the outer arc reversed
  // instead simpler: draw shape explicitly via points
  const outer = [], inner = [];
  for (let i = 0; i <= 10; i++) {
    const a = Math.PI - (i / 10) * Math.PI;
    outer.push([Math.cos(a) * 0.58, Math.sin(a) * 0.58]);
    inner.push([Math.cos(a) * 0.36, Math.sin(a) * 0.36]);
  }
  const sh = new THREE.Shape();
  sh.moveTo(outer[0][0], outer[0][1]);
  for (const p of outer) sh.lineTo(p[0], p[1]);
  for (let i = inner.length - 1; i >= 0; i--) sh.lineTo(inner[i][0], inner[i][1]);
  sh.closePath();
  const g = new THREE.ExtrudeGeometry(sh, { depth: 0.2, bevelEnabled: false });
  g.translate(0, 0, -0.1);
  return g;
}

/* wall via Shape with arch holes (single extrusion) */
function archHolePath(hgt, w, botY) {
  const path = new THREE.Path();
  const r = w / 2;
  const springY = botY + hgt - r;   // below this, straight walls then arc
  path.moveTo(-r, botY);
  path.lineTo(-r, springY);
  path.absarc(0, springY, r, Math.PI, 0, true); // 180 -> 0 going over the top
  path.lineTo(r, botY);
  path.lineTo(-r, botY);
  return path;
}

function keyState(t) {
  const keys = SKY_KEYS;
  let i = 0;
  while (i < keys.length - 2 && keys[i + 1].t <= t) i++;
  const a = keys[i], b = keys[i + 1];
  let u = (t - a.t) / Math.max(1e-5, b.t - a.t);
  u = u * u * (3 - 2 * u);
  return { a, b, u };
}
const tmpColor = new THREE.Color();
function lerpHex(hexA, hexB, t, out) {
  out.copy(tmpColor.setHex(hexA)).lerp(new THREE.Color(hexB), t);
  return out;

function updateSkyTime(tSec) {

  const sunI = lerp(a.sunI, b.sunI, u);
  const hemiI = lerp(a.hemi, b.hemi, u);
  const ambI = lerp(a.ambI, b.ambI, u);
  const dirI = lerp(a.dirI, b.dirI, u);
  const warm = lerp(a.warm, b.warm, u);
  const fogC = lerpHex(a.fog, b.fog, u, new THREE.Color());
  const sunDisc = lerp(a.sunDisc, b.sunDisc, u);
  const moonOp = lerp(a.moonOp, b.moonOp, u);

  skyUniforms.topColor.value.copy(top);
  skyUniforms.horizonColor.value.copy(hor);
  skyUniforms.sunColor.value.copy(sunCol);
  skyUniforms.sunI.value = sunI + 0.25;
  skyUniforms.moonI.value = moonOp;

  scene.fog.color.copy(fogC);
  hemi.intensity = hemiI;
  hemi.color.copy(top.clone().lerp(new THREE.Color('#bcd4e6'), 0.45));
  hemi.groundColor.setHex(0x6a6355).lerp(new THREE.Color(warm > 0.35 ? '#7a5640' : '#3c3630'), warm);
  amb.intensity = ambI;
  amb.color.setHex(warm > 0.35 ? 0xffc59a : 0xf3f5ff);

  // sun position
  const el = 2 * Math.PI * t - Math.PI / 2;       // -90° midnight, 0 at day zenith crossings
  const az = Math.PI * (t - 0.25);
  const ce = Math.cos(el), se = Math.sin(el);

  skyUniforms.moonDirection.value.copy(moonDir);

  sun.position.copy(lightDir).multiplyScalar(92);
  sun.intensity = useMoon ? Math.min(1.4, dirI * 0.55) : dirI;

/* ============================= animation loop ============================= */
let elapsedTotal = 0;
let lastPerfNow = performance.now() * 0.001;

/* simple flag for first-frame snapshot */
let firstFrameDone = false;

function animate() {
  requestAnimationFrame(animate);
  const nowPerf = performance.now() * 0.001;
  const dt = Math.min(Math.max(nowPerf - lastPerfNow, 0.0001), 0.05);
  lastPerfNow = nowPerf;
  elapsedTotal += dt;
  if (!dayState.paused) dayState.elapsed += dt;
  const tSec = todSeconds();
  updateSkyTime(tSec);

  // bus path (elliptical loop around south plaza)
  const bt = (performance.now() * 0.00011) % TAU;
  const bx = BUS_ROCKET_CENTER.x + BUS_RX * Math.cos(bt);
  const bz = BUS_ROCKET_CENTER.z + BUS_RZ * Math.sin(bt);
  busGroup.position.set(bx, 0.06, bz);
  const tangent = new THREE.Vector3(-BUS_RX * Math.sin(bt), 0, BUS_RZ * Math.cos(bt)).normalize();
  busGroup.rotation.y = Math.atan2(tangent.x, tangent.z);

  // people walking
  for (const p of people) {
    const ang = p.phase + p.dir * p.speed * elapsedTotal * 60 * 0.05;
    const px = p.cx + Math.cos(ang) * p.r;
    const pz = p.cz + Math.sin(ang) * p.r * 0.82;
    p.g.position.set(px, 0.06 + Math.abs(Math.sin(elapsedTotal * p.bobSpeed + p.phase)) * 0.085, pz);
    p.g.rotation.y = p.dir > 0 ? Math.atan2(-Math.sin(ang), Math.cos(ang)) : Math.atan2(Math.sin(ang), -Math.cos(ang));
  }

  // cloud drift
  for (const c of clouds) {
    c.grp.position.x += c.speed * dt;
    if (c.grp.position.x > 52) c.grp.position.x = -52;
  }
  // birds circle
  for (const b of birds) {
    const a = b.apex + elapsedTotal * b.angular;
    const h = Math.sin(elapsedTotal * 0.4 + b.phase) * 0.6 + b.height;
    b.grp.position.set(Math.cos(a) * b.radius, h, -9 + Math.sin(a * 1.7) * 2.4);
    const flap = Math.sin(elapsedTotal * 7 + b.phase) * 0.55;
    b.wingL.rotation.x = flap;
    b.wingR.rotation.x = -flap;
    b.grp.rotation.y = -a + Math.PI / 2;
  }

  // camera view interpolation (snap easing)
  if (!VIEW.dragging) {
    VIEW.yaw = VIEW.yaw + angleDelta(VIEW.yaw, VIEW.target) * 0.16;
    if (Math.abs(angleDelta(VIEW.yaw, VIEW.target)) < 0.004) {
      VIEW.yaw = VIEW.target;
    }
  }
  if (VIEW.dragging) {
    // keep VIEW.yaw tracking VIEW.target 1:1
    // (already set in pointermove)
  }
  camYaw = VIEW.yaw;
  camZoom = lerp(camZoom, camZoomTarget, 0.12);
  placeCamera();

  // sun shadow direction follows sun position
  // (directional light position derives from sky update)
  renderer.render(scene, camera);
  if (!firstFrameDone) {
    firstFrameDone = true;
    placeCamera();
  }
}

window.__diorama = { scene, camera, renderer };

/* ============================= resize ============================= */
window.addEventListener('resize', () => {
  updateCameraFrustum();
  renderer.setSize(window.innerWidth, window.innerHeight);
  placeCamera();
});

animate();
</script>
</body>
</html>
