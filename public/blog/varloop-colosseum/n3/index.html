<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piazza del Colosseo · Rome — 3D Isometric Diorama</title>
<style>
  :root{
    --ink:#f5ead2;
    --ink-dim:rgba(245,234,210,.72);
    --panel:rgba(16,18,26,.62);
    --line:rgba(245,234,210,.22);
    --accent:#e8c469;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#0b1026; font-family:Georgia, 'Times New Roman', serif; }
  #scene{ position:fixed; inset:0; display:block; touch-action:none; cursor:grab; }
  #scene.dragging{ cursor:grabbing; }
  .vignette{ position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%, transparent 55%, rgba(4,6,16,.38) 100%); }
  .title-card{
    position:fixed; left:22px; bottom:22px; pointer-events:none; z-index:5;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:13px 18px 12px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    box-shadow:0 10px 34px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.09);
    max-width:330px;
  }
  .title-card .kicker{ font-size:9.5px; letter-spacing:.32em; text-transform:uppercase; color:var(--accent); opacity:.95; }
  .title-card h1{ font-size:20px; font-weight:600; letter-spacing:.02em; color:var(--ink); margin:6px 0 2px; }
  .title-card .city{ font-size:12.5px; font-style:italic; color:var(--ink-dim); letter-spacing:.06em; }
  .title-card .rule{ height:1px; background:var(--line); margin:9px 0 8px; position:relative; }
  .title-card .rule::after{ content:""; position:absolute; left:0; top:-2px; width:52px; height:5px; border-top:1px solid var(--accent); border-bottom:1px solid var(--accent); opacity:.8; }
  .title-card .hint{ font-size:10.5px; color:var(--ink-dim); letter-spacing:.04em; line-height:1.55; font-family:Georgia, serif; }
  .title-card .hint b{ color:var(--ink); font-weight:600; }
  .controls{ position:fixed; top:18px; right:18px; z-index:6; display:flex; gap:9px; align-items:center; }
  .btn{
    width:52px; height:52px; border-radius:50%; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    box-shadow:0 8px 22px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12);
    transition:transform .16s ease, border-color .16s ease, background .16s ease;
  }
  .btn:hover{ transform:translateY(-2px); border-color:rgba(232,196,105,.6); background:rgba(30,33,45,.78); }
  .btn:active{ transform:translateY(0px) scale(.96); }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn svg{ width:21px; height:21px; display:block; }
  .btn.is-on{ border-color:var(--accent); color:var(--accent); }
  .btn.is-on svg{ stroke:var(--accent); }
  .badge{ position:fixed; top:18px; left:22px; z-index:5; pointer-events:none;
    font-size:9.5px; letter-spacing:.3em; text-transform:uppercase; color:var(--ink-dim);
    border-left:2px solid var(--accent); padding-left:10px; line-height:1.7; text-shadow:0 1px 3px rgba(0,0,0,.6); }
  @media (max-width:760px){
    .title-card{ max-width:250px; padding:10px 14px; left:12px; bottom:12px; }
    .title-card h1{ font-size:16px; }
    .badge{ display:none; }
    .controls{ top:12px; right:12px; }
    .btn{ width:44px; height:44px; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette"></div>
<div class="badge">Civic Model<br>Travertine · Stone<br>Rome, Italy</div>
<div class="title-card">
  <div class="kicker">Interactive Diorama</div>
  <h1>Piazza del Colosseo</h1>
  <div class="city">Rome &nbsp;·&nbsp; Italy</div>
  <div class="rule"></div>
  <div class="hint"><b>Drag</b> to orbit the model, snap to 90° views<br><b>Scroll</b> to zoom &nbsp;·&nbsp; <b>Buttons</b> orbit &amp; pause the day cycle</div>

    <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M8 5.5v13c0 1.2 1.3 1.9 2.3 1.3l10-6.5c1-.6 1-2 0-2.6l-10-6.5C9.3 3.6 8 4.3 8 5.5z"/></svg>
  </button>

<script type="importmap">{"imports":{"three":"./lib/three.module.js","three/addons/":"./lib/addons/"}}</script>
<script type="module">
import * as THREE from 'three';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   PIAZZA DEL COLOSSEO — low-poly study in travertine & stone
   ============================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2f74c9);
scene.fog = new THREE.Fog(0x9fc3d9, 95, 215);

/* ---------- deterministic rng ---------- */
function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
const rng = mulberry32(20240517);
const pick = arr => arr[Math.floor(rng()*arr.length)];
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const sstep = (a,b,v)=>{ const t=clamp((v-a)/(b-a),0,1); return t*t*(3-2*t); };

/* ---------- canvas texture helpers ---------- */
function canvasTex(size, draw, opts={}){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d');
  draw(ctx, size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
function noiseSpeckle(ctx,size,count,colors,alpha=1){
  for(let i=0;i<count;i++){
    ctx.globalAlpha = (0.25+rng()*0.5)*alpha;
    ctx.fillStyle = pick(colors);
    const s = 1+rng()*3.2;
    ctx.fillRect(rng()*size, rng()*size, s, s);
  }
  ctx.globalAlpha = 1;
}
/* travertine block wall */
const travertineTex = canvasTex(256,(ctx,s)=>{
  ctx.fillStyle = '#d6c49c'; ctx.fillRect(0,0,s,s);
  noiseSpeckle(ctx,s,900,['#c4b084','#e2d4ac','#bfae87','#cbbb96'],.8);
  ctx.strokeStyle = 'rgba(120,100,70,.5)'; ctx.lineWidth = 2;
  for(let y=0;y<=s;y+=42){ ctx.beginPath(); ctx.moveTo(0,y+ (rng()*4-2)); ctx.lineTo(s,y+(rng()*4-2)); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(120,100,70,.32)'; ctx.lineWidth = 1.4;
  for(let row=0; row<6; row++){
    const y0 = row*42;
    for(let col=-1; col<3; col++){
      const x = ((col*86 + (row%2 ? 43 : 0)) % (s+86));
      ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, Math.min(s, y0+42)); ctx.stroke();
    }
  }
});
/* cobblestone */
const cobbleTex = canvasTex(256,(ctx,s)=>{
  ctx.fillStyle = '#33333b'; ctx.fillRect(0,0,s,s);
  const rows = 6, rh = s/rows;
  for(let r=0;r<rows;r++){
    const cols = 5 + (r%2);
    const cw = s/cols;
    for(let c2=-1;c2<cols+1;c2++){
      const off = (r%2 ? cw*0.5 : 0);
      const x = c2*cw + off, y = r*rh;
      ctx.fillStyle = pick(['#45454e','#50505a','#3b3b44','#575761','#2f2f36']);
      const pad = 2.5+rng()*1.5, rr = 6;
      const w = cw-pad*2, h = rh-pad*2;
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(x+pad, y+pad, w, h, rr); else ctx.rect(x+pad,y+pad,w,h);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.09)';
      ctx.fillRect(x+pad+2, y+pad+2, w-4, 3);
    }
  }
  noiseSpeckle(ctx,s,220,['#26262c','#5d5d68'],.6);
});
/* grass */
const grassTex = canvasTex(256,(ctx,s)=>{
  ctx.fillStyle = '#67933f'; ctx.fillRect(0,0,s,s);
  noiseSpeckle(ctx,s,1600,['#5a8538','#749c49','#547631','#7fa653','#4f7030'],.9);
  ctx.globalAlpha = .18; ctx.fillStyle = '#88a95c';
  for(let i=0;i<5;i++) ctx.fillRect(0, i*52+12, s, 15);
  ctx.globalAlpha = 1;
});
/* plaza paving (beige grid) */
const plazaTex = canvasTex(256,(ctx,s)=>{
  ctx.fillStyle = '#c7b386'; ctx.fillRect(0,0,s,s);
  noiseSpeckle(ctx,s,800,['#b7a374','#d4c49a','#af9b71'],.8);
  ctx.strokeStyle = 'rgba(96,80,55,.55)'; ctx.lineWidth = 2.5;
  for(let p=0;p<=s;p+=42){ ctx.beginPath(); ctx.moveTo(p,0); ctx.lineTo(p,s); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,p); ctx.lineTo(s,p); ctx.stroke(); }
});
/* earthy forum pavement */
const forumTex = canvasTex(256,(ctx,s)=>{
  ctx.fillStyle = '#a08a5f'; ctx.fillRect(0,0,s,s);
  noiseSpeckle(ctx,s,1100,['#8d7750','#b0986a','#7c6744','#c2b184'],.9);
  ctx.strokeStyle = 'rgba(60,48,30,.4)'; ctx.lineWidth = 2;
  for(let p=20;p<s;p+=64){ ctx.beginPath(); ctx.moveTo(0,p); ctx.lineTo(s,p+(rng()*10-5)); ctx.stroke(); }
});
/* rock strata */
const strataTex = canvasTex(256,(ctx,s)=>{
  ctx.fillStyle = '#6f665c'; ctx.fillRect(0,0,s,s);
  const bands = ['#7d7266','#5d554c','#867a6a','#554c43','#756a5e'];
  let y = 0;
  while(y < s){ const h = 12+rng()*26; ctx.fillStyle = pick(bands); ctx.fillRect(0,y,s,h); y += h; }
  noiseSpeckle(ctx,s,700,['#4d463d','#8d8172','#3f3a33'],.7);
  ctx.strokeStyle = 'rgba(30,26,22,.5)'; ctx.lineWidth = 2;
  y = 8+rng()*10;
  while(y < s){ ctx.beginPath(); for(let x=0;x<=s;x+=16){ ctx.lineTo(x, y + Math.sin(x*.09+y)*3 + (rng()*2-1)); } ctx.stroke(); y += 18+rng()*20; }
});
/* colosseum bay textures: one arched bay repeated */
function bayTex(kind){
  return canvasTex(256,(ctx,s)=>{
    ctx.fillStyle = '#cbb691'; ctx.fillRect(0,0,s,s);
    noiseSpeckle(ctx,s,240,['#bda87e','#ddcd9f','#c0a878'],.7);
    /* cornice band */
    ctx.fillStyle = '#b39d72'; ctx.fillRect(0,0,s,20);
    ctx.fillStyle = '#8f7d55'; ctx.fillRect(0,20,s,4);
    /* base band */
    ctx.fillStyle = '#b39d72'; ctx.fillRect(0,s-14,s,14);
    ctx.fillStyle = '#8f7d55'; ctx.fillRect(0,s-18,s,4);
    const cx = s/2;
    if(kind === 'attic'){
      /* row of small dark windows + plain attic panels */
      ctx.fillStyle = 'rgba(255,255,255,.13)'; ctx.fillRect(30,66,s-60,120);
      ctx.fillStyle = '#241c14';
      ctx.fillRect(64,58,34,64); ctx.fillRect(158,58,34,64);
      ctx.strokeStyle = '#e4d6ac'; ctx.lineWidth = 4;
      ctx.strokeRect(64,58,34,64); ctx.strokeRect(158,58,34,64);
      /* faint inscription line */
      ctx.fillStyle = 'rgba(90,72,45,.85)';
      ctx.fillRect(48,146,160,9); ctx.fillRect(76,166,104,7);
      return;
    }
    /* arch sizes per tier */
    let w, straight, top;
    if(kind===0){ w = 96; straight = 150; }        /* tier 1: big tall arch */
    else if(kind===1){ w = 74; straight = 120; }   /* tier 2 */
    else { w = 58; straight = 102; }               /* tier 3 */
    const r = w/2;
    const archTop = s-16 - (straight - 40) - r*0; /* compute below */
    const openingBottom = s - 26;
    const straightTop = openingBottom - straight;
    const arcCy = straightTop + r;
    /* arch ring (light surround) */
    ctx.fillStyle = '#e6d8ae';
    ctx.beginPath();
    ctx.arc(cx, arcCy, r+9, Math.PI, 0);
    ctx.rect(cx-r-9, arcCy, 2*(r+9), openingBottom-arcCy);
    ctx.fill();
    /* dark opening */
    ctx.fillStyle = '#33291f';
    ctx.beginPath();
    ctx.arc(cx, arcCy, r, Math.PI, 0);
    ctx.rect(cx-r, arcCy, 2*r, openingBottom-arcCy);
    ctx.fill();
    /* inner depth shading */
    const grad = ctx.createLinearGradient(0,arcCy,0,openingBottom);
    grad.addColorStop(0,'rgba(0,0,0,.34)'); grad.addColorStop(1,'rgba(255,240,210,.10)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(cx, arcCy, r, Math.PI, 0); ctx.rect(cx-r, arcCy, 2*r, openingBottom-arcCy); ctx.fill();
    /* keystone */
    ctx.fillStyle = '#efe0b4';
    ctx.beginPath();
    const ky = arcCy - r - 9;
    ctx.moveTo(cx-8, ky+2); ctx.lineTo(cx+8, ky+2); ctx.lineTo(cx+6, ky+14); ctx.lineTo(cx-6, ky+14);
    ctx.closePath(); ctx.fill();
    if(kind>0){
      /* decorative frieze dots under arch ring */
      ctx.fillStyle = '#a8946c';
      for(let i=-2;i<=2;i++){ if(i===0) continue; ctx.beginPath(); ctx.arc(cx + i*(w/1.6+8), straightTop+2, 3.4, 0, Math.PI*2); ctx.fill(); }
    }
  });
}
const tier1Tex = bayTex(0), tier2Tex = bayTex(1), tier3Tex = bayTex(2), atticTex = bayTex(3);
/* block wall texture: used on arch of constantine */
const archStoneTex = travertineTex;
/* red/white awning stripes */
const stripeTex = canvasTex(128,(ctx,s)=>{
  ctx.fillStyle = '#f3e6d2'; ctx.fillRect(0,0,s,s);
  ctx.fillStyle = '#c0392b';
  for(let i=-1;i<6;i++){ ctx.beginPath(); ctx.moveTo(i*32,0); ctx.lineTo(i*32+16,0); ctx.lineTo(i*32+16+40,s); ctx.lineTo(i*32+40,s); ctx.closePath(); ctx.fill(); }
});
/* banner: roman crimson with golden disc */
const bannerTex = canvasTex(128,(ctx,s)=>{
  ctx.fillStyle = '#8e1f1f'; ctx.fillRect(0,0,s,s);
  ctx.fillStyle = '#6f1414'; ctx.fillRect(0,0,s,12); ctx.fillRect(0,s-12,s,12);
  ctx.strokeStyle = '#e8c469'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(s/2, s*0.42, 30, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#e8c469'; ctx.beginPath(); ctx.arc(s/2, s*0.42, 15, 0, Math.PI*2); ctx.fill();
  ctx.font = 'bold 21px Georgia, serif'; ctx.textAlign='center'; ctx.fillStyle = '#e8c469';
  ctx.fillText('M·C·C·X·L·', s/2, s*0.78);
});
/* stone plaque with city name */
const plaqueTex = canvasTex(512,(ctx,s)=>{
  ctx.fillStyle = '#5c5236'; ctx.fillRect(0,0,s,s);
  noiseSpeckle(ctx,s,380,['#4a4228','#6e6443','#3f3822'],.8);
  ctx.strokeStyle = '#c9b569'; ctx.lineWidth = 10; ctx.strokeRect(18,18,s-36,s-36);
  ctx.fillStyle = '#e8cf8e'; ctx.textAlign = 'center';
  ctx.font = 'bold 56px Georgia, serif';
  ctx.fillText('PIAZZA DEL', s/2, 108);
  ctx.font = 'bold 84px Georgia, serif';
  ctx.fillText('COLOSSEO', s/2, 206);
  ctx.font = 'italic 30px Georgia, serif';
  ctx.fillStyle = '#cbb377';
  ctx.fillText('ROMA ·  AD 80', s/2, 292);
});
/* wood planks for cart */
const woodTex = canvasTex(128,(ctx,s)=>{
  ctx.fillStyle = '#7a5230'; ctx.fillRect(0,0,s,s);
  for(let y=0;y<s;y+=18){ ctx.fillStyle = pick(['#6e4a2a','#85603a','#5f3f24']); ctx.fillRect(0,y,s,16); ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(0,y+16,s,2); }
});
/* sign: bus stop text */
const busSignTex = canvasTex(256,(ctx,s)=>{
  ctx.fillStyle = '#1d4e89'; ctx.fillRect(0,0,s,s);
  ctx.strokeStyle = '#f0ead8'; ctx.lineWidth = 10; ctx.strokeRect(8,8,s-16,s-16);
  ctx.fillStyle = '#f0ead8'; ctx.font = 'bold 44px Georgia, serif'; ctx.textAlign = 'center';
  ctx.fillText('BUS', s/2, 74);
  ctx.font = 'bold 19px Georgia, serif';
  ctx.fillText('PIAZZA DEL', s/2, 122);
  ctx.fillText('COLOSSEO', s/2, 148);
  ctx.font = '15px Georgia, serif'; ctx.fillStyle = '#e8c469';
  ctx.fillText('→ arrow', s/2, 196);
});
/* inscription panel for arch (Latin-ish) */
const inscriptionTex = canvasTex(512,(ctx,s)=>{
  ctx.fillStyle = '#d8c9a2'; ctx.fillRect(0,0,s,s);
  noiseSpeckle(ctx,s,300,['#c4b084','#e2d4ac'],.6);
  ctx.fillStyle = '#3a2f1e';
  ctx.textAlign = 'center';
  ctx.font = 'bold 34px Georgia, serif';
  ctx.fillText('DIV  AVG  FL  CLAVDIVS', s/2, 108);
  ctx.font = 'bold 40px Georgia, serif';
  ctx.fillText('DIVI   COSSANTINI', s/2, 168);
  ctx.font = 'bold 26px Georgia, serif';
  ctx.fillText('ET  FELICITATI', s/2, 222);
  ctx.font = '20px Georgia, serif';
  ctx.fillText('QVARTVS  VIR.  RVF.  COS.  P. P.  F.', s/2, 272);
  ctx.font = 'italic 19px Georgia, serif';
  ctx.fillStyle = '#5a4a2c';
  ctx.fillText('— 294 d. C. —', s/2, 322);
});
/* italian flag for plaza pole */
const flagTex = canvasTex(128,(ctx,s)=>{
  ctx.fillStyle = '#1fa04a'; ctx.fillRect(0,0,s/3,s);
  ctx.fillStyle = '#f5f1e4'; ctx.fillRect(s/3,0,s/3,s);
  ctx.fillStyle = '#c33b32'; ctx.fillRect(2*s/3,0,s/3+1,s);
  ctx.fillStyle = '#e8c469'; ctx.beginPath(); ctx.arc(s/2, s/2, s*0.085, 0, Math.PI*2); ctx.fill();
});

/* ---------- materials ---------- */
const M = {
  grassTop:   new THREE.MeshStandardMaterial({ map:grassTex, roughness:1 }),
  dirtSide:   new THREE.MeshStandardMaterial({ color:0x6b4a2e, roughness:1 }),
  rock:       new THREE.MeshStandardMaterial({ map:strataTex, roughness:1, flatShading:true }),
  cobble:     new THREE.MeshStandardMaterial({ map:cobbleTex, roughness:.96 }),
  plaza:      new THREE.MeshStandardMaterial({ map:plazaTex, roughness:.95 }),
  forum:      new THREE.MeshStandardMaterial({ map:forumTex, roughness:.95 }),
  travertine: new THREE.MeshStandardMaterial({ map:travertineTex, roughness:.92 }),
  stone:      new THREE.MeshStandardMaterial({ color:0xcbb691, roughness:.9 }),
  stoneLight: new THREE.MeshStandardMaterial({ color:0xe0d2ae, roughness:.85 }),
  stoneDark:  new THREE.MeshStandardMaterial({ color:0x8f8266, roughness:.95 }),
  concrete:   new THREE.MeshStandardMaterial({ color:0xa79a80, roughness:.95 }),
  dark:       new THREE.MeshStandardMaterial({ color:0x241c14, roughness:1 }),
  trunk:      new THREE.MeshStandardMaterial({ color:0x6b4a2e, roughness:1, flatShading:true }),
  pine:       new THREE.MeshStandardMaterial({ color:0x7d9159, roughness:.9, flatShading:true }),
  cypress:    new THREE.MeshStandardMaterial({ color:0x2e4a2c, roughness:.95, flatShading:true }),
  leaf:       new THREE.MeshStandardMaterial({ color:0x4e7a38, roughness:.95, flatShading:true }),
  iron:       new THREE.MeshStandardMaterial({ color:0x2b2b30, roughness:.55, metalness:.72, flatShading:true }),
  wood:       new THREE.MeshStandardMaterial({ map:woodTex, roughness:.9 }),
  stripe:     new THREE.MeshStandardMaterial({ map:stripeTex, roughness:.85 }),
  stoneCap:   new THREE.MeshStandardMaterial({ color:0xe0d2ae, roughness:.85, side:THREE.DoubleSide }),
  glass:      new THREE.MeshStandardMaterial({ color:0x191a20, roughness:.25, metalness:.4, emissive:0xffc36b, emissiveIntensity:0 }),
  water:      new THREE.MeshStandardMaterial({ color:0x3e7d9a, roughness:.15, metalness:.1, transparent:true, opacity:.9, emissive:0x1c3a4a, emissiveIntensity:.35 }),
};
M.grassTop.map.repeat.set(10,10);
M.cobble.map.repeat.set(6,2);
M.plaza.map.repeat.set(5,5);
M.forum.map.repeat.set(5,3);
M.travertine.map.repeat.set(2,1);
M.cobble.map.anisotropy = 8;

/* colosseum tier materials with repeats */
function archMaterial(tex, count){
  const t = tex.clone(); t.needsUpdate = true; t.repeat.set(count,1);
  return new THREE.MeshStandardMaterial({ map:t, roughness:.88 });

const unitCylinder = new THREE.CylinderGeometry(1,1,1,10);
function annulusRingY(rxOut,rzOut,rxIn,rzIn,yBottom,height,mat,curveSegments=56){
  const shape = new THREE.Shape();
  shape.absellipse(0,0,rxOut,rzOut,0,Math.PI*2,false,0);
  const hole = new THREE.Path();
  hole.absellipse(0,0,rxIn,rzIn,0,Math.PI*2,true,0);
  shape.holes.push(hole);
  const geo = new THREE.ExtrudeGeometry(shape,{depth:height,bevelEnabled:false,curveSegments});
  geo.rotateX(-Math.PI/2);
  geo.translate(0, yBottom, 0);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}
function sectorWall(rXOut,rZOut,height,yBottom,thetaStart,thetaLength,mat,matInner,innerScale=0.945,textureRepeatless=false){
  /* outer wall */
  const rad = Math.max(12, Math.ceil(thetaLength*rXOut/1.35));
  const geo = new THREE.CylinderGeometry(1,1,height,rad,1,true,thetaStart,thetaLength);
  const outer = new THREE.Mesh(geo, mat);
  outer.scale.set(rXOut,1,rZOut);
  outer.position.y = yBottom + height/2;
  outer.castShadow = true; outer.receiveShadow = true;
  /* inner wall (slightly inset) */
  const geo2 = new THREE.CylinderGeometry(1,1,height,rad,1,true,thetaStart,thetaLength);
  const inner = new THREE.Mesh(geo2, matInner);
  inner.scale.set(rXOut*innerScale,1,rZOut*innerScale);
  inner.position.y = yBottom + height/2;
  inner.receiveShadow = true;
  const grp = new THREE.Group();
  grp.add(outer, inner);
  /* top cap annulus sector */
  const capGeo = new THREE.ExtrudeGeometry(ellipseSectorShape(rXOut,rZOut,rXOut*innerScale,rZOut*innerScale,thetaStart,thetaLength),{depth:.22,bevelEnabled:false,curveSegments:16});
  capGeo.rotateX(-Math.PI/2); capGeo.translate(0, yBottom+height-.02, 0);
  const cap = new THREE.Mesh(capGeo, M.stoneCap);
  cap.castShadow = true; cap.receiveShadow = true;
  grp.add(cap);
  return grp;
}
function ellipseSectorShape(rx1,rz1,rx2,rz2,a0,a1){
  /* angle θ: world x = sinθ*r, world z = cosθ*r; shape y must be -cosθ so rotateX(-90) maps it back to z */
  const shape = new THREE.Shape();
  const steps = 44;
  for(let i=0;i<=steps;i++){
    const a = a0 + (a1-a0)*i/steps;
    const x = Math.sin(a)*rx1, y = -Math.cos(a)*rz1;
    if(i===0) shape.moveTo(x,y); else shape.lineTo(x,y);
  }
  for(let i=steps;i>=0;i--){
    const a = a0 + (a1-a0)*i/steps;
    shape.lineTo(Math.sin(a)*rx2, -Math.cos(a)*rz2);
  }
  shape.closePath();
  return shape;
}

}

function makeInstanced(geo, mat, items, setMatrix){
  const inst = new THREE.InstancedMesh(geo, mat, items.length);
  const d = new THREE.Object3D();
  items.forEach((it, i)=>{ setMatrix(d, it); d.updateMatrix(); inst.setMatrixAt(i, d.matrix); });
  inst.castShadow = true; inst.receiveShadow = true;
  tile.add(inst);
  return inst;
}

function peoplePos(p, t, out){
  if(p.zone === 'ring'){
    const a = p.phase + t*0.16*p.speed;
    const r = 6.9 + p.lane*0.34;
    out.set(4.5 + Math.cos(a)*r, GROUND_Y, 5.0 + Math.sin(a)*r);
    return -a;
  }
  if(p.zone === 'forum'){
    const a = p.phase + t*0.2*p.speed;
    out.set(13.4 + Math.cos(a)*5.1, GROUND_Y, 9.6 + Math.sin(a)*3.5);
    return -a;
  }
  if(p.zone === 'south'){
    const span = 26;
    let s = ((t*1.25*p.speed + p.phase*span/(Math.PI*2)) % (span*2) + span*2) % (span*2);
    const x = s < span ? -span + s : span - (s - span);
    out.set(x, GROUND_Y, 16.6 + p.lane*1.35);
    return s < span ? Math.PI/2 : -Math.PI/2;
  }
  /* west road — back and forth along z */
  const span = 26;
  let s = ((t*1.15*p.speed + p.phase*span/(Math.PI*2)) % (span*2) + span*2) % (span*2);
  const z = s < span ? -span + s : span - (s - span);
  out.set(-26.6 + p.lane*1.3, GROUND_Y, z);
  return s < span ? 0 : Math.PI;
}

function paintSky(){
  const top = '#'+dayState.top.getHexString();

  const key = top+hor+bot;
  if(key === lastSkyKey) return;
  lastSkyKey = key;
  const ctx = skyCanvas.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0.0, top);
  grad.addColorStop(0.55, hor);
  grad.addColorStop(0.68, hor);
  grad.addColorStop(1.0, bot);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 4, 256);
  skyTex.needsUpdate = true;
}

  while(i < STOPS.length - 2 && STOPS[i+1].t <= t) i++;
  const a = STOPS[i], b = STOPS[i+1];
  const span = Math.max(1e-5, b.t - a.t);
  const k = clamp((t - a.t)/span, 0, 1);
  return (field) => COLOR_FIELDS.has(field)
    ? _cOut.copy(_cA.setHex(a[field])).lerp(_cB.setHex(b[field]), k)
    : lerp(a[field], b[field], k);
}
const dayState = { top:new THREE.Color(), hor:new THREE.Color(), bot:new THREE.Color(), sunC:new THREE.Color(), sunI:0, hemiI:0.8, lamp:0, fog:new THREE.Color() };
function computeDayState(t){
  const mix = lerpStops(t);
  dayState.top.copy(mix('top')); dayState.hor.copy(mix('hor')); dayState.bot.copy(mix('bot'));
  dayState.sunC.copy(mix('sunC')); dayState.fog.copy(mix('fog'));
  dayState.sunI = mix('sunI'); dayState.hemiI = mix('hemiI'); dayState.lamp = mix('lamp');
}

const tmpV = new THREE.Vector3();
let dayTime = 0.5;   /* starting time of day, set from URL ?time= */
const startParam = new URLSearchParams(window.location.search).get('time');
if(startParam !== null && !isNaN(parseFloat(startParam))){
  dayTime = ((parseFloat(startParam) % 1) + 1) % 1;
}
/* day cycle increment handled in the render loop */
/* full day-night cycle: 60 seconds */
const CYCLE = 60;

function applyDayNight(){
  computeDayState(dayTime);
  /* sun vector from time */
  const ang = (dayTime - 0.5) * Math.PI * 2;      /* 0 at noon */
  const maxEl = 1.02;                              /* ~58° max elevation */
  const el = Math.cos(ang) * maxEl;                /* signed elevation */
  const az = ang + Math.PI/2;                      /* azimuth sweep: east -> south -> west */
  const cosEl = Math.cos(el), sinEl = Math.sin(el);
  tmpV.set(Math.cos(az)*cosEl, sinEl, Math.sin(az)*cosEl).normalize();
  const isDay = el > 0.02;
  const sunWorld = tmpV.clone();
  const moonWorld = tmpV.clone().negate(); if(moonWorld.y < 0.18) moonWorld.y = 0.18 + 0.35;
  moonWorld.normalize();
  /* sky gradient */
  paintSky();
  scene.background = dayState.fog.clone();
  scene.fog.color.copy(dayState.fog);
  /* lights */
  if(isDay){
    sun.position.copy(sunWorld).multiplyScalar(90).add(new THREE.Vector3(0,0,0));
    sun.color.copy(dayState.sunC);
    sun.intensity = dayState.sunI;
  } else {
    sun.position.copy(moonWorld).multiplyScalar(90);
    sun.color.setHex(0x9db4e8);
    const nightness = sstep(-0.05, -0.45, el);
    sun.intensity = 0.78 * nightness + 0.1;
  }
  hemi.intensity = dayState.hemiI;
  hemi.color.copy(dayState.top).lerp(new THREE.Color(0xffffff), 0.35);
  hemi.groundColor.setHex(0x4a4032).lerp(new THREE.Color(0x131720), dayState.lamp);
  fill.intensity = 0.28 + 0.12 * dayState.lamp;
  cartLight.intensity = dayState.lamp * 4.5;
  plazaLight.intensity = dayState.lamp * 4.2;
  squareLight.intensity = dayState.lamp * 3.8;
  bridgeLight.intensity = dayState.lamp * 3.6;
  /* emissive surfaces */
  for(const e of nightEmissives){ e.mat.emissiveIntensity = lerp(e.day, e.night, dayState.lamp); }
  /* discs */
  sunDisc.position.copy(sunWorld).multiplyScalar(300);
  sunDisc.lookAt(camera.position);
  sunDisc.material.opacity = isDay ? sstep(-0.06, 0.06, el) : 0;
  sunDisc.material.color.copy(dayState.sunC).lerp(new THREE.Color(0xffffff), 0.25);
  sunGlow.position.copy(sunWorld).multiplyScalar(300);
  sunGlow.lookAt(camera.position);
  sunGlow.material.opacity = isDay ? 0.34*sstep(-0.1,0.15,el) : 0;
  sunGlow.material.color.copy(dayState.sunC);
  moonDisc.position.copy(moonWorld).multiplyScalar(300);
  moonDisc.lookAt(camera.position);
  moonDisc.material.opacity = isDay ? 0 : 0.95;
  moonGlow.position.copy(moonWorld).multiplyScalar(300);
  moonGlow.lookAt(camera.position);
  moonGlow.material.opacity = isDay ? 0 : 0.25;
  /* stars */
  starMat.opacity = sstep(0.35, 0.85, dayState.lamp) * 0.95;
  /* clouds tint */
  const warm = sstep(0.55, 0.95, 1 - Math.abs(dayTime - 0.755)*5); /* golden hour-ish */
  cloudMat.color.setHex(0xffffff).lerp(new THREE.Color(0xffc39a), clamp(1 - Math.abs(dayTime-0.72)*4.2, 0, 1)*0.45 + clamp(1 - Math.abs(dayTime-0.27)*4.2,0,1)*0.4);
  cloudMat.emissive.setHex(0xffffff); cloudMat.emissiveIntensity = clamp(1 - Math.abs(dayTime-0.755)*5, 0, 1)*0.22;
}

/* ================================================================
   CAMERA — isometric orthographic, custom orbit + snap
   ================================================================ */
const camera = new THREE.OrthographicCamera(-1,1,1,-1, 3, 400);
const BASE_HALF = 30;
let frustumAspect = 1;
let azCurrent = Math.PI/4, azTarget = Math.PI/4;      /* azimuth, base view 45° */
let elCurrent = 0.86, elTarget = 0.86;                /* elevation rad above horizon ~49° */
let zoomCurrent = 1, zoomTarget = 1;
const ZOOM_MIN = 0.62, ZOOM_MAX = 2.4;
const EL_MIN = 0.62, EL_MAX = 1.12;
const target = new THREE.Vector3(-2, -1.2, -1);

function layout(){
  const w = window.innerWidth, h = window.innerHeight;
  const aspect = w/h;
  frustumAspect = aspect;
  camera.left = -BASE_HALF*aspect; camera.right = BASE_HALF*aspect;
  camera.top = BASE_HALF; camera.bottom = -BASE_HALF;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
layout();

function updateCamera(){
  const dist = 95;
  const cosEl = Math.cos(elCurrent);
  camera.position.set(
    target.x + dist*cosEl*Math.sin(azCurrent),
    target.y + dist*Math.sin(elCurrent),
    target.z + dist*cosEl*Math.cos(azCurrent)
  );
  camera.lookAt(target);
  camera.zoom = zoomCurrent;
  camera.updateProjectionMatrix();
}
const snapAz = az => Math.PI/4 + (Math.PI/2)*Math.round((az - Math.PI/4)/(Math.PI/2));

let dragging = false, dragMoved = 0, lastX = 0, lastY = 0;
canvas.addEventListener('pointerdown', e => {
  dragging = true; dragMoved = 0; lastX = e.clientX; lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
  canvas.classList.add('dragging');
});
canvas.addEventListener('pointermove', e => {
  if(!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  dragMoved += Math.abs(dx) + Math.abs(dy);
  azTarget += dx*0.0055;
  elTarget = clamp(elTarget + dy*0.0042, EL_MIN, EL_MAX);
});
const endDrag = () => {
  if(!dragging) return;
  dragging = false;
  canvas.classList.remove('dragging');
  azTarget = snapAz(azTarget);
  elTarget = clamp(0.86, EL_MIN, EL_MAX); /* gentle ease back to isometric elevation */
};
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoomTarget = clamp(zoomTarget * Math.exp(e.deltaY*0.0011), ZOOM_MIN, ZOOM_MAX);
}, { passive:false });

document.getElementById('rotLeft').addEventListener('click', () => { azTarget = snapAz(azTarget) + Math.PI/2; });
document.getElementById('rotRight').addEventListener('click', () => { azTarget = snapAz(azTarget) - Math.PI/2; });
const pauseBtn = document.getElementById('pauseBtn');
const iconPause = document.getElementById('iconPause');
const iconPlay = document.getElementById('iconPlay');
let paused = false;
pauseBtn.addEventListener('click', () => {
  paused = !paused;
  pauseBtn.classList.toggle('is-on', paused);
  iconPause.style.display = paused ? 'none' : 'block';
  iconPlay.style.display = paused ? 'block' : 'none';
  pauseBtn.title = paused ? 'Resume day–night cycle' : 'Pause the day–night cycle';
});

/* ------- colosseum banners + square plaque ------- */
{
  const bannerMat = new THREE.MeshStandardMaterial({ map: bannerTex, side: THREE.DoubleSide, roughness:.85 });
  const poleMat = M.iron;
  for(const side of [-1, 1]){
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.09, 3.1, 6), poleMat);
    pole.position.set(side*7.6, GROUND_Y + 1.55, 5.9);

}
{

  plaque.position.set(1.7, GROUND_Y + 0.82, 6.4);

/* ================================================================
   ANIMATION STATE
   ================================================================ */
let simTime = 0;
let lastFrame = 0;
let dt = 0;
const easeDamp = (cur, target, k) => cur + (target - cur)*(1 - Math.exp(-k*Math.max(dt, 1e-4)));

const _pos = new THREE.Vector3();
const _dummy = new THREE.Object3D();

function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  if(!lastFrame) lastFrame = now;
  dt = Math.min((now - lastFrame)/1000, 0.05);
  lastFrame = now;
  simTime += dt;
  if(!paused) dayTime = (dayTime + dt/CYCLE) % 1;
  applyDayNight();

  /* camera easing */
  azCurrent = easeDamp(azCurrent, azTarget, dragging ? 14 : 7);
  elCurrent = easeDamp(elCurrent, elTarget, 8);
  zoomCurrent = easeDamp(zoomCurrent, zoomTarget, 9);
  updateCamera();

  /* shards bob and orbit */
  for(const s of shards){
    const u = s.userData;
    const a = u.a + simTime*0.03;
    s.position.set(Math.cos(a)*u.r, u.y + Math.sin(simTime*0.4 + u.bob)*1.1, Math.sin(a)*u.r);
    s.rotation.y = simTime*u.spin; s.rotation.x = simTime*u.spin*0.7;
  }

  /* clouds drift */
  for(const c of clouds){
    c.position.x += c.userData.speed*dt;
    if(c.position.x > 120) c.position.x = -120;
    c.position.y = c.userData.baseY + Math.sin(simTime*0.25 + c.userData.phase)*0.8;
  }

  /* birds fly circles, flap */
  for(const b of birds){
    const u = b.userData;
    const a = simTime*u.speed + u.phase;
    const px = u.center.x + Math.cos(a)*u.radius;
    const pz = u.center.z + Math.sin(a)*u.radius;
    const py = u.height + Math.sin(simTime*0.9 + u.phase)*1.1;
    b.position.set(px, py, pz);
    b.rotation.y = -a + Math.PI/2;
    const flap = Math.sin(simTime*9 + u.phase)*0.75;
    u.wingL.rotation.z = flap;
    u.wingR.rotation.z = -flap;
  }

  /* fountain ripple */
  if(ripple){
    const k = (simTime*1.35) % 1;
    ripple.scale.setScalar(0.4 + k*2.4);
    ripple.material.opacity = 0.75*(1 - k);
  }

  /* flag wave */
  if(flagMesh){
    const pos = flagMesh.geometry.attributes.position;
    for(let i=0;i<pos.count;i++){
      const x = pos.getX(i);
      const w = (x + 0.875) / 1.75;
      pos.setZ(i, Math.sin(x*3.4 + simTime*3.4)*0.11*w + Math.sin(x*7.1 + simTime*5.1)*0.05*w);
    }
    pos.needsUpdate = true;
    flagMesh.geometry.computeVertexNormals();
  }

  /* vehicles loop around roundabout */
  const busAngle = simTime*0.145;
  const rBus = 4.32, rVespa = 3.72;
  const pBus = _pos.set(4.5 + Math.cos(busAngle)*rBus, GROUND_Y, 5.0 + Math.sin(busAngle)*rBus);
  bus.position.copy(pBus);
  bus.rotation.y = -busAngle;
  bus.userData.wheels.forEach(w => { w.rotation.x += dt*2.4; });
  const vespaAAngle = busAngle + 2.2, vespaBAngle = busAngle + Math.PI;
  vespaA.position.set(4.5 + Math.cos(vespaAAngle)*rVespa, GROUND_Y, 5.0 + Math.sin(vespaAAngle)*rVespa);
  vespaA.rotation.y = -vespaAAngle;
  vespaB.position.set(4.5 + Math.cos(vespaBAngle)*rVespa, GROUND_Y, 5.0 + Math.sin(vespaBAngle)*rVespa);
  vespaB.rotation.y = -vespaBAngle;

  /* people */
  for(let i=0;i<PEOPLE;i++){
    const p = personData[i];
    const heading = peoplePos(p, simTime, _pos);
    const bob = Math.abs(Math.sin(simTime*7*p.speed + p.bobPhase))*0.09;
    _dummy.position.set(_pos.x, GROUND_Y + 0.54*p.scale + bob*0.55, _pos.z);
    _dummy.rotation.set(0, heading, 0);
    _dummy.scale.set(p.scale, p.scale*(1 - bob*0.12), p.scale);
    _dummy.updateMatrix();
    peopleBody.setMatrixAt(i, _dummy.matrix);
    _dummy.position.set(_pos.x, GROUND_Y + 1.17*p.scale + bob, _pos.z);
    _dummy.scale.set(p.scale, p.scale, p.scale);
    _dummy.updateMatrix();
    peopleHead.setMatrixAt(i, _dummy.matrix);
  }
  peopleBody.instanceMatrix.needsUpdate = true;
  peopleHead.instanceMatrix.needsUpdate = true;

  renderer.render(scene, camera);
}
animate();

/* stop animation after N idle? No — always animates. */

/* expose handles for tests */
window.__diorama = { scene, camera, renderer };

window.addEventListener('resize', layout);
