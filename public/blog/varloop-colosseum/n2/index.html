<script type="module">
import * as THREE from 'three';

/* =====================================================================
   Piazza del Colosseo — a low-poly isometric diorama of the Roman
   amphimetre square, floating in the sky.
   ===================================================================== */

// ---------------- deterministic RNG ----------------
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20250607);
const rand = (a, b) => a + (b - a) * rng();
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smoothstep = (e0, e1, x) => {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
};
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (cur, target, lambda, dt) => lerp(cur, target, 1 - Math.exp(-lambda * dt));

// ---------------- URL time-of-day ----------------
const urlTime = (() => {
  const v = new URLSearchParams(location.search).get('time');
  const n = v === null ? NaN : parseFloat(v);
  return Number.isFinite(n) ? ((n % 1) + 1) % 1 : 0.5;   // default: noon
})();
const urlZoom = (parseFloat(new URLSearchParams(location.search).get('zoom')) || 1.22);
const urlAimX = parseFloat(new URLSearchParams(location.search).get('aimx') || '0');
const urlAimZ = parseFloat(new URLSearchParams(location.search).get('aimz') || '0');

// ---------------- renderer / scene / camera ----------------
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();

const HALF_H = 29;               // ortho frustum half-height at zoom 1
const aspect = () => window.innerWidth / window.innerHeight;

// ---------------- canvas texture helpers ----------------
function makeCanvas(size, draw) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  return c;
}
function canvasTexture(canvas, repeatX = 1, repeatY = 1) {
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeatX, repeatY);
  tex.anisotropy = 4;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const stoneCanvas = makeCanvas(256, (g, s) => {           // travertine
  g.fillStyle = '#cfc0a0'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 900; i++) {
    const y = rng() * s;
    g.fillStyle = rng() < 0.5 ? 'rgba(178,163,132,0.5)' : 'rgba(222,211,182,0.5)';
    g.fillRect(0, y, s, 1 + rng() * 2.2);
  }
  for (let i = 0; i < 500; i++) {
    g.fillStyle = 'rgba(90,80,60,0.12)';
    g.fillRect(rng() * s, rng() * s, 1.6, 1.6);
  }
});
const cobbleCanvas = makeCanvas(256, (g, s) => {          // dark cobbles
  g.fillStyle = '#3b3b42'; g.fillRect(0, 0, s, s);
  const rows = 9, cols = 10;
  for (let r = 0; r < rows; r++) {
    for (let cIdx = 0; cIdx < cols; cIdx++) {
      const off = (r % 2) ? s / (cols * 2) : 0;
      const x = cIdx * (s / cols) + off, y = r * (s / rows);
      const w = s / cols * 0.86, h = s / rows * 0.82;
      const shade = 52 + rng() * 34;
      g.fillStyle = `rgb(${shade},${shade},${shade + 8})`;
      g.beginPath();
      g.roundRect(x + 1.5, y + 2, w, h, 5);
      g.fill();
      g.fillStyle = 'rgba(255,255,255,0.06)';
      g.beginPath(); g.roundRect(x + 4, y + 3.5, w - 6, h * 0.4, 4); g.fill();
    }
  }
});
const paveCanvas = makeCanvas(256, (g, s) => {            // sandstone paving plaza
  g.fillStyle = '#c2ac85'; g.fillRect(0, 0, s, s);
  const step = s / 4;
  for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
    const v = (x + y) % 2 ? 0 : 8;
    g.fillStyle = `rgba(120,100,70,${0.08 + 0 * v})`;
    g.fillRect(x * step + 1, y * step + 1, step - 2, step - 2);
    if ((x + y) % 3 === 0) { g.fillStyle = 'rgba(255,244,214,0.25)'; g.fillRect(x * step + 4, y * step + 4, step - 9, step - 9); }
  }
  g.strokeStyle = 'rgba(96,78,52,0.85)'; g.lineWidth = 2.4;
  for (let i = 0; i <= 4; i++) {
    g.beginPath(); g.moveTo(i * step, 0); g.lineTo(i * step, s); g.stroke();
    g.beginPath(); g.moveTo(0, i * step); g.lineTo(s, i * step); g.stroke();
  }
  for (let i = 0; i < 350; i++) { g.fillStyle = 'rgba(70,55,35,0.25)'; g.fillRect(rng() * s, rng() * s, 1.8, 1.8); }
});
const grassCanvas = makeCanvas(256, (g, s) => {            // lawn
  g.fillStyle = '#4e7a33'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 1400; i++) {
    const shade = rng();
    g.fillStyle = shade < 0.4 ? '#568a38' : shade < 0.75 ? '#3f6527' : '#659647';
    const px = rng() * s, py = rng() * s, h = 2 + rng() * 4;
    g.fillRect(px, py, 1.6, h);
  }
});
const rockCanvas = makeCanvas(256, (g, s) => {             // stratified rock
  g.fillStyle = '#5d5148'; g.fillRect(0, 0, s, s);
  let y = 0;
  while (y < s) {
    const h = 8 + rng() * 18;
    const shade = 70 + rng() * 45;
    g.fillStyle = `rgb(${shade + 12},${shade - 2},${shade - 16})`;
    g.fillRect(0, y, s, h);
    y += h;
    g.fillStyle = 'rgba(20,16,12,0.6)';
    g.fillRect(0, y, s, 2.4);
  }
});
const awningCanvas = makeCanvas(128, (g, s) => {           // striped cart awning
  const cols = ['#c8503c', '#f2e3c8'];
  const w = s / 6;
  for (let i = 0; i < 6; i++) { g.fillStyle = cols[i % 2]; g.fillRect(i * w, 0, w, s); }
  g.fillStyle = 'rgba(0,0,0,0.18)'; g.fillRect(0, s - 8, s, 8);
});
const inscriptionCanvas = makeCanvas(512, (g, s) => {      // attic inscription panel
  g.fillStyle = '#e7dcc0'; g.fillRect(0, 0, s, s / 2);
  g.fillStyle = '#8a6d2f'; g.fillRect(0, 0, s, 8); g.fillRect(0, s / 2 - 8, s, 8);
  g.fillRect(0, 0, 8, s / 2); g.fillRect(s - 8, 0, 8, s / 2);
  g.fillStyle = '#4a3416';
  g.font = 'bold 34px Georgia, serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('CONSTANTINVS', s / 2, s / 4 - 12);
  g.font = '20px Georgia, serif';
  g.fillText('S·P·Q·R· liberator', s / 2, s / 4 + 22);
});

const texStone = canvasTexture(stoneCanvas, 2, 2);
const texCobble = canvasTexture(cobbleCanvas, 8, 8);
const texCobbleFine = canvasTexture(cobbleCanvas, 3, 3);
const texPave = canvasTexture(paveCanvas, 6, 6);
const texPavePlaza = canvasTexture(paveCanvas, 3, 2);
const texGrass = canvasTexture(grassCanvas, 5, 5);
const texRock = canvasTexture(rockCanvas, 2, 3);
const texAwning = canvasTexture(awningCanvas, 3, 1);
const texInscription = canvasTexture(inscriptionCanvas, 1, 1);

// ---------------- shared materials ----------------
const M = {
  stone: new THREE.MeshStandardMaterial({ map: texStone, color: 0xd8cba4, roughness: 0.92, metalness: 0.0 }),
  stoneDark: new THREE.MeshStandardMaterial({ color: 0xa3916c, roughness: 0.95 }),
  innerWall: new THREE.MeshStandardMaterial({ color: 0xb3a07a, roughness: 0.95 }),
  seat: new THREE.MeshStandardMaterial({ color: 0xa8825c, roughness: 1.0, side: THREE.DoubleSide }),
  arena: new THREE.MeshStandardMaterial({ color: 0x8d7c5d, roughness: 1.0 }),
  darkHole: new THREE.MeshStandardMaterial({ color: 0x14100c, roughness: 1.0, side: THREE.DoubleSide }),
  marble: new THREE.MeshStandardMaterial({ color: 0xddd6c6, roughness: 0.72 }),
  marbleDark: new THREE.MeshStandardMaterial({ color: 0xb9b2a2, roughness: 0.8 }),
  iron: new THREE.MeshStandardMaterial({ color: 0x2f2f36, roughness: 0.45, metalness: 0.78 }),
  wood: new THREE.MeshStandardMaterial({ color: 0x7a4a28, roughness: 0.85 }),
  woodLight: new THREE.MeshStandardMaterial({ color: 0xa97d4e, roughness: 0.85 }),
  redBus: new THREE.MeshStandardMaterial({ color: 0xc23a2c, roughness: 0.42, metalness: 0.15 }),
  vespa: new THREE.MeshStandardMaterial({ color: 0x3f8f7a, roughness: 0.35, metalness: 0.25 }),
  vespaCream: new THREE.MeshStandardMaterial({ color: 0xf2e8d0, roughness: 0.5 }),
  tire: new THREE.MeshStandardMaterial({ color: 0x1c1c20, roughness: 0.9 }),
  leafA: new THREE.MeshStandardMaterial({ color: 0x3f6d2c, roughness: 0.9, flatShading: true }),
  leafB: new THREE.MeshStandardMaterial({ color: 0x557f33, roughness: 0.9, flatShading: true }),
  leafConifer: new THREE.MeshStandardMaterial({ color: 0x24402a, roughness: 0.95, flatShading: true }),
  pineCanopy: new THREE.MeshStandardMaterial({ color: 0x37542a, roughness: 0.95, flatShading: true }),
  trunk: new THREE.MeshStandardMaterial({ color: 0x5e4128, roughness: 0.95 }),
  lampGlass: new THREE.MeshStandardMaterial({ color: 0xfff2c4, emissive: 0xffc26a, emissiveIntensity: 0.0, roughness: 0.4 }),

  cartBody: new THREE.MeshStandardMaterial({ color: 0x2e6f6a, roughness: 0.6 }),
  roofTerracotta: new THREE.MeshStandardMaterial({ color: 0xa8542f, roughness: 0.85, flatShading: true }),
  houseA: new THREE.MeshStandardMaterial({ color: 0xe6c26a, roughness: 0.85 }),
  houseB: new THREE.MeshStandardMaterial({ color: 0xcf8a5f, roughness: 0.85 }),
  houseC: new THREE.MeshStandardMaterial({ color: 0xd9b8d0, roughness: 0.85 }),
  water: new THREE.MeshStandardMaterial({ color: 0x3f7f8f, roughness: 0.15, metalness: 0.1, transparent: true, opacity: 0.9 }),
};

const glowSprites = [];   // { sprite, baseScale }
const nightMaterials = []; // { mat, max }

// ---------------- sky ----------------
const skyUniforms = {
  topColor: { value: new THREE.Color(0x4f9bc4) },
  horizonColor: { value: new THREE.Color(0xcfe3e6) },
  bottomColor: { value: new THREE.Color(0x9fb8ab) },
  sunDir: { value: new THREE.Vector3(0, 1, 0) },
  glowColor: { value: new THREE.Color(0xffe6a8) },
  glowStrength: { value: 0.8 },
};
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  fog: false,
  uniforms: skyUniforms,
  vertexShader: `
    varying vec3 vDir;
    void main() {
      vDir = position;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform vec3 topColor; uniform vec3 horizonColor; uniform vec3 bottomColor;
    uniform vec3 sunDir; uniform vec3 glowColor; uniform float glowStrength;
    varying vec3 vDir;
    void main() {
      vec3 d = normalize(vDir);
      float h = d.y;
      vec3 sky = h >= 0.0
        ? mix(horizonColor, topColor, pow(clamp(h, 0.0, 1.0), 0.62))
        : mix(horizonColor, bottomColor, clamp(-h * 2.4, 0.0, 1.0));
      float s = pow(max(dot(d, normalize(sunDir)), 0.0), 60.0);

      gl_FragColor = vec4(sky, 1.0);
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(380, 32, 20), skyMat);
scene.add(sky);

// ---------------- stars ----------------
const starGeo = new THREE.BufferGeometry();
{
  const N = 420, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    // random point on upper hemisphere of a large sphere
    const u = rng() * 2 - 1, th = rng() * Math.PI * 2, r = Math.sqrt(1 - u * u) * 340;

}
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0, depthWrite: false });
const stars = new THREE.Points(starGeo, starMat);

// ---------------- sun & moon ----------------
const glowTexture = (() => {

  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 2, 64, 64, 64);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.25, 'rgba(255,255,255,0.55)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');

}
const sunMesh = new THREE.Mesh(new THREE.CircleGeometry(9, 24), new THREE.MeshBasicMaterial({ color: 0xfff3c0, fog: false }));
const sunGlow = makeGlowSprite(0xffe9a8, 95);
sunGlow.material.opacity = 0.85;
const moonMesh = new THREE.Mesh(new THREE.CircleGeometry(6, 20), new THREE.MeshBasicMaterial({ color: 0xf2efe0, fog: false, visible: false }));
const moonGlow = makeGlowSprite(0xbcccff, 40);
moonGlow.material.opacity = 0.35; moonGlow.visible = false;
scene.add(sunMesh, sunGlow, moonMesh, moonGlow);

const hemiLight = new THREE.HemisphereLight(0xbfd9e8, 0x8f7a55, 0.85);

// point lights over plaza (lit at night)
const plazaLampLights = [];
for (const p of [[-5.5, 4.3, 4.8], [5.8, 4.3, -2.0], [-9.5, 4.3, -2.6]]) {

}

// =====================================================================
//  ISLAND
// =====================================================================

scene.add(island);

const topSlab = new THREE.Mesh(
  new THREE.BoxGeometry(64, 2.4, 64),
  [
    new THREE.MeshStandardMaterial({ color: 0x6b4a2c, roughness: 1 }),  // px soil

    new THREE.MeshStandardMaterial({ color: 0x4a3320, roughness: 1 }),  // ny
    new THREE.MeshStandardMaterial({ color: 0x5d3f26, roughness: 1 }),  // pz

  ]
);
topSlab.position.y = -1.2;
topSlab.receiveShadow = true; topSlab.castShadow = true;

// irregular tapered rock underneath
function rockGeometry(rTop, rBottom, height, radialSegs, seed) {
  const geo = new THREE.CylinderGeometry(rTop, rBottom, height, radialSegs, 3, false);
  const posA = geo.attributes.position;
  const j = mulberry32(seed);
  for (let i = 0; i < posA.count; i++) {
    const y = posA.getY(i);
    const ang = Math.atan2(posA.getZ(i), posA.getX(i));
    const jitter = 1 + (j() - 0.5) * 0.55;
    if (Math.abs(y) < height / 2 - 0.01) {
      posA.setX(i, posA.getX(i) * jitter);
      posA.setZ(i, posA.getZ(i) * jitter);
    }
  }
  geo.computeVertexNormals();
  return geo;
}

function ellipseShapeWithHole(aOut, bOut, aIn, bIn) {

function archHole(w, sill, rise) {
  // arch hole path (opening starts at `sill` above ground)
  const r = w / 2;
  const p = new THREE.Path();
  p.moveTo(-r, sill);
  p.lineTo(-r, rise - r);
  p.absarc(0, rise - r, r, Math.PI, 0, true);
  p.lineTo(r, sill);
  p.lineTo(-r, sill);
  return p;
}
function rectangleHole(w, h, yBottom) {
  const p = new THREE.Path();
  p.moveTo(-w / 2, yBottom);
  p.lineTo(w / 2, yBottom);
  p.lineTo(w / 2, yBottom + h);
  p.lineTo(-w / 2, yBottom + h);
  p.lineTo(-w / 2, yBottom);
  return p;
}

  const hw = tier.w / 2;
  shape.moveTo(-hw, 0); shape.lineTo(hw, 0); shape.lineTo(hw, tier.h); shape.lineTo(-hw, tier.h); shape.closePath();
  let hole;
  if (tier.windows) hole = rectangleHole(0.72, 0.78, 1.35);
  else hole = archHole(tier.w * 0.66, tier.sill, tier.rise);
  shape.holes.push(hole);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: tier.thick, bevelEnabled: false, curveSegments: 10 });

  const mesh = new THREE.Mesh(geo, TIER_COLORS[TIERS.indexOf(tier)]);

  // gather matrices for bays around the full ring

  for (let j = 0; j < BAYS; j++) {

    items.push({ px, pz, ry: Math.atan2(n.x, n.y), y: tier.y0 });
  }
  const inst = new THREE.InstancedMesh(geo, TIER_COLORS[TIERS.indexOf(tier)], items.length);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), sc = new THREE.Vector3(1, 1, 1);
  items.forEach((it, idx) => {

}

function makeHouse(x, z, w, h, d, bodyMat, roofColor = 0xa8542f, ry = 0) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bodyMat);
  body.position.y = h / 2;
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w, d) * 0.78, h * 0.52, 4), new THREE.MeshStandardMaterial({ color: roofColor, roughness: 0.85, flatShading: true }));
  roof.position.y = h + h * 0.26;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  g.add(roof);
  // windows (lit at night)
  const winGeo = new THREE.PlaneGeometry(0.72, 0.9);
  const positions = [
    [-w / 4, h * 0.62, d / 2 + 0.02, 0],
    [w / 4, h * 0.62, d / 2 + 0.02, 0],
    [-w / 4, h * 0.28, d / 2 + 0.02, 0],
    [w / 4, h * 0.28, d / 2 + 0.02, 0],
  ];
  for (const [wx, wy, wz, _] of positions) {
    const win = new THREE.Mesh(winGeo, M.nightWindow);
    win.position.set(wx, wy, wz);
    g.add(win); houseWindows.push(win);
  }
  g.position.set(x, 0, z);
  g.rotation.y = ry;
  island.add(g);
  return g;
}

function placeTrees() {
  const zones = [
    { c: new THREE.Vector2(-13, -13), r: 14.5 },   // colosseum
    { c: new THREE.Vector2(13.5, -12.5), r: 7.5 }, // arch
    { c: new THREE.Vector2(15, 13), r: 8.5 },     // forum
    { c: new THREE.Vector2(-21.5, 12.5), r: 4.6 }, // houses
    { c: new THREE.Vector2(-22.5, -4.5), r: 4.6 },
    { c: new THREE.Vector2(23.5, 9.5), r: 4.6 },
    { c: new THREE.Vector2(-1.5, 2.5), r: 13.6 }, // plaza + ring road
  ];
  const candidates = [];
  for (let i = 0; i < 400 && candidates.length < 34; i++) {
    const x = rand(-29, 29), z = rand(-29, 29);
    if (Math.abs(x - -1.5) < 2.6 && Math.abs(z) < 31) { /* x lane near south path? */ }
    // avoid paths
    if ((Math.abs(z - 2.5) < 2.6 && x > -14 && x < 31) || (Math.abs(x - -1.5) < 2.6 && Math.abs(z) < 31)) continue;
    let ok = true;
    for (const zn of zones) if (Math.hypot(x - zn.c.x, z - zn.c.y) < zn.r) { ok = false; break; }
    if (!ok) continue;
    candidates.push([x, z]);
  }
  return candidates;
}

function phaseName(t) {

  }

function updateDayNight(t) {
  // sun elevation angle: 0 at midnight/just past dawn, max at noon (t=0.5)
  const theta = (t - 0.5) * Math.PI * 2;
  const sunY = Math.sin(theta);              // -1 midnight, +1 noon
  const sunEl = Math.asin(clamp(sunY, -1, 1));
  const dayF = smoothstep(-0.05, 0.28, sunY);       // 0 night -> 1 day
  const sunsetF = clamp(1 - Math.abs(sunY - 0.12) * 3.4, 0, 1) * smoothstep(-0.12, 0.0, sunY); // warm at low sun
  const nightF = 1 - dayF;

  // sun azimuth sweeps east->west across the sky
  const sunAz = t * Math.PI * 2 + Math.PI * 0.0; // start: south-ish at midnight (below horizon)
  const sunDir = new THREE.Vector3(
    Math.cos(sunAz) * Math.cos(sunEl) * 1.0,
    sunY,
    Math.sin(sunAz) * Math.cos(sunEl) * 1.0
  ).normalize();
  // adjust so noon sun sits roughly toward camera-left-back: keep name "sun in front" simple
  // (x>0 east at dawn when t=0.25: sin? want east at dawn (t=.25), west at sunset (t=.75))
  sunDir.x = Math.cos(sunAz) * Math.cos(sunEl);
  sunDir.y = sunY;
  sunDir.z = Math.sin(sunAz) * Math.cos(sunEl) * 0.85;
  sunDir.normalize();

  // sky colors by blending day<->sunset<->night
  colTmp.copy(SUN_ZENITH_COLORS.skyTopNight).lerp(SUN_ZENITH_COLORS.skyTopDay, dayF);
  colTmp.lerp(SUN_ZENITH_COLORS.skyTopSunset, sunsetF * 0.75);
  const skyTop = colTmp.clone();
  colTmp.copy(SUN_ZENITH_COLORS.horizonNight).lerp(SUN_ZENITH_COLORS.horizonDay, dayF);
  colTmp.lerp(SUN_ZENITH_COLORS.horizonSunset, sunsetF);
  const skyHorizon = colTmp.clone();
  colTmp.copy(SUN_ZENITH_COLORS.bottomNight).lerp(SUN_ZENITH_COLORS.bottomDay, dayF);
  colTmp.lerp(SUN_ZENITH_COLORS.bottomSunset, sunsetF);
  const skyBottom = colTmp.clone();

  skyUniforms.topColor.value.copy(skyTop);
  skyUniforms.horizonColor.value.copy(skyHorizon);
  skyUniforms.bottomColor.value.copy(skyBottom);
  skyUniforms.sunDir.value.copy(sunDir);
  skyUniforms.glowColor.value.set(0xff9a4a).lerp(new THREE.Color(0xfff6c8), clamp(sunY * 2, 0, 1));
  skyUniforms.glowStrength.value = 0.35 + sunsetF * 1.15 + (1 - nightF) * 0.35;

  scene.background = skyHorizon.clone().multiplyScalar(0.92); // matches horizon

  // lights
  sunLight.position.copy(sunDir).multiplyScalar(95);
  const sunI = smoothstep(-0.05, 0.16, sunY) * (1.15 + 1.5 * clamp(sunY, 0, 1)) * (1 - sunsetF * 0.25);
  sunLight.intensity = sunI;
  colTmp2.copy(SUN_COLORS.low).lerp(SUN_COLORS.noon, clamp(sunY * 2.4, 0, 1));
  sunLight.color.copy(colTmp2);

  // moon: rises where sun sets
  const moonDir = new THREE.Vector3(-sunDir.x, Math.max(0.35, -sunDir.y), -sunDir.z).normalize();
  moonLight.position.copy(moonDir).multiplyScalar(95);
  moonLight.intensity = nightF * 0.5;

  hemiLight.intensity = 0.16 + dayF * 0.85;
  hemiLight.color.copy(HEMI.nightSky).lerp(HEMI.daySky, dayF);
  hemiLight.groundColor.copy(HEMI.nightGround).lerp(HEMI.dayGround, dayF);

  // sun/moon meshes in the sky
  sunMesh.position.copy(sunDir).multiplyScalar(330);
  sunMesh.lookAt(camera.position);
  sunMesh.visible = sunY > -0.08;
  sunGlow.position.copy(sunDir).multiplyScalar(330);
  sunGlow.visible = sunY > -0.1;
  sunGlow.material.opacity = 0.5 + sunsetF * 0.4;
  moonMesh.position.copy(moonDir).multiplyScalar(330);
  moonMesh.lookAt(camera.position);
  moonMesh.visible = nightF > 0.4;
  moonGlow.position.copy(moonDir).multiplyScalar(330);
  moonGlow.visible = nightF > 0.4;

  starMat.opacity = nightF;

  // warm light at sunset for lamps/windows slightly before full night
  const lampLevel = smoothstep(0.12, -0.28, sunY); // ramps as sun gets low/below
  for (const { mat, max } of nightMaterials) mat.emissiveIntensity = lampLevel * max;
  for (const pl of plazaLampLights) pl.intensity = lampLevel * 30;
  for (const { sprite } of glowSprites) sprite.material.opacity = lampLevel * 1.0;
  for (const win of houseWindows) { /* shared material */ }

  // window glow + star sky handled through shared materials
  M.nightWindow.emissiveIntensity = lampLevel * 2.6;
  // cloud tint
  colTmp.copy(new THREE.Color(0x8a93b8)).lerp(new THREE.Color(0xffffff), dayF);
  colTmp.lerp(new THREE.Color(0xffb08a), sunsetF * 0.85);
  cloudMat.color.copy(colTmp);
  cloudMat.opacity = 0.55 + dayF * 0.35;

  // phase label
  const key = phaseName(t) + '|' + phaseEmoji(t);
  if (key !== lastPhaseKey) {
    lastPhaseKey = key;
    phaseEl.innerHTML = `${phaseEmoji(t)}&nbsp;&nbsp;${phaseName(t)}`;
  }
}

// =====================================================================
//  CAMERA RIG / CONTROLS
// =====================================================================
const BASE_AZIMUTH = Math.PI / 4;
const SNAP = Math.PI / 2;
const snapAzimuth = (a) => BASE_AZIMUTH + Math.round((a - BASE_AZIMUTH) / SNAP) * SNAP;

const controlsEl = document.getElementById('controls');
const el = (id) => document.getElementById(id);
const rotLeft = el('rotLeft'), rotRight = el('rotRight'), pauseBtn = el('pauseCycle');
const pauseLbl = el('pauseLbl');
const pauseIcon = document.getElementById('pauseIcon');

function rotateView(dir) {
  const snapped = snapAzimuth(state.azimuthTarget);
  state.azimuthTarget = snapped + dir * SNAP;
}
rotLeft.addEventListener('click', () => rotateView(1));
rotRight.addEventListener('click', () => rotateView(-1));

const PAUSE_SVG = '<rect x="7" y="5" width="3.6" height="14" rx="1"/><rect x="13.4" y="5" width="3.6" height="14" rx="1"/>';
const PLAY_SVG = '<path d="M9 5.5v13l11-6.5z"/>';
pauseBtn.addEventListener('click', () => {
  state.playing = !state.playing;
  pauseLbl.textContent = state.playing ? 'Pause' : 'Resume';
  pauseIcon.innerHTML = state.playing ? PAUSE_SVG : PLAY_SVG;
});

const elCanvas = renderer.domElement;
elCanvas.addEventListener('pointerdown', (e) => {
  state.dragging = true;
  state.lastPointerX = e.clientX;
  elCanvas.setPointerCapture(e.pointerId);
});
elCanvas.addEventListener('pointermove', (e) => {
  if (!state.dragging) return;
  const dx = e.clientX - state.lastPointerX;
  state.lastPointerX = e.clientX;
  state.azimuthTarget -= dx * 0.0085;
});
const endDrag = (e) => {
  if (!state.dragging) return;
  state.dragging = false;
  state.azimuthTarget = snapAzimuth(state.azimuthTarget);
};
elCanvas.addEventListener('pointerup', endDrag);
elCanvas.addEventListener('pointercancel', endDrag);
elCanvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 1.10 : 0.90;
  state.zoomTarget = clamp(state.zoomTarget * factor, 0.68, 1.9);
}, { passive: false });

function updateCamera(dt) {
  state.azimuth = damp(state.azimuth, state.azimuthTarget, 7.5, dt);
  state.zoom = damp(state.zoom, state.zoomTarget, 7.5, dt);
  const radius = 150, elAngle = 0.62; // ≈ 35.5° isometric elevation
  const ce = Math.cos(elAngle), se = Math.sin(elAngle);
  const cx = Math.sin(state.azimuth) * ce, cz = Math.cos(state.azimuth) * ce;
  camera.position.set(cx * radius + state.aimX, se * radius, cz * radius + state.aimZ);
  camera.lookAt(state.aimX, -2.5, state.aimZ);
  camera.zoom = state.zoom;
  camera.updateProjectionMatrix();
}

// =====================================================================
//  ANIMATION LOOP
// =====================================================================
let lastFrameTime = performance.now();
let elapsedTime = 0;
const vehicleEllipse = (v, theta) => new THREE.Vector3(
  -1.5 + v.a * Math.cos(theta),
  0,
  2.5 + v.b * Math.sin(theta)
);
const vehicleTangent = (v, theta) => {
  const t = new THREE.Vector2(-v.a * Math.sin(theta), v.b * Math.cos(theta));
  return t.normalize();
};

function animate() {
  const nowMs = performance.now();
  const dt = Math.min((nowMs - lastFrameTime) / 1000, 0.05);
  lastFrameTime = nowMs;
  elapsedTime += dt;
  const tNow = elapsedTime;

  if (state.playing) state.time = ((state.time + dt / 60) % 1 + 1) % 1;

  updateDayNight(state.time);
  updateCamera(dt);

  // island float
  island.position.y = Math.sin(tNow * 0.7) * 0.4;
  island.rotation.y = Math.sin(tNow * 0.11) * 0.006;

  // vehicles going round
  for (const v of vehicles) {
    const theta = tNow * v.speed + v.phase;
    const p = vehicleEllipse(v, theta);
    const tan = vehicleTangent(v, theta);
    v.group.position.set(p.x, 0.0 + Math.abs(Math.sin(tNow * 9)) * 0.008, p.z);
    v.group.rotation.y = Math.atan2(-tan.y, tan.x) + (v.speed < 0 ? Math.PI : 0);
    if (!v.isBus) v.group.rotation.y = Math.atan2(-tan.y, tan.x) + (v.speed < 0 ? Math.PI : 0);
  }

  // people along routes (ping-pong)
  for (const person of people) {
    const route = person.route;
    const span = route.a.distanceTo(route.b);
    let tt = (tNow * person.speed * 0.16 + person.offset) % 2;
    let u = tt < 1 ? tt : 2 - tt;
    const bob = Math.abs(Math.sin(tNow * 7 + person.bob)) * 0.055;
    person.group.position.lerpVectors(route.a, route.b, u);
    person.group.position.y = bob;
    // face along movement direction (horizontal only)
    const dirSign = tt < 1 ? 1 : -1;
    const dir = new THREE.Vector3().subVectors(route.b, route.a).multiplyScalar(dirSign).normalize();
    if (dir.lengthSq() > 0.001) person.group.rotation.y = Math.atan2(dir.x, dir.z);
    person.group.rotation.y += Math.sin(tNow * 1.7 + person.bob) * 0.08;
  }

  // clouds drift
  for (const c of clouds) {
    c.group.position.x += c.speed * dt;
    if (c.group.position.x > 85) c.group.position.x = -85;
  }
  // birds circle and flap
  for (const b of birds) {
    const a = tNow * b.speed + b.phase;
    b.bird.position.set(b.center.x + Math.cos(a) * b.r, b.h + Math.sin(tNow * 1.4 + b.phase) * 0.7, b.center.z + Math.sin(a) * b.r);
    b.bird.rotation.y = -a - Math.PI / 2;
    const flap = Math.sin(tNow * 9 + b.phase * 3) * 0.55;
    b.wingL.rotation.z = flap + 0.12;
    b.wingR.rotation.z = -flap - 0.12;
  }

  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  const a = aspect();
  camera.left = -HALF_H * a; camera.right = HALF_H * a;
  camera.top = HALF_H; camera.bottom = -HALF_H;
  camera.updateProjectionMatrix();
});

window.__diorama = { scene, camera, renderer };
</script>
</body>
